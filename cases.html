  <!-- ===================== CASES ===================== -->
  <section class="section" id="cases">
    <div class="wrap">
      <div class="case-roulette" aria-label="随机方案">
        <div class="cr-head">
          <button class="cr-btn" id="caseRouletteBtn" type="button" aria-label="随机翻一个方案">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h4l3 5-3 5H4M20 7h-4l-3 5 3 5h4M7 4 4 7l3 3M17 20l3-3-3-3"/></svg>
          </button>
        </div>
        <div class="cr-viewport">
          <div class="cr-track" id="caseRouletteTrack"></div>
        </div>
      </div>

      <header class="sec-head reveal">
        <div>
          <p class="eyebrow"><span class="star">✳</span> <span data-ekey="cases.eyebrow">SELECTED SOLUTIONS</span></p>
          <h2><em data-ekey="cases.title.lead">围绕个人、商业、学习、成长</em><span class="case-title-suffix" data-ekey="cases.title.suffix">的赋能方案</span></h2>
        </div>
        <p class="sec-desc" data-ekey="cases.desc">不是教程，也不是 Demo 合集。每一套方案都从真实需求长出来：先自己用，再一点点改到顺手，最后把具体做法、工具和结果一起留下来。</p>
      </header>

      <div class="toolbar">
        <div class="chips" id="filters" role="tablist" aria-label="按类别筛选"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="搜索方案、工具或关键词" aria-label="搜索方案">
        </label>
      </div>

      <div class="grid" id="caseGrid"></div>
      <p class="empty" id="emptyState">没有找到匹配的方案，换个关键词试试。</p>
    </div>
  </section>

</main>
