<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="项目管理表模板示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d1c"/>
      <stop offset="0.55" stop-color="#101538"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#3370ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3370ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#05030f" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#3370ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ef0c0"/><stop offset="1" stop-color="#22c78e"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc978"/><stop offset="1" stop-color="#ff9f3c"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#g1)"/>
  <rect width="1600" height="1000" fill="url(#g2)"/>

  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <path d="M0 860 L1600 520"/><path d="M0 940 L1600 600"/><path d="M0 1020 L1600 680"/>
  </g>

  <g transform="rotate(-5 800 520)" filter="url(#shadow)">
    <rect x="150" y="170" width="1300" height="700" rx="26" fill="#0e1330" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="150" y="170" width="1300" height="80" rx="26" fill="#ffffff" fill-opacity="0.04"/>
    <rect x="150" y="230" width="1300" height="20" fill="#ffffff" fill-opacity="0.04"/>

    <g>
      <circle cx="186" cy="210" r="6" fill="#ff6b6b" fill-opacity="0.8"/>
      <circle cx="208" cy="210" r="6" fill="#ffd166" fill-opacity="0.8"/>
      <circle cx="230" cy="210" r="6" fill="#4ade80" fill-opacity="0.8"/>
      <text x="262" y="217" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" fill="#dfe6ff" fill-opacity="0.92">项目管理 · 2026</text>
      <rect x="1258" y="192" width="156" height="36" rx="18" fill="#3370ff" fill-opacity="0.18" stroke="#5b8cff" stroke-opacity="0.45"/>
      <text x="1336" y="216" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#9dbcff">5 个项目</text>
    </g>

    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <text x="186" y="292" font-size="17" fill="#8b93c9" letter-spacing="1">项目 / 任务</text>
      <text x="560" y="292" font-size="17" fill="#8b93c9" letter-spacing="1">板块</text>
      <text x="740" y="292" font-size="17" fill="#8b93c9" letter-spacing="1">负责人</text>
      <text x="900" y="292" font-size="17" fill="#8b93c9" letter-spacing="1">状态</text>
      <text x="1060" y="292" font-size="17" fill="#8b93c9" letter-spacing="1">进度</text>
      <line x1="170" y1="312" x2="1430" y2="312" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>

    <!-- row 1 -->
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <rect x="170" y="328" width="1260" height="92" fill="url(#rowGlow)"/>
      <circle cx="196" cy="374" r="5" fill="#6ea8ff"/>
      <text x="216" y="368" font-size="21" fill="#e9eeff">案例库网站上线</text>
      <text x="216" y="396" font-size="15" fill="#7e88b8">设计 · 开发 · 内容</text>
      <text x="560" y="382" font-size="18" fill="#aab4e0">产品</text>
      <text x="740" y="382" font-size="18" fill="#aab4e0">小P</text>
      <rect x="900" y="360" width="92" height="34" rx="17" fill="#3370ff" fill-opacity="0.18" stroke="#5b8cff" stroke-opacity="0.4"/>
      <text x="946" y="383" text-anchor="middle" font-size="16" fill="#9dbcff">进行中</text>
      <rect x="1060" y="372" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1060" y="372" width="154" height="10" rx="5" fill="url(#bar1)"/>
      <text x="1300" y="383" font-size="16" fill="#9aa5d6">70%</text>
    </g>

    <!-- row 2 -->
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <circle cx="196" cy="466" r="5" fill="#4ade80"/>
      <text x="216" y="460" font-size="21" fill="#e9eeff">开说 · 第 12 场海报</text>
      <text x="216" y="488" font-size="15" fill="#7e88b8">设计 · 交付</text>
      <text x="560" y="474" font-size="18" fill="#aab4e0">设计</text>
      <text x="740" y="474" font-size="18" fill="#aab4e0">阿图</text>
      <rect x="900" y="452" width="92" height="34" rx="17" fill="#22c78e" fill-opacity="0.16" stroke="#38d9a9" stroke-opacity="0.4"/>
      <text x="946" y="475" text-anchor="middle" font-size="16" fill="#7ef0c0">已完成</text>
      <rect x="1060" y="464" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1060" y="464" width="220" height="10" rx="5" fill="url(#bar2)"/>
      <text x="1300" y="475" font-size="16" fill="#9aa5d6">100%</text>
      <line x1="170" y1="512" x2="1430" y2="512" stroke="#ffffff" stroke-opacity="0.06"/>
    </g>

    <!-- row 3 -->
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <circle cx="196" cy="572" r="5" fill="#ffc978"/>
      <text x="216" y="566" font-size="21" fill="#e9eeff">Q4 内容排期</text>
      <text x="216" y="594" font-size="15" fill="#7e88b8">内容 · 传播</text>
      <text x="560" y="580" font-size="18" fill="#aab4e0">内容</text>
      <text x="740" y="580" font-size="18" fill="#aab4e0">云朵</text>
      <rect x="900" y="558" width="92" height="34" rx="17" fill="#ff9f3c" fill-opacity="0.16" stroke="#ffb664" stroke-opacity="0.4"/>
      <text x="946" y="581" text-anchor="middle" font-size="16" fill="#ffca8a">待开始</text>
      <rect x="1060" y="570" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1060" y="570" width="44" height="10" rx="5" fill="url(#bar3)"/>
      <text x="1300" y="581" font-size="16" fill="#9aa5d6">20%</text>
      <line x1="170" y1="618" x2="1430" y2="618" stroke="#ffffff" stroke-opacity="0.06"/>
    </g>

    <!-- row 4 -->
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <circle cx="196" cy="678" r="5" fill="#c4b5fd"/>
      <text x="216" y="672" font-size="21" fill="#e9eeff">成长系统 · 主线设计器</text>
      <text x="216" y="700" font-size="15" fill="#7e88b8">产品 · 迭代</text>
      <text x="560" y="686" font-size="18" fill="#aab4e0">产品</text>
      <text x="740" y="686" font-size="18" fill="#aab4e0">小P</text>
      <rect x="900" y="664" width="92" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="946" y="687" text-anchor="middle" font-size="16" fill="#c4b5fd">复盘中</text>
      <rect x="1060" y="676" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1060" y="676" width="188" height="10" rx="5" fill="url(#bar4)"/>
      <text x="1300" y="687" font-size="16" fill="#9aa5d6">85%</text>
      <line x1="170" y1="724" x2="1430" y2="724" stroke="#ffffff" stroke-opacity="0.06"/>
    </g>

    <!-- row 5 -->
    <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <circle cx="196" cy="784" r="5" fill="#ff8b8b"/>
      <text x="216" y="778" font-size="21" fill="#e9eeff">AI 漫剧第二集</text>
      <text x="216" y="806" font-size="15" fill="#7e88b8">实验 · 待定</text>
      <text x="560" y="792" font-size="18" fill="#aab4e0">实验</text>
      <text x="740" y="792" font-size="18" fill="#aab4e0">—</text>
      <rect x="900" y="770" width="92" height="34" rx="17" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff8b8b" stroke-opacity="0.35"/>
      <text x="946" y="793" text-anchor="middle" font-size="16" fill="#ffb3b3">已阻塞</text>
      <rect x="1060" y="782" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1060" y="782" width="18" height="10" rx="5" fill="#ff8b8b" fill-opacity="0.7"/>
      <text x="1300" y="793" font-size="16" fill="#9aa5d6">5%</text>
    </g>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="150" y="120" font-size="18" fill="#8fa2ff" letter-spacing="5">FEISHU BASE · TEMPLATE</text>
    <text x="150" y="165" font-size="30" fill="#eef2ff" fill-opacity="0.9">一张表，装下一个项目的全部上下文</text>
  </g>

  <g transform="translate(1180 760)">
    <rect x="0" y="0" width="250" height="120" rx="20" fill="#0b1029" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="28" y="46" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#8b93c9">本周推进</text>
    <text x="28" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#dfe6ff">12 / 18</text>
    <rect x="150" y="78" width="72" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="150" y="78" width="48" height="10" rx="5" fill="#6ea8ff"/>
  </g>
</svg>
