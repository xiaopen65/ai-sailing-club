<!-- APPLY MODAL -->
<div class="xmodal" id="exchangeModal" hidden>
  <div class="xmodal-backdrop" data-xclose></div>
  <div class="xmodal-card" role="dialog" aria-modal="true" aria-labelledby="xTitle">
    <button class="xmodal-close" type="button" data-xclose aria-label="关闭">×</button>

    <div id="xFormWrap">
      <p class="eyebrow"><span class="star">✳</span> EXCHANGE REQUEST</p>
      <h3 id="xTitle">申请交换</h3>
      <p class="x-with" id="xWith"></p>
      <form id="exchangeForm">
        <div class="field">
          <label for="xWant">你想和 TA 交换什么 *</label>
          <textarea id="xWant" rows="3" placeholder="例如：我想请你帮我看一下课程结构，我可以帮你把 AI 工作流跑通。" required></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="xPhone">你的手机号 *</label>
            <input type="tel" id="xPhone" placeholder="用于接收确认短信" required>
          </div>
          <div class="field">
            <label for="xTime">期望时间</label>
            <select id="xTime">
              <option>本周内</option>
              <option>下周</option>
              <option>时间灵活</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-lime" type="submit">发送交换申请</button>
        </div>
        <p class="x-note">提交后会向双方发送短信确认；24 小时内未完成确认，本次交换会被冻结。当前为前端演示，短信不会真实发送。</p>
      </form>
    </div>

    <div id="xStatus" class="xstatus" hidden>
      <span class="status-chip" id="xStatusChip">待确认</span>
      <h3 id="xStatusTitle">申请已发出</h3>
      <p id="xStatusText"></p>
      <div class="xmodal-actions">
        <button class="qbtn primary" type="button" id="xConfirm">模拟对方确认</button>
        <button class="qbtn" type="button" id="xTimeout">模拟 24h 未确认</button>
        <button class="qbtn" type="button" data-xclose>完成</button>
      </div>
      <p class="x-note">真实上线时，确认按钮会被短信服务替代；未确认的申请由服务器定时冻结。</p>
    </div>
  </div>
</div>
