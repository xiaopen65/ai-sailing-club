function boardMarkdown(board) {
  const m = board?.mode ? MODE_META[board.mode] : null;
  if (!m) return `# ${board?.title || '业务拆解'}\n\n还没有选择拆解对象。`;
  const segments = Array.isArray(board.segments) ? board.segments : [];
  const dimensions = Array.isArray(board.dimensions) ? board.dimensions : [];
  const total = segments.length * dimensions.length;
  let filled = 0;
  segments.forEach(segment => dimensions.forEach(dimension => {
    const cell = board.cells?.[`${segment.id}::${dimension.id}`];
    if (cell && ((cell.text || '').trim() || (cell.tags || []).length)) filled += 1;
  }));
  const percent = total ? Math.round(filled / total * 100) : 0;
  const lines = [
    `# ${displayTitle(board)}`, '', `- 模式：${m.label}`,
    `- ${m.root}：${board.root?.title || '未填写'}`,
    board.mode === 'tasks' && board.root?.result ? `- ${m.result}：${board.root.result}` : '',
    board.mode === 'tasks' && board.root?.deadline && board.root.deadline !== board.root.title ? `- ${m.deadline}：${board.root.deadline}` : '',
    `- 完成度：${percent}%（${filled} / ${total} 格）`, '', `## 横轴 · ${segments.length} 列`, ''
  ].filter(Boolean);
  segments.forEach((segment, index) => {
    const extras = board.mode === 'tasks' ? [segment.result, segment.deadline].filter(Boolean).join(' · ') : '';
    lines.push(`${index + 1}. **${segment.title || '未命名'}**${extras ? `｜${extras}` : ''}`);
  });
  lines.push('', '## 竖轴矩阵', '');
  if (dimensions.length) {
    const clean = value => String(value || '').replace(/\|/g, '\\|').replace(/\r?\n/g, '<br>');
    lines.push(`| 维度 | ${segments.map(item => clean(item.title || '未命名')).join(' | ')} |`);
    lines.push(`| --- | ${segments.map(() => '---').join(' | ')} |`);
    dimensions.forEach(dimension => {
      const values = segments.map(segment => {
        const cell = board.cells?.[`${segment.id}::${dimension.id}`] || { text:'', tags:[] };
        return clean([...(cell.tags || []), (cell.text || '').trim()].filter(Boolean).join('；'));
      });
      lines.push(`| ${clean(dimension.title)} | ${values.join(' | ')} |`);
    });
  } else lines.push('_还没有选择竖轴维度。_');
  lines.push('', '---', `由「业务拆解器」生成 · ${new Date().toLocaleString('zh-CN')}`);
  return lines.join('\n');
}

function markdown() { return boardMarkdown(state); }

function safeFilename(name) { return (name || '业务拆解').replace(/[\\/:*?"<>|]/g, '-').slice(0, 60); }
function downloadFile(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}
function exportMarkdown() {
  if (!state.mode) { toast('还没有可导出的拆解', 'error'); return; }
  downloadFile(`${safeFilename(displayTitle(state))}.md`, markdown(), 'text/markdown;charset=utf-8');
  toast('Markdown 已导出', 'success');
}
function exportSelectedBoards(format = 'json') {
  const boards = selectedHistoryBoards();
  if (!boards.length) { toast('先勾选要导出的拆解', 'error'); return; }
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  if (format === 'markdown') {
    const content = boards.map(boardMarkdown).join('\n\n\n');
    downloadFile(`业务拆解器-所选-${boards.length}份-${stamp}.md`, content, 'text/markdown;charset=utf-8');
    toast(`已导出所选 ${boards.length} 份 Markdown`, 'success');
    return;
  }
  const payload = { type:'business-decomposer.backup', version:2, exportedAt:new Date().toISOString(), boards };
  downloadFile(`业务拆解器-所选-${boards.length}份-${stamp}.json`, JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
  toast(`已导出所选 ${boards.length} 份 JSON`, 'success');
}
function triggerImport() { $('#importFile').click(); }

function readTextFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error || new Error('read'));
    reader.readAsText(file, 'utf-8');
  });
}

async function importJSON(files) {
  const fileList = (Array.isArray(files) ? files : files ? [files] : []).filter(Boolean);
  if (!fileList.length) return;
  const keepHistoryOpen = ui.modal === 'history';
  const importedById = new Map();
  let failedFiles = 0;
  for (const file of fileList) {
    try {
      const parsed = JSON.parse(await readTextFile(file));
      let payloads = [];
      if (parsed && parsed.type === 'business-decomposer.backup' && Array.isArray(parsed.boards)) payloads = parsed.boards;
      else if (Array.isArray(parsed)) payloads = parsed;
      else payloads = [parsed];
      payloads.forEach(raw => {
        const board = normalizeState(raw);
        if (!board.mode || !(board.root.title.trim() || board.segments.length || board.dimensions.length)) return;
        board.updatedAt = Date.now();
        importedById.set(board.id, board);
      });
    } catch (error) {
      failedFiles += 1;
    }
  }
  const imported = [...importedById.values()];
  if (!imported.length) {
    toast('导入失败：没有找到有效的拆解 JSON', 'error');
    $('#importFile').value = '';
    return;
  }
  imported.forEach(board => {
    const index = library.findIndex(item => item.id === board.id);
    if (index >= 0) library[index] = board;
    else library.unshift(board);
  });
  library.sort((a, b) => b.updatedAt - a.updatedAt);
  library = library.slice(0, 60);
  persistLibrary();
  if (keepHistoryOpen) {
    ui.historySelected = new Set(imported.map(board => board.id));
    renderAll();
  } else {
    state = normalizeState(clone(imported[0]));
    state.title = deriveTitle(state.mode, state.root);
    ui.screen = 'board';
    ui.modal = null;
    ui.sheet = null;
    save();
    renderAll();
  }
  const suffix = failedFiles ? `，${failedFiles} 个文件无法读取` : '';
  toast(`已导入 ${imported.length} 份拆解${suffix}`, failedFiles ? 'error' : 'success');
  $('#importFile').value = '';
}

async function copyText(text, successMessage = '已复制') {
  try {
    await navigator.clipboard.writeText(text);
    toast(successMessage, 'success');
  } catch (error) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); toast(successMessage, 'success'); }
    catch (err) { toast('复制失败，请手动选择文本', 'error'); }
    textarea.remove();
  }
}

function clearAllData() {
  if (!confirm('清空所有历史与当前草稿？这一步无法恢复，建议先导出备份。')) return;
  library = [];
  state = createState();
  try {
    localStorage.removeItem(LIB_KEY);
    localStorage.removeItem(CURRENT_KEY);
  } catch (error) {}
  ui.screen = 'landing';
  ui.modal = null;
  ui.sheet = null;
  renderAll();
  toast('本地数据已清空');
}

function deleteBoard(id) {
  const board = library.find(item => item.id === id);
  if (!board) return;
  if (!confirm(`删除「${displayTitle(board)}」？这一步无法恢复。`)) return;
  const isCurrent = state.id === id;
  library = library.filter(item => item.id !== id);
  ui.historySelected.delete(id);
  persistLibrary();
  if (isCurrent) {
    state = createState();
    ui.screen = 'landing';
    try { localStorage.removeItem(CURRENT_KEY); } catch (error) {}
  }
  renderAll();
  toast('已删除');
}

function deleteSelectedBoards() {
  const ids = selectedHistoryIds();
  if (!ids.length) { toast('先勾选要删除的拆解', 'error'); return; }
  const deleting = new Set(ids);
  const includesCurrent = ids.includes(state.id);
  const message = `删除所选的 ${ids.length} 份拆解？${includesCurrent ? '\n当前打开的拆解也在其中。' : ''}\n这一步无法恢复。`;
  if (!confirm(message)) return;
  library = library.filter(item => !deleting.has(item.id));
  persistLibrary();
  if (includesCurrent) {
    state = createState();
    ui.screen = 'landing';
    try { localStorage.removeItem(CURRENT_KEY); } catch (error) {}
  }
  ui.historySelected.clear();
  renderAll();
  toast(`已删除 ${ids.length} 份拆解`, 'success');
}

document.addEventListener('pointerdown', event => {
  if (event.target.closest('#axisTrack')) startAxisDrag(event);
});

document.addEventListener('click', event => {
  const target = event.target;
  if (target.closest('#brandBtn')) { goHome(); return; }
  if (!target.closest('.history-export-wrap')) closeHistoryExportMenu();

  const modeButton = target.closest('[data-mode]');
  if (modeButton) { startBoard(modeButton.dataset.mode); return; }

  const historyCheck = target.closest('[data-history-check]');
  if (historyCheck) {
    if (historyCheck.checked) ui.historySelected.add(historyCheck.dataset.historyCheck);
    else ui.historySelected.delete(historyCheck.dataset.historyCheck);
    syncHistorySelectionUI();
    return;
  }

  const historySelectAll = target.closest('[data-history-select-all]');
  if (historySelectAll) {
    ui.historySelected = historySelectAll.checked ? new Set(library.map(board => board.id)) : new Set();
    syncHistorySelectionUI();
    return;
  }

  const historyExportToggle = target.closest('[data-history-export-toggle]');
  if (historyExportToggle) {
    const menu = $('#historyExportMenu');
    if (!menu) return;
    menu.hidden = !menu.hidden;
    historyExportToggle.setAttribute('aria-expanded', String(!menu.hidden));
    return;
  }
  const historyExportFormat = target.closest('[data-history-export-format]');
  if (historyExportFormat) {
    closeHistoryExportMenu();
    exportSelectedBoards(historyExportFormat.dataset.historyExportFormat);
    return;
  }
  if (target.closest('[data-history-import]')) { triggerImport(); return; }
  if (target.closest('[data-history-delete]')) { deleteSelectedBoards(); return; }

  const openBoardButton = target.closest('[data-open-board]');
  if (openBoardButton) { openBoard(openBoardButton.dataset.openBoard); return; }

  const deleteBoardButton = target.closest('[data-delete-board]');
  if (deleteBoardButton) { deleteBoard(deleteBoardButton.dataset.deleteBoard); return; }

  const editStepButton = target.closest('[data-edit-step]');
  if (editStepButton) { editStep(Number(editStepButton.dataset.editStep)); return; }

  if (target.closest('[data-prev-step]')) { previousStep(); return; }

  if (target.closest('[data-col-add]')) { addCanvasColumn(); return; }
  if (target.closest('[data-axis-add]')) {
    if (performance.now() >= axisClickLock) addAxisBlock();
    return;
  }
  if (target.closest('[data-vertical-add]')) { openModal('dims'); return; }
  const vdimDelete = target.closest('[data-vdim-del]');
  if (vdimDelete) { removeSetupDimension(vdimDelete.dataset.vdimDel); return; }
  const axisDelete = target.closest('[data-axis-del]');
  if (axisDelete) { removeAxisBlock(axisDelete.closest('.axis-block')); return; }

  if (target.closest('[data-skip-step]')) {
    const form = $('#askForm');
    const input = $('.line-input', form);
    if (input) input.value = '';
    form?.requestSubmit();
    return;
  }

  const openCellButton = target.closest('[data-open-cell]');
  if (openCellButton) { openCell(openCellButton.dataset.cellSeg, openCellButton.dataset.cellDim); return; }

  if (target.closest('[data-analyze-all]')) { openOverallAnalysisSheet(); return; }

  const analyzeButton = target.closest('[data-analyze-dim]');
  if (analyzeButton) { openAnalysisSheet(analyzeButton.dataset.analyzeDim); return; }

  if (target.closest('[data-copy-analysis]')) {
    const text = $('#analysisPromptText')?.value || '';
    if (text.trim()) copyText(text, '提示词已复制');
    return;
  }

  if (target.closest('[data-analysis-regen]')) {
    const dimId = ui.sheet?.dimId;
    if (!dimId) return;
    const prompt = dimId === OVERALL_ANALYSIS_ID ? buildOverallAnalysisPrompt() : buildAnalysisPrompt(dimId);
    state.analysisPrompts[dimId] = prompt;
    const field = $('#analysisPromptText');
    if (field) field.value = prompt;
    queueSave();
    toast('已按当前内容重新生成', 'success');
    return;
  }

  const editSegButton = target.closest('[data-edit-seg]');
  if (editSegButton) { openSheet({ type:'segment', segId:editSegButton.dataset.editSeg }); return; }

  const jumpCell = target.closest('[data-jump-cell]');
  if (jumpCell) { openCell(jumpCell.dataset.jumpCell, jumpCell.dataset.jumpDim); return; }

  const cellTag = target.closest('[data-cell-tag]');
  if (cellTag && ui.sheet?.type === 'cell') {
    const { segId, dimId } = ui.sheet;
    const cell = getCell(segId, dimId);
    const tags = new Set(cell.tags || []);
    const tag = cellTag.dataset.cellTag;
    if (tags.has(tag)) tags.delete(tag);
    else tags.add(tag);
    writeCell(segId, dimId, { text:cell.text || '', tags:[...tags] });
    cellTag.classList.toggle('selected', tags.has(tag));
    updateCellButton(segId, dimId);
    return;
  }

  const pickDimension = target.closest('[data-pick-dim]');
  if (pickDimension) { openModal('dims', { replaceId:pickDimension.dataset.pickDim }); return; }

  if (target.closest('[data-clear-cell]') && ui.sheet?.type === 'cell') {
    const { segId, dimId } = ui.sheet;
    writeCell(segId, dimId, { text:'', tags:[] });
    const area = $('#cellText');
    if (area) area.value = '';
    $$('.quick-tag', $('#sheetRoot')).forEach(tag => tag.classList.remove('selected'));
    updateCellButton(segId, dimId);
    refreshCounts();
    return;
  }

  const deleteSegmentButton = target.closest('[data-delete-seg]');
  if (deleteSegmentButton) {
    if (removeSegment(deleteSegmentButton.dataset.deleteSeg)) {
      closeSheet();
      toast('这一列已删除');
    }
    return;
  }

  if (target.closest('[data-close-sheet]')) { closeSheet(); return; }
  if (target.closest('[data-close-modal]')) { closeModal(); return; }

  if (target.closest('[data-open-history]')) { openModal('history'); return; }
  if (target.closest('[data-open-dim-library]')) { openDimensionLibrary(); return; }
  if (target.closest('[data-open-settings]')) { openModal('settings'); return; }
  if (target.closest('[data-new-board]')) { closeModal(); goHome(); return; }

  const autosaveButton = target.closest('[data-toggle-autosave]');
  if (autosaveButton) {
    settings.autosave = !settings.autosave;
    persistSettings();
    autosaveButton.classList.toggle('on', settings.autosave);
    autosaveButton.setAttribute('aria-checked', String(settings.autosave));
    if (settings.autosave) saveNow(true);
    else updateSaveLabel('未保存 · 自动保存已关闭');
    toast(settings.autosave ? '已开启自动保存' : '已关闭自动保存');
    return;
  }
  if (target.closest('[data-save-now]')) { saveNow(); return; }
  if (target.closest('[data-clear-all]')) { clearAllData(); return; }

  const dimToggle = target.closest('[data-dim-toggle]');
  if (dimToggle) { toggleDimensionFromModal(dimToggle.dataset.dimToggle, dimToggle); return; }

  const dimLibMode = target.closest('[data-dimlib-mode]');
  if (dimLibMode) {
    ui.dimLibMode = dimLibMode.dataset.dimlibMode === 'tasks' ? 'tasks' : 'project';
    ui.dimEditing = null;
    ui.dimEditingAxis = null;
    renderModal();
    return;
  }
  if (target.closest('[data-import-dimensions]')) { triggerDimensionImport(); return; }
  if (target.closest('[data-export-dimensions]')) { exportDimensionLibrary(); return; }
  const addDim = target.closest('[data-add-dim]');
  if (addDim) { openDimensionEditor(null, addDim.dataset.addDim); return; }
  const editDim = target.closest('[data-edit-dim]');
  if (editDim) { openDimensionEditor(editDim.dataset.editDim); return; }
  const removeDim = target.closest('[data-remove-dim]');
  if (removeDim) { removeLibraryDimension(removeDim.dataset.removeDim); return; }
  if (target.closest('[data-save-dim]')) { saveLibraryDimension(); return; }
  if (target.closest('[data-cancel-dim]')) { closeDimensionEditor(); return; }
  if (target.closest('[data-reset-dims]')) { resetDimensionLibrary(); return; }

  if (target.closest('[data-custom-toggle]')) {
    ui.customOpen = !ui.customOpen;
    $('#customForm')?.classList.toggle('open', ui.customOpen);
    if (ui.customOpen) $('#customTitle')?.focus();
    return;
  }
  if (target.closest('[data-add-custom]')) { addCustomDimension(); return; }

  const copyExit = target.closest('[data-copy-exit]');
  if (copyExit) { copyText(generateExitPrompt(copyExit.dataset.copyExit), '提示词已复制'); return; }

  const actionButton = target.closest('[data-action]');
  if (actionButton) {
    const action = actionButton.dataset.action;
    if (action === 'dims') openModal('dims');
    else if (action === 'add-seg') addSegment();
    else if (action === 'summary') { ui.sheet = { type:'summary' }; renderSheet(); }
    else if (action === 'edit-board') openSheet({ type:'board' });
    else if (action === 'export-md') exportMarkdown();
    return;
  }

  if (target === $('#sheetLayer')) { closeSheet(); return; }
  if (target === $('#modalLayer')) { closeModal(); return; }
});

document.addEventListener('submit', event => {
  if (event.target.id === 'askForm') {
    event.preventDefault();
    submitCurrentStep();
  }
});

document.addEventListener('input', event => {
  const target = event.target;
  if (target.matches('[data-axis-root], [data-axis-title]')) {
    syncAxisInlineInputs(target.closest('#askForm') || $('#askForm'));
    queueSave();
    return;
  }
  if (target.matches('[data-summary-root]')) {
    setRootTitle(target.textContent || '');
    queueSave();
    return;
  }
  if (target.matches('[data-summary-seg]')) {
    const segment = segmentById(target.dataset.summarySeg);
    if (segment) {
      segment.title = target.textContent || '';
      queueSave();
    }
    return;
  }
  if (target.matches('[data-vcell-seg]')) {
    const segId = target.dataset.vcellSeg;
    const dimId = target.dataset.vcellDim;
    const cell = getCell(segId, dimId);
    writeCell(segId, dimId, { text:target.innerText || '', tags:cell.tags || [] });
    return;
  }
  if (target.id === 'cellText' && ui.sheet?.type === 'cell') {
    const { segId, dimId } = ui.sheet;
    const cell = getCell(segId, dimId);
    writeCell(segId, dimId, { text:target.value, tags:cell.tags || [] });
    updateCellButton(segId, dimId);
    refreshCounts();
    return;
  }
  if (target.id === 'analysisPromptText' && ui.sheet?.type === 'analysis') {
    state.analysisPrompts[ui.sheet.dimId] = target.value;
    queueSave();
    return;
  }
  if (target.matches('[data-seg-field]') && ui.sheet?.type === 'segment') {
    const segment = segmentById(ui.sheet.segId);
    if (segment) {
      segment[target.dataset.segField] = target.value;
      queueSave();
    }
    return;
  }
  if (target.matches('[data-root-field]') && ui.sheet?.type === 'board') {
    state.root[target.dataset.rootField] = target.value;
    if (state.mode === 'tasks' && target.dataset.rootField === 'title') state.root.deadline = target.value;
    state.title = deriveTitle(state.mode, state.root);
    queueSave();
    const barTitle = $('#barTitle');
    if (barTitle) barTitle.textContent = state.title;
    const wbTitle = $('.wb-title');
    if (wbTitle) wbTitle.textContent = state.title;
    return;
  }
  if (target.id === 'dimSearch') { ui.search = target.value; filterDimCards(); return; }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (!$('#historyExportMenu')?.hidden) { closeHistoryExportMenu(); return; }
    if (ui.dimEditing) return;
    if (ui.sheet) { closeSheet(); return; }
    if (ui.modal) { closeModal(); return; }
  }
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
    event.preventDefault();
    saveNow();
  }
});

document.addEventListener('pointerover', event => {
  const target = event.target.closest?.('[data-hover-tip]');
  if (!target || target === hoverTipTarget) return;
  scheduleHoverTip(target, event.clientX, event.clientY);
});

document.addEventListener('pointerout', event => {
  const target = event.target.closest?.('[data-hover-tip]');
  if (!target || target !== hoverTipTarget) return;
  const next = event.relatedTarget?.closest?.('[data-hover-tip]');
  if (next === target) return;
  hideHoverTip();
});

document.addEventListener('focusin', event => {
  const target = event.target.closest?.('[data-hover-tip]');
  if (!target || target.matches('[contenteditable]')) return;
  const rect = target.getBoundingClientRect();
  scheduleHoverTip(target, rect.left + rect.width / 2, rect.top + Math.min(rect.height / 2, 28));
});

document.addEventListener('focusout', event => {
  const target = event.target.closest?.('[data-hover-tip]');
  if (!target) return;
  const next = event.relatedTarget?.closest?.('[data-hover-tip]');
  if (next === target) return;
  hideHoverTip();
});

document.addEventListener('pointerdown', hideHoverTip, true);
window.addEventListener('scroll', hideHoverTip, true);
window.addEventListener('resize', hideHoverTip);

$('#importFile').addEventListener('change', event => importJSON(Array.from(event.target.files || [])));
$('#dimensionImportFile').addEventListener('change', event => importDimensionLibrary(event.target.files?.[0]));
window.addEventListener('beforeunload', () => { if (state.mode) save(); });

function migrateCustomDimensions() {
  const known = new Set(dimensionLibrary.map(item => item.id));
  let changed = false;
  [state, ...library].forEach(board => {
    (board?.dimensions || []).forEach(dimension => {
      if (!dimension?.id || !dimension.custom || known.has(dimension.id)) return;
      dimensionLibrary.push(normalizeDimensionRecord({ ...dimension, custom:true }));
      known.add(dimension.id);
      changed = true;
    });
  });
  if (changed) {
    persistDimensionLibrary();
    refreshDimensionIndex();
  }
}

migrateCustomDimensions();
renderAll();
</script>
</body>
