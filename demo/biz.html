<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>业务拆解器</title>
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#f4efe6; --paper-deep:#ebe3d5; --panel:#fffdf8; --panel-soft:#fbf7ef;
  --ink:#1b1d1a; --ink-soft:#3d403a; --muted:#7c7669; --faint:#a79e8f;
  --line:#ded5c6; --line-soft:#ece5d9;
  --red:#b3261e; --red-deep:#881c16; --red-soft:#f6e3df;
  --green:#2f6b52; --green-soft:#e7f0ea; --blue:#40657a; --blue-soft:#e7eef2;
  --amber:#9b6a24; --amber-soft:#f7eddc; --violet:#695781; --violet-soft:#eee9f3;
  --shadow:0 18px 55px rgba(54,44,28,.08); --shadow-small:0 4px 16px rgba(54,44,28,.07);
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{height:100%}
body{
  min-height:100%;margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  background:
    radial-gradient(circle at 62% 18%,rgba(179,38,30,.045),transparent 28%),
    radial-gradient(rgba(70,58,38,.055) .7px,transparent .7px) 0 0/19px 19px,
    var(--paper);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
::selection{background:rgba(179,38,30,.16)}
svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100vh;display:flex;flex-direction:column}
.bar{
  position:sticky;top:0;z-index:30;height:62px;flex:none;display:flex;align-items:center;gap:18px;
  padding:0 26px;border-bottom:1px solid transparent;background:rgba(244,239,230,.82);backdrop-filter:blur(14px);
}
.bar.solid{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:5px 0;text-align:left}
.brand-mark{position:relative;width:27px;height:27px;flex:none;border:1px solid #b9ad9c;border-radius:50%}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;background:#b9ad9c}
.brand-mark::before{width:1px;height:35px;left:12px;top:-5px}
.brand-mark::after{height:1px;width:35px;top:12px;left:-5px}
.brand-mark i{position:absolute;inset:8px;border-radius:50%;background:var(--red);opacity:.9}
.brand-name{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.06em;line-height:1.2}
.bar-context{min-width:0;display:flex;align-items:center;gap:9px;flex:1;padding-left:8px;color:var(--muted);font-size:11px}
.bar-context[hidden]{display:none}
.bar-context .mode-chip{flex:none;padding:2px 7px;border:1px solid #ddcfbf;border-radius:999px;color:var(--red);font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.bar-context .ctx-title{max-width:38vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink-soft)}
.bar-actions{margin-left:auto;display:flex;align-items:center;gap:5px}
.tb-btn{border:0;background:transparent;padding:8px 10px;border-radius:7px;font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{background:rgba(255,253,248,.8);color:var(--ink)}
.tb-btn svg{width:15px;height:15px}
.tb-btn.icon{padding:8px}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.page{animation:fadeUp .38s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.landing{width:min(100%,1040px);margin:0 auto;padding:clamp(48px,11vh,112px) 28px 80px;text-align:center;position:relative}
.landing::before{content:"";position:absolute;left:50%;top:8%;width:1px;height:54px;background:linear-gradient(transparent,#c9bcab);transform:translateX(-.5px);opacity:.8}
.landing-mark{width:54px;height:54px;margin:0 auto 34px;position:relative;border:1px solid #cbbdaa;border-radius:50%}
.landing-mark::before,.landing-mark::after{content:"";position:absolute;background:#cbbdaa}
.landing-mark::before{width:1px;height:72px;left:26px;top:-10px}
.landing-mark::after{height:1px;width:72px;top:26px;left:-10px}
.landing-mark i{position:absolute;inset:17px;border-radius:50%;background:var(--red)}
.kicker{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--red)}
.landing h1{margin:16px 0 10px;font-family:var(--serif);font-size:clamp(38px,5.6vw,62px);font-weight:600;line-height:1.16;letter-spacing:.02em}
.landing h1{text-wrap:balance}
.landing h1 em{font-style:normal;color:var(--red)}
.landing-sub{margin:0;color:var(--muted);font-size:13.5px}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px;margin:46px auto 0;text-align:left}
.mode-card{
  position:relative;display:flex;flex-direction:column;min-height:226px;padding:28px 28px 24px;
  border:1px solid #dfd4c4;border-radius:18px;background:rgba(255,253,248,.72);text-align:left;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;transition:.22s ease;overflow:hidden;
}
.mode-card::after{content:"";position:absolute;right:-42px;bottom:-58px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(179,38,30,.1),transparent 68%);transition:.22s ease}
.mode-card:hover{border-color:#c7ab9f;background:var(--panel);transform:translateY(-4px);box-shadow:0 20px 45px rgba(54,44,28,.1)}
.mode-card:hover::after{transform:scale(1.2)}
.mode-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #e2c9c3;background:var(--red-soft);color:var(--red);margin-bottom:20px}
.mode-icon svg{width:21px;height:21px}
.mode-card h2{margin:0 0 8px;font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.03em}
.mode-card p{margin:0;max-width:280px;color:var(--muted);font-size:12.5px;line-height:1.75}
.mode-arrow{margin-top:auto;padding-top:24px;display:flex;align-items:center;justify-content:space-between;color:var(--faint);font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.mode-arrow svg{width:18px;height:18px;color:var(--red);transition:.18s ease}
.mode-card:hover .mode-arrow svg{transform:translateX(4px)}
.continue-last{margin:26px auto 0;border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:7px 10px;border-bottom:1px solid #d5c8b7}
.continue-last:hover{color:var(--red);border-color:var(--red)}
.landing-note{margin-top:34px;color:#b1a696;font-size:10px;letter-spacing:.08em}
.conversation{width:min(100%,760px);margin:0 auto;padding:clamp(36px,7vh,76px) 28px 100px}
.transcript{display:flex;flex-direction:column;gap:26px}
.turn{position:relative;padding-left:20px;animation:fadeUp .3s ease both}
.turn::before{content:"";position:absolute;left:0;top:7px;bottom:5px;width:1px;background:#d8cbbb}
.turn .q{color:var(--muted);font-size:11.5px;line-height:1.6}
.turn .a{margin-top:3px;color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.55;letter-spacing:.015em}
.turn .edit{border:0;background:transparent;color:#b6a897;font-size:9.5px;padding:2px 0;margin-top:3px;border-bottom:1px solid transparent}
.turn .edit:hover{color:var(--red);border-color:#e1b6b0}
.ask{padding-top:12px;animation:fadeUp .36s ease both}
.ask-kicker{display:flex;align-items:center;gap:8px;color:var(--red);font-family:var(--mono);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase}
.ask-kicker::before{content:"";width:17px;height:1px;background:var(--red)}
.ask h2{margin:10px 0 7px;font-family:var(--serif);font-size:clamp(26px,3.3vw,34px);font-weight:600;line-height:1.35;letter-spacing:.02em}
.ask-copy{margin:0 0 26px;color:var(--muted);font-size:12.5px;line-height:1.8}
.ask-form{display:flex;flex-direction:column;gap:18px;max-width:660px}
.line-input,.line-area{
  width:100%;border:0;border-bottom:1px solid #cfc1ae;border-radius:0;background:transparent;
  padding:9px 0 11px;font-family:var(--serif);font-size:22px;line-height:1.55;outline:0;resize:none;
  transition:border-color .18s ease;
}
.line-input::placeholder,.line-area::placeholder{color:#b6aa99;font-family:var(--sans);font-size:14px}
.line-input:focus,.line-area:focus{border-bottom-color:var(--red)}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.field-label{display:block;margin-bottom:3px;color:var(--faint);font-size:9.5px;letter-spacing:.08em}
.field-input{width:100%;border:0;border-bottom:1px solid #d3c6b5;background:transparent;padding:8px 0 10px;font-size:15px;outline:0}
.field-input:focus{border-bottom-color:var(--red)}
.form-actions{display:flex;align-items:center;gap:12px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-soft);font-size:11.5px;transition:.16s ease;white-space:nowrap}
.btn:hover{border-color:#bfae99;background:#fff;transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{background:#000;border-color:#000}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn-quiet:hover{background:rgba(255,253,248,.8);color:var(--ink);border-color:transparent}
.btn-sm{min-height:31px;padding:5px 9px;font-size:10px}
.text-link{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0;border-bottom:1px solid #d8cbbb}
.text-link:hover{color:var(--red);border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid #e0d3c2;border-radius:999px;background:rgba(255,253,248,.8);font-size:10px;color:var(--ink-soft)}
.chip b{font-family:var(--mono);font-size:8px;color:var(--red);font-weight:500}
.hint-inline{color:var(--faint);font-size:10px;line-height:1.6}
.offer-list{display:flex;flex-direction:column;gap:9px;margin:4px 0 17px}
.offer-card{display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;width:100%;padding:13px 14px;border:1px solid #e2d7c8;border-radius:10px;background:rgba(255,253,248,.72);text-align:left;transition:.16s ease}
.offer-card:hover{border-color:#c9b6a2;background:var(--panel)}
.offer-card.selected{border-color:#d6b6b0;background:#fff9f7;box-shadow:inset 3px 0 0 var(--red)}
.offer-check{width:20px;height:20px;display:grid;place-items:center;border:1px solid #d0c3b2;border-radius:50%;color:transparent;font-size:10px;margin-top:1px}
.offer-card.selected .offer-check{background:var(--red);border-color:var(--red);color:#fff}
.offer-card h3{margin:0;font-size:12px;font-weight:600}
.offer-card p{margin:2px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
.offer-card small{display:block;margin-top:3px;color:#a49785;font-size:9.5px;line-height:1.5}
.offer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note-line{color:var(--faint);font-size:10px;line-height:1.7}
.workbench{width:100%;max-width:1660px;margin:0 auto;padding:20px 26px 42px;display:flex;flex-direction:column;min-height:0;flex:1}
.wb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 0 15px}
.wb-title-wrap{min-width:0}
.wb-kicker{display:flex;align-items:center;gap:8px;color:var(--red);font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase}
.wb-kicker::before{content:"";width:15px;height:1px;background:var(--red)}
.wb-title{margin:5px 0 3px;font-family:var(--serif);font-size:clamp(23px,2.5vw,31px);font-weight:600;line-height:1.25;letter-spacing:.015em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wb-meta{display:flex;align-items:center;gap:9px;color:var(--faint);font-size:10px;flex-wrap:wrap}
.wb-meta b{color:var(--muted);font-weight:500}
.wb-actions{display:flex;align-items:center;gap:7px;flex:none}
.wb-tools{display:flex;align-items:center;gap:7px;padding:0 0 11px;flex-wrap:wrap}
.wb-tools .spacer{flex:1}
.wb-count{color:var(--faint);font-size:10px;font-variant-numeric:tabular-nums}
.wb-count b{color:var(--ink-soft);font-weight:500}
.matrix-wrap{flex:1;min-height:260px;overflow:auto;border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:var(--shadow);scrollbar-color:#c7bba8 transparent}
.matrix{display:grid;grid-template-columns:218px repeat(var(--seg-count),minmax(210px,1fr));min-width:max-content}
.matrix-corner,.matrix-head,.row-label,.matrix-cell{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.matrix-corner{position:sticky;left:0;top:0;z-index:7;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:74px;padding:13px 15px;background:#faf6ee;color:var(--faint);font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.matrix-head{position:sticky;top:0;z-index:4;min-height:74px;padding:11px 13px;background:#fbf8f2;text-align:left;border-top:0;border-left:0;cursor:pointer;transition:.14s ease}
.matrix-head:hover{background:#f8f1e5}
.head-top{display:flex;align-items:center;gap:6px}
.head-index{color:var(--red);font-family:var(--mono);font-size:8px}
.head-edit{margin-left:auto;color:#c4b5a1;font-size:9px}
.head-title{margin-top:4px;font-size:12px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.head-sub{margin-top:2px;color:var(--faint);font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-label{position:sticky;left:0;z-index:3;min-height:108px;padding:13px 14px;background:#fcf9f3;display:flex;flex-direction:column;justify-content:center;gap:4px;width:100%;border-top:0;border-left:0;text-align:left;font:inherit;cursor:pointer;transition:.16s ease}
.row-label:hover{background:#f8f0e5}
.row-label-top{display:flex;align-items:center;gap:7px}
.row-pick{margin-left:auto;color:#d0c2b0;font-family:var(--mono);font-size:8px;opacity:0;transition:.16s}
.row-label:hover .row-pick,.row-label:focus-visible .row-pick{opacity:1;color:var(--red)}
.dim-dot{width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.dim-dot.time{background:var(--blue)} .dim-dot.action{background:var(--green)} .dim-dot.result{background:var(--amber)} .dim-dot.risk{background:#a64848} .dim-dot.opportunity{background:var(--violet)}
.row-title{font-size:11px;font-weight:600;line-height:1.35}
.row-hint{color:var(--faint);font-size:9px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-cut-in{animation:rowCutIn .52s cubic-bezier(.18,.82,.25,1) both}
@keyframes rowCutIn{0%{opacity:.15;clip-path:inset(0 0 0 100%);transform:translateX(12px)}55%{opacity:1;transform:translateX(-2px)}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.matrix-cell{position:relative;min-height:108px;padding:11px 12px;border-top:0;border-left:0;background:#fff;text-align:left;font-size:11px;line-height:1.55;color:var(--ink-soft);transition:.14s ease;overflow:hidden;width:100%}
.matrix-cell:hover{background:#fffaf3;box-shadow:inset 0 0 0 1px #e0cbb7}
.matrix-cell.empty{color:#b9af9f}
.matrix-cell.empty .cell-plus{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border:1px dashed #d4c8b6;border-radius:50%;color:#b7aa98;font-size:15px;margin-bottom:4px}
.cell-text{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cell-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.cell-tag{display:inline-flex;padding:2px 6px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:8px;line-height:1.5;white-space:nowrap}
.cell-mark{position:absolute;right:8px;bottom:6px;color:#d8ccbb;font-family:var(--mono);font-size:8px}
.matrix-empty{padding:54px 24px;text-align:center;border-top:1px solid var(--line-soft)}
.matrix-empty .empty-icon{width:48px;height:48px;margin:0 auto 12px;display:grid;place-items:center;border:1px dashed #cbbda8;border-radius:50%;color:var(--red);font-family:var(--serif);font-size:20px}
.matrix-empty h3{margin:0 0 5px;font-family:var(--serif);font-size:18px}
.matrix-empty p{margin:0 auto 14px;max-width:380px;color:var(--muted);font-size:11.5px;line-height:1.7}
.scroll-hint{display:none;text-align:center;color:var(--faint);font-family:var(--mono);font-size:8.5px;padding:5px 0 8px}
.hover-tip{position:fixed;left:0;top:0;z-index:220;width:max-content;max-width:min(360px,calc(100vw - 28px));padding:11px 13px;border:1px solid #d8cab8;border-radius:10px;background:rgba(255,253,248,.98);box-shadow:0 16px 38px rgba(46,37,23,.16);color:var(--ink-soft);font-size:10.5px;line-height:1.65;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(3px);transition:opacity .12s ease,transform .12s ease}
.hover-tip.show{opacity:1;visibility:visible;transform:none}
.hover-tip-title{margin:0 0 5px;color:var(--red);font-family:var(--mono);font-size:8px;letter-spacing:.08em}
.hover-tip-copy{white-space:pre-line;overflow-wrap:anywhere;word-break:break-word}
.sheet-layer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(20,18,15,.18);animation:fadeIn .18s ease}
.sheet-layer[hidden]{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:min(400px,94vw);height:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-24px 0 70px rgba(30,26,20,.15);display:flex;flex-direction:column;animation:sheetIn .24s ease both}
.sheet.analysis-sheet{width:min(720px,96vw)}
.analysis-sheet .sheet-body{display:flex;overflow:hidden}
.analysis-prompt-field{display:flex;flex:1;min-width:0;min-height:0}
.analysis-prompt-field textarea{width:100%;height:100%;min-height:320px;resize:none;border:1px solid var(--line);border-radius:9px;background:#fff;padding:13px 14px;font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--ink);outline:0}
.analysis-prompt-field textarea:focus{border-color:#c9a9a2;box-shadow:0 0 0 3px rgba(179,38,30,.05)}
@keyframes sheetIn{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{flex:none;padding:20px 20px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:12px}
.sheet-head-copy{min-width:0;flex:1}
.sheet-kicker{color:var(--red);font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase}
.sheet-head h2{margin:5px 0 3px;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.35}
.sheet-head p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.6}
.sheet-close{width:30px;height:30px;flex:none;border:1px solid var(--line);border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--muted)}
.sheet-close:hover{background:var(--panel-soft);color:var(--ink)}
.sheet-close svg{width:14px;height:14px}
.sheet-body{flex:1;overflow:auto;padding:18px 20px 28px}
.sheet-foot{flex:none;padding:12px 20px;border-top:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fdfaf4}
.editor-context{padding:12px 13px;border:1px solid #eadfd2;border-left:3px solid var(--red);border-radius:8px;background:linear-gradient(90deg,#fff8f5,#fffdf8)}
.editor-context .ctx-seg{color:var(--faint);font-size:9px}
.editor-context h3{margin:3px 0;font-size:13px;font-weight:600}
.editor-context p{margin:0;color:var(--muted);font-size:10px;line-height:1.6}
.cell-area{width:100%;min-height:160px;margin-top:14px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px;font-size:12.5px;line-height:1.7;outline:0;resize:vertical}

function hideHoverTip() {
  window.clearTimeout(hoverTipTimer);
  hoverTipTimer = null;
  hoverTipTarget = null;
  const tip = $('#hoverTip');
  if (!tip) return;
  tip.classList.remove('show');
  tip.setAttribute('aria-hidden', 'true');
}

function placeHoverTip(clientX, clientY) {
  const tip = $('#hoverTip');
  if (!tip) return;
  const gap = 16;
  const pad = 14;
  const rect = tip.getBoundingClientRect();
  let left = clientX + gap;
  let top = clientY + gap;
  if (left + rect.width > window.innerWidth - pad) left = clientX - rect.width - gap;
  if (top + rect.height > window.innerHeight - pad) top = clientY - rect.height - gap;
  tip.style.left = `${clamp(left, pad, Math.max(pad, window.innerWidth - rect.width - pad))}px`;
  tip.style.top = `${clamp(top, pad, Math.max(pad, window.innerHeight - rect.height - pad))}px`;
}

function showHoverTip(target, clientX, clientY) {
  const tip = $('#hoverTip');
  if (!tip) return;
  const title = String(target.dataset.tipTitle || '').trim();
  const copy = String(target.dataset.tip || '').trim();
  if (!copy) return hideHoverTip();
  tip.innerHTML = `${title ? `<div class="hover-tip-title">${esc(title)}</div>` : ''}<div class="hover-tip-copy">${esc(copy)}</div>`;
  tip.classList.add('show');
  tip.setAttribute('aria-hidden', 'false');
  placeHoverTip(clientX, clientY);
}

function scheduleHoverTip(target, clientX, clientY) {
  if (!target || target === hoverTipTarget) return;
  window.clearTimeout(hoverTipTimer);
  hoverTipTarget = target;
  if (!String(target.dataset.tip || '').trim()) return hideHoverTip();
  hoverTipTimer = window.setTimeout(() => {
    if (hoverTipTarget === target) showHoverTip(target, clientX, clientY);
  }, 90);
}

function normalizeDimensionRecord(item = {}) {
  const known = BUILTIN_DIMENSIONS.find(builtin => builtin.id === item.id) || {};
  return {
    id:String(item.id || known.id || uid('dim')),
    scope:['project','tasks','both'].includes(item.scope) ? item.scope : (known.scope || 'both'),
    group:String(item.group || known.group || 'structure'),
    title:String(item.title || known.title || '未命名维度'),
    hint:String(item.hint || known.hint || ''),
    prompt:String(item.prompt || known.prompt || ''),
    analysisPrompt:String(item.analysisPrompt ?? known.analysisPrompt ?? (item.custom ? '' : ((item.axis === 'horizontal' || (!item.axis && known.axis === 'horizontal')) ? '' : DEFAULT_ANALYSIS_PROMPT))),
    type:item.type === 'tags' || (!item.type && known.type === 'tags') ? 'tags' : 'text',
    axis:item.axis === 'horizontal' || (!item.axis && known.axis === 'horizontal') ? 'horizontal' : 'vertical',
    core:Boolean(item.core ?? known.core),
    recommended:Boolean(item.recommended ?? known.recommended),
    options:Array.isArray(item.options) ? item.options.map(String).slice(0, 12) : [...(known.options || [])],
    custom:Boolean(item.custom)
  };
}

function loadDimensionLibrary() {
  const builtins = BUILTIN_DIMENSIONS.map(item => ({ ...item, options:[...(item.options || [])] }));
  try {
    const raw = localStorage.getItem(DIMS_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (Array.isArray(parsed)) {
      const builtinIds = new Set(builtins.map(item => item.id));
      const normalized = parsed.map(normalizeDimensionRecord);
      const custom = normalized.filter(item => item.custom && !builtinIds.has(item.id));
      if (localStorage.getItem(DIMS_SEED_KEY) !== DIMS_SEED) {
        localStorage.setItem(DIMS_SEED_KEY, DIMS_SEED);
        return [...builtins, ...custom];
      }
      const list = normalized.filter(item => item.custom || builtinIds.has(item.id));
      const knownIds = new Set(list.map(item => item.id));
      builtins.forEach(item => {
        if (!knownIds.has(item.id)) list.push({ ...item, options:[...(item.options || [])] });
      });
      return list;
    }
  } catch (error) {}
  try { localStorage.setItem(DIMS_SEED_KEY, DIMS_SEED); } catch (error) {}
  return builtins;
}

function persistDimensionLibrary() {
  try { localStorage.setItem(DIMS_KEY, JSON.stringify(dimensionLibrary)); } catch (error) {}
}

let dimensionLibrary = loadDimensionLibrary();
persistDimensionLibrary();
let DIM_BY_ID = {};
function refreshDimensionIndex() {
  DIM_BY_ID = Object.fromEntries(dimensionLibrary.map(item => [item.id, item]));

const PROJECT_STEPS = [
  { key:'goal', type:'text', q:'这个项目的主目标是什么？' },
  { key:'parts', type:'list', q:'这个项目能拆成哪几个子目标？', noun:'子目标', min:2 },

  { key:'analysis', type:'analyze', q:'选一个维度，生成分析提示词' }
];

const TASK_STEPS = [
  { key:'period', type:'text', q:'这是哪段时间内的任务？' },
  { key:'tasks', type:'list', q:'这段时间里，你实际在做什么？', noun:'任务', min:2 },
  { key:'axes', type:'axes', q:'再从哪个维度竖着切？', min:1 },
  { key:'analysis', type:'analyze', q:'选一个维度，生成分析提示词' }
];

const DEFAULT_DIMS = {
  project: ['project_board','project_rhythm','project_steps','project_issue'],
  tasks: ['task_nature','task_time','task_frequency','task_value','task_method','task_blocker']
};

function stepsFor(mode) { return mode === 'tasks' ? TASK_STEPS : PROJECT_STEPS; }
function meta() { return state.mode ? MODE_META[state.mode] : null; }
function createState(mode = null) {
  return {
    version: 2, id: uid('board'), title: '', titleAuto: true, mode, stage: 'conversation',
    root: { title:'', result:'', deadline:'' }, segments: [], dimensions: [], cells: {}, analysisPrompts: {},
    setup: { step:0, maxStep:0, dims: [], completed:false },
    presetApplied: false, createdAt: Date.now(), updatedAt: Date.now()
  };
}

function normalizeState(input) {
  const base = createState();
  if (!input || typeof input !== 'object') return base;
  const mode = input.mode === 'project' || input.mode === 'tasks' ? input.mode : null;
  let stage = 'conversation';
  if (input.stage === 'workbench' || input.stage === 'vertical') stage = 'workbench';
  const segments = Array.isArray(input.segments) ? input.segments
    .filter(item => item && typeof item === 'object')
    .map(item => ({ id:String(item.id || uid('seg')), title:String(item.title || ''), result:String(item.result || ''), deadline:String(item.deadline || '') }))
    .slice(0, 24) : [];
  const dimensions = Array.isArray(input.dimensions) ? input.dimensions
    .filter(item => item && typeof item === 'object' && item.id && item.title)
    .map(item => {
      const known = DIM_BY_ID[item.id] || {};
      return {
        id:String(item.id), title:String(item.title), hint:String(item.hint || known.hint || ''),
        prompt:String(item.prompt || known.prompt || ''),
        analysisPrompt:String(item.analysisPrompt || known.analysisPrompt || ''),
        group:String(item.group || known.group || 'structure'), scope:String(item.scope || known.scope || 'both'),
        type:item.type === 'tags' ? 'tags' : 'text', options:Array.isArray(item.options) ? item.options.map(String).slice(0,12) : [],
        custom:Boolean(item.custom)
      };
    }).slice(0, 20) : [];
  const cells = {};
  if (input.cells && typeof input.cells === 'object') {
    Object.entries(input.cells).forEach(([key, cell]) => {
      if (!cell || typeof cell !== 'object') return;
      const tags = Array.isArray(cell.tags) ? cell.tags.map(String).slice(0,10) : [];
      const text = String(cell.text || '');
      if (text.trim() || tags.length) cells[key] = { text, tags };
    });
  }
  const segIds = new Set(segments.map(item => item.id));
  const dimIds = new Set(dimensions.map(item => item.id));
  Object.keys(cells).forEach(key => {
    const [segId, dimId] = key.split('::');
    if (!segIds.has(segId) || !dimIds.has(dimId)) delete cells[key];
  });
  const analysisPrompts = {};
  if (input.analysisPrompts && typeof input.analysisPrompts === 'object') {
    Object.entries(input.analysisPrompts).forEach(([dimId, prompt]) => {
      if ((dimIds.has(dimId) || dimId === OVERALL_ANALYSIS_ID) && typeof prompt === 'string' && prompt.trim()) analysisPrompts[dimId] = prompt;
    });
  }
  const root = {
    title:String(input.root?.title || ''), result:String(input.root?.result || ''),
    deadline:String(input.root?.deadline || '')
  };
  if (mode && input.stage === 'horizontal') stage = 'conversation';
  if (!mode) stage = 'conversation';
  const steps = stepsFor(mode || 'project');
  let setup = { step:0, maxStep:0, dims: [], completed:false };
  if (stage === 'conversation' && mode) {
    if (input.setup && Number.isFinite(Number(input.setup.step))) {
      setup.step = clamp(Number(input.setup.step), 0, steps.length - 1);
      setup.maxStep = clamp(Number(input.setup.maxStep ?? setup.step), setup.step, steps.length - 1);
      if (Array.isArray(input.setup.dims)) setup.dims = input.setup.dims.map(String).filter(id => DIM_BY_ID[id]);
      setup.completed = Boolean(input.setup.completed);
    } else {
      let derived = 0;
      if (mode === 'project') {
        if (root.title) derived = 1;
        if (derived === 1 && segments.filter(item => item.title.trim()).length >= 2) derived = 2;
      } else {
        if (root.title) derived = 1;
        if (derived === 1 && segments.filter(item => item.title.trim()).length >= 2) derived = 2;
      }
      setup.step = clamp(derived, 0, steps.length - 1);
      setup.maxStep = setup.step;
    }
  }
  if (stage === 'workbench') {
    setup.step = steps.length;
    setup.maxStep = steps.length;
    setup.completed = true;
    if (input.setup && Array.isArray(input.setup.dims) && input.setup.dims.length) setup.dims = input.setup.dims.map(String);
  }
  const stateObj = {
    version:2, id:String(input.id || base.id), title:String(input.title || ''), titleAuto:input.titleAuto !== false,
    mode, stage, root, segments, dimensions, cells, analysisPrompts, setup,
    presetApplied:Boolean(input.presetApplied), createdAt:Number(input.createdAt || Date.now()),
    updatedAt:Number(input.updatedAt || Date.now())
  };
  stateObj.title = stateObj.title || deriveTitle(mode, root);
  return stateObj;
}

function deriveTitle(mode, root) {
  const value = (root?.title || '').trim();
  if (mode === 'project') return (value || MODE_META.project.defaultTitle).slice(0, 80);
  if (!value) return MODE_META.tasks.defaultTitle;
  if (value.includes('任务')) return value.slice(0, 80);
  return `${value}的任务集`.slice(0, 80);
}

function loadLibrary() {
  try {
    const raw = localStorage.getItem(LIB_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    const list = Array.isArray(parsed) ? parsed.map(normalizeState).filter(item => item.mode) : [];
    return list.sort((a, b) => b.updatedAt - a.updatedAt);
  } catch (error) { return []; }
}
function persistLibrary() {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(library.slice(0, 60))); } catch (error) {}
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return { autosave:true, ...(raw ? JSON.parse(raw) : {}) };
  } catch (error) { return { autosave:true }; }
}
function persistSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (error) {}
}

let library = loadLibrary();
let settings = loadSettings();
let state = createState();
const ui = {
  screen:'landing', modal:null, sheet:null, saveTimer:null, search:'', customOpen:false,
  dimReplace:null, dimEditing:null, dimEditingAxis:null, dimLibMode:'project', vaxisCut:null,
  historySelected:new Set()
};

function segmentById(id) { return state.segments.find(item => item.id === id); }
function cellKey(segId, dimId) { return `${segId}::${dimId}`; }
function getCell(segId, dimId) { return state.cells[cellKey(segId, dimId)] || { text:'', tags:[] }; }
function isCellFilled(cell) { return Boolean((cell.text || '').trim() || (cell.tags || []).length); }
function allCellCount() { return state.segments.length * state.dimensions.length; }
function filledCellCount() {
  let count = 0;
  state.segments.forEach(segment => state.dimensions.forEach(dimension => {
    if (isCellFilled(getCell(segment.id, dimension.id))) count += 1;
  }));
  return count;
}
function completion() {
  const total = allCellCount();
  return total ? Math.round(filledCellCount() / total * 100) : 0;
}
function nowLabel() { return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' }); }
function formatDate(value) {
  const d = new Date(value || Date.now());
  return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function displayTitle(board) { return board?.title || deriveTitle(board?.mode, board?.root); }

function updateSaveLabel(text) {
  const el = $('#saveState');
  if (el) el.textContent = text;
}
function save() {
  if (!state.mode) return;
  state.updatedAt = Date.now();
  state.title = deriveTitle(state.mode, state.root);
  try {
    localStorage.setItem(CURRENT_KEY, JSON.stringify(state));
    library = [state, ...library.filter(item => item.id !== state.id)].slice(0, 60);
    persistLibrary();
    updateSaveLabel(`已保存 · ${nowLabel()}`);
  } catch (error) {
    updateSaveLabel('保存失败');
  }
}
function queueSave() {
  if (!state.mode) return;
  state.updatedAt = Date.now();
  if (!settings.autosave) { updateSaveLabel('未保存 · 自动保存已关闭'); return; }
  updateSaveLabel('保存中…');
  clearTimeout(ui.saveTimer);
  ui.saveTimer = setTimeout(save, 320);
}
function saveNow(silent = false) {
  clearTimeout(ui.saveTimer);
  save();
  if (!silent) toast('已保存', 'success');
}
function toast(message, kind = '') {
  const node = document.createElement('div');
  node.className = `toast ${kind}`.trim();
  node.textContent = message;
  $('#toastStack').appendChild(node);
  setTimeout(() => { node.style.opacity = '0'; node.style.transform = 'translateY(6px)'; node.style.transition = '.2s'; }, 2200);
  setTimeout(() => node.remove(), 2500);
}
function makeSegment(title = '', result = '', deadline = '') { return { id:uid('seg'), title, result, deadline }; }
function dimensionSnapshot(id) {
  const source = DIM_BY_ID[id];
  if (!source) return null;
  return { ...source, options:[...(source.options || [])] };
}
function libraryItemsForMode() {
  return dimensionLibrary.filter(item => item.axis !== 'horizontal' && (item.scope === state.mode || item.scope === 'both'));
}

function ensureSetupDims() {

function stepAnswer(step) {
  if (!step) return '';
  if (step.key === 'goal' || step.key === 'period') return state.root.title;
  if (step.key === 'done') return state.root.result;
  if (step.key === 'deadline') return state.root.deadline;
  if (step.key === 'parts' || step.key === 'tasks') return state.segments.map(item => item.title).filter(Boolean);
  if (step.key === 'axes') {

function analysisStageHTML() {

function analysisMatrixText() {

  return state.dimensions.map(dimension => {

    });
    return `## ${dimension.title}\n${lines.join('\n')}`;
  }).join('\n\n');
}

function analysisRowText(dimensionId) {
  const noun = state.mode === 'tasks' ? '任务' : '子目标';
  return state.segments.map((segment, index) => {
    const name = segment.title || `未命名${noun} ${index + 1}`;
    return `${String(index + 1).padStart(2, '0')}. ${name}：${cellPromptText(getCell(segment.id, dimensionId))}`;
  }).join('\n');
}

function buildAnalysisPrompt(dimensionId) {
  const dimension = state.dimensions.find(item => item.id === dimensionId) || DIM_BY_ID[dimensionId];
  if (!dimension) return '';
  const tasks = state.mode === 'tasks';
  const modeLabel = tasks ? '单人任务集' : '单个项目';
  const rootLabel = tasks ? '时间范围' : '主目标';
  const noun = tasks ? '任务' : '子目标';
  const segments = state.segments.map((segment, index) => `${String(index + 1).padStart(2, '0')}. ${segment.title || `未命名${noun}`}`).join('\n');
  const instructions = String(dimension.analysisPrompt || DIM_BY_ID[dimensionId]?.analysisPrompt || DEFAULT_ANALYSIS_PROMPT).trim();
  return `你是一名业务拆解分析师。

下面是一份完整的${modeLabel}拆解。请只围绕「${dimension.title}」这一维度做系统分析。

【拆解类型】${modeLabel}
【${rootLabel}】${state.root.title || '（未填写）'}
【横轴：${noun}】
${segments || '（未填写）'}

【完整拆解】
${analysisMatrixText() || '（未填写）'}

【本次分析维度】${dimension.title}
【这个维度的内容】
${analysisRowText(dimensionId) || '（未填写）'}

【分析要求】
${instructions}`;
}

function buildOverallAnalysisPrompt() {
  const tasks = state.mode === 'tasks';
  const modeLabel = tasks ? '单人任务集' : '单个项目';
  const rootLabel = tasks ? '时间范围' : '主目标';
  const noun = tasks ? '任务' : '子目标';
  const segments = state.segments.map((segment, index) => `${String(index + 1).padStart(2, '0')}. ${segment.title || `未命名${noun}`}`).join('\n');
  const extraRoot = [
    state.root.result ? `${tasks ? '观察范围' : '完成标准'}：${state.root.result}` : '',
    state.root.deadline && state.root.deadline !== state.root.title ? `${tasks ? '时间范围补充' : '截止时间'}：${state.root.deadline}` : ''
  ].filter(Boolean).join('\n');
  const dimensionFocus = state.dimensions.map((dimension, index) => {
    const focus = String(dimension.analysisPrompt || DIM_BY_ID[dimension.id]?.analysisPrompt || '').trim();
    return `${String(index + 1).padStart(2, '0')}. ${dimension.title}${focus ? `\n   分析重点：${focus}` : ''}`;
  }).join('\n');
  return `你是一名业务拆解分析师。下面是一份完整的${modeLabel}拆解。请把所有内容作为一个整体，做一次综合、全面、有侧重的分析，而不是逐项复述。

【拆解类型】${modeLabel}
【${rootLabel}】${state.root.title || '（未填写）'}
${extraRoot ? `${extraRoot}\n` : ''}
【横轴：${noun}】
${segments || '（未填写）'}

【全部拆解内容】
${analysisMatrixText() || '（未填写）'}

【各维度分析视角】
${dimensionFocus || '（暂无维度）'}

【分析原则】
1. 以「${state.root.title || rootLabel}」为最终判断标准，根据内容与目标的关联度、影响范围和作用大小自行加权，不要平均对待每个维度。
2. 横向比较各${noun}，纵向串联各维度，找出重复、冲突、缺口、失衡、依赖关系和真正的瓶颈。
3. 综合权衡投入、时间、结果/价值、风险与可执行性，明确哪些部分最值得保留或加码，哪些应该删减、合并或延后。
4. 每个判断尽量引用具体的${noun}、维度或格子内容作为依据，避免空泛建议。
5. 未填写的内容视为“信息缺口”，不要臆造；必要时先提出最关键的 3-5 个澄清问题，再基于现有信息给出初步判断。

【输出结构】
一、一句话结论
二、关键发现（按重要性排序，并说明依据）
三、优先级与取舍（保留/加码、删减/合并/延后）
四、主要风险与信息缺口
五、接下来最值得做的 1-3 个动作（具体、可执行、可验收）`;
}

function ensureAnalysisPrompt(dimensionId) {
  if (!state.analysisPrompts || typeof state.analysisPrompts !== 'object') state.analysisPrompts = {};
  const saved = state.analysisPrompts[dimensionId];
  if (typeof saved === 'string' && saved.trim()) return saved;
  return buildAnalysisPrompt(dimensionId);
}

function ensureOverallAnalysisPrompt() {
  if (!state.analysisPrompts || typeof state.analysisPrompts !== 'object') state.analysisPrompts = {};
  const saved = state.analysisPrompts[OVERALL_ANALYSIS_ID];
  if (typeof saved === 'string' && saved.trim()) return saved;
  return buildOverallAnalysisPrompt();
}

function askHTML(current, steps) {
  const step = steps[current];
  const last = current === steps.length - 1;
  const back = current > 0 ? `<button class="btn btn-quiet" type="button" data-prev-step><svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>上一步</button>` : '';
  let field = '';
  if (step.type === 'text') {
    const value = stepAnswer(step);
    field = `<input class="line-input" name="answer" value="${esc(value)}" placeholder="${esc(step.placeholder || '')}" autocomplete="off">`;
  } else if (step.type === 'list') {
    field = axisHTML();
  } else if (step.type === 'axes') {
    field = verticalStageHTML();
  } else if (step.type === 'analyze') {
    field = analysisStageHTML();
  }
  const primary = step.type === 'analyze' ? '' : `<button class="btn btn-primary" type="submit">${step.type === 'axes' ? '\u8fdb\u5165\u5206\u6790' : '继续'}<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button>`;
  return `<div class="ask">
    <div class="ask-kicker">step ${String(current + 1).padStart(2, '0')} / ${String(steps.length).padStart(2, '0')}</div>
    <h2>${esc(step.q)}</h2>
    <form class="ask-form${['list', 'axes', 'analyze'].includes(step.type) ? ' axis-form' : ''}" id="askForm">
      ${field}
      <div class="ask-error" id="askError"></div>
      <div class="ask-actions">
        ${primary}
        ${back}
        ${step.optional ? '<button class="skip-link" type="button" data-skip-step>暂时跳过</button>' : ''}
      </div>
    </form>
  </div>`;
}

function conversationHTML() {
  const steps = stepsFor(state.mode);
  const current = clamp(state.setup.step || 0, 0, steps.length - 1);
  const wide = ['list', 'axes', 'analyze'].includes(steps[current]?.type) ? ' wide' : '';
  return `<section class="conversation page${wide}">
    <div class="transcript">
      ${askHTML(current, steps)}
    </div>
  </section>`;
}

function focusAsk() {
  requestAnimationFrame(() => {
    if (window.innerWidth < 860) return;
    const text = $('.ask-form > .line-input');
    if (text) { text.focus({ preventScroll:true }); return; }
    const axisInput = $$('.ask-form [data-axis-title]').find(input => !input.value.trim());
    if (axisInput) { axisInput.focus({ preventScroll:true }); return; }
  });
}

function startBoard(mode) {
  if (!MODE_META[mode]) return;
  state = createState(mode);
  state.title = deriveTitle(mode, state.root);
  ui.screen = 'board';
  ui.modal = null;
  ui.sheet = null;
  ui.search = '';
  ui.customOpen = false;
  save();
  renderAll();
  focusAsk();
}

function goHome() {
  if (state.mode) save();
  ui.screen = 'landing';
  ui.modal = null;
  ui.sheet = null;
  renderAll();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function openBoard(id) {
  const found = library.find(item => item.id === id);
  if (!found) { toast('这份拆解已经不在了', 'error'); return; }
  state = normalizeState(clone(found));
  state.title = deriveTitle(state.mode, state.root);
  ui.screen = 'board';
  ui.modal = null;
  ui.sheet = null;
  save();
  renderAll();
  if (state.stage === 'conversation') focusAsk();
  else window.scrollTo({ top:0 });
}

function syncSegments(titles) {
  const previous = state.segments;
  const next = titles.map((title, index) => {
    if (previous[index]) return { ...previous[index], title };
    return makeSegment(title);
  });
  const ids = new Set(next.map(item => item.id));
  Object.keys(state.cells).forEach(key => {
    if (!ids.has(key.split('::')[0])) delete state.cells[key];
  });
  state.segments = next;
}

function syncDimensions(ids) {
  const previous = state.dimensions;
  state.dimensions = ids.map(id => previous.find(item => item.id === id) || dimensionSnapshot(id)).filter(Boolean);
  const keep = new Set(state.dimensions.map(item => item.id));
  Object.keys(state.cells).forEach(key => {
    if (!keep.has(key.split('::')[1])) delete state.cells[key];
  });
}

function applyStep(step, value) {
  if (step.key === 'goal') state.root.title = value;
  else if (step.key === 'done') state.root.result = value;
  else if (step.key === 'deadline') state.root.deadline = value;
  else if (step.key === 'period') { state.root.title = value; state.root.deadline = value; state.root.result = ''; }
  else if (step.key === 'parts' || step.key === 'tasks') syncSegments(value);
  else if (step.key === 'axes') { state.setup.dims = value; syncDimensions(value); }
  state.title = deriveTitle(state.mode, state.root);
  state.presetApplied = true;
}

function setRootTitle(value) {
  state.root.title = String(value || '');
  if (state.mode === 'tasks') state.root.deadline = state.root.title;
  state.title = deriveTitle(state.mode, state.root);
  const barTitle = $('#barTitle');
  if (barTitle) barTitle.textContent = state.title;
}

function syncAxisInlineInputs(form = $('#askForm')) {
  if (!form || !state.mode) return;
  const rootField = $('[data-axis-root]', form);
  if (rootField) setRootTitle(rootField.value);
  const blocks = $$('#axisTrack .axis-block:not(.main)', form);
  if (!blocks.length) return;
  const values = blocks.map(block => $('[data-axis-title]', block)?.value || '');
  while (state.segments.length < values.length) state.segments.push(makeSegment(''));
  values.forEach((value, index) => { state.segments[index].title = value; });
}

function showAskError(message) {
  const error = $('#askError');
  if (!error) return;
  error.textContent = message;
  error.classList.add('show');
}

function axisValues(form = $('#askForm')) {
  if (!form) return [];
  return $$('[data-axis-title]', form).map(input => input.value.trim()).filter(Boolean);
}

function submitCurrentStep() {
  const steps = stepsFor(state.mode);
  const current = clamp(state.setup.step || 0, 0, steps.length - 1);
  const step = steps[current];
  const form = $('#askForm');
  if (!step || !form) return;
  if (step.type === 'analyze') return;
  let value = '';
  if (step.type === 'text') {
    value = ($('.line-input', form)?.value || '').trim();
    if (['goal', 'period'].includes(step.key) && !value) { showAskError('写一句就行，先把这件事说清楚。'); return; }
  } else if (step.type === 'list') {
    syncAxisInlineInputs(form);
    value = axisValues(form);
    if (value.length < (step.min || 2)) { showAskError(`至少写 ${step.min || 2} 项，才能切出横轴。`); return; }
  } else if (step.type === 'axes') {
    value = [...(state.setup.dims || [])];
    if (value.length < (step.min || 1)) { showAskError('先从中间切一条竖轴。'); return; }
  }
  applyStep(step, value);
  const wasEditing = current < state.setup.maxStep;
  if (wasEditing) {
    state.setup.step = state.setup.maxStep;
  } else {
    state.setup.step = current + 1;
    state.setup.maxStep = Math.max(state.setup.maxStep, state.setup.step);
  }
  if (state.setup.step >= steps.length) {
    finishSetup();
    return;
  }
  if (steps[state.setup.step]?.type === 'analyze') state.setup.completed = true;
  save();
  renderTopBar();
  renderMain();
  focusAsk();
}

function previousStep() {
  const steps = stepsFor(state.mode);
  const current = clamp(state.setup.step || 0, 0, steps.length - 1);
  if (current <= 0) return;
  const step = steps[current];
  const form = $('#askForm');
  if (step?.type === 'text') {
    applyStep(step, ($('.line-input', form)?.value || '').trim());
  } else if (step?.type === 'list') {
    syncAxisInlineInputs(form);
    applyStep(step, axisValues(form));
  }
  state.setup.step = current - 1;
  save();
  renderTopBar();
  renderMain();
  focusAsk();
}

function finishSetup() {
  const steps = stepsFor(state.mode);
  state.stage = 'conversation';
  state.setup.step = steps.length - 1;
  state.setup.maxStep = steps.length - 1;
  state.setup.completed = true;
  state.title = deriveTitle(state.mode, state.root);
  save();
  ui.screen = 'board';
  ui.sheet = null;
  ui.modal = null;
  renderAll();
  toast('横轴和竖轴已完成，进入分析', 'success');
}

function editStep(index) {
  const steps = stepsFor(state.mode);
  if (index < 0 || index >= steps.length) return;
  state.setup.step = index;
  state.setup.maxStep = Math.max(state.setup.maxStep, index);
  queueSave();
  renderMain();
  focusAsk();
}

let axisDragState = null;
let axisClickLock = 0;
let axisFlashToken = 0;

function axisBlocks() {
  return $$('#axisTrack .axis-block:not(.main)');
}

function renumberAxisBlocks() {
  axisBlocks().forEach((block, index) => {
    block.style.setProperty('--i', index + 1);
    const num = $('.axis-index', block);
    if (num) num.textContent = String(index + 1).padStart(2, '0');
    const input = $('[data-axis-title]', block);
    if (input) input.setAttribute('aria-label', `第 ${index + 1} 项`);
  });
}

function revealAxisBlock(block) {
  const scroll = $('#axisScroll');
  if (!scroll || !block) return;
  const view = scroll.getBoundingClientRect();
  const rect = block.getBoundingClientRect();
  const padding = 22;
  if (rect.right + padding > view.right) {
    scroll.scrollBy({ left: rect.right + padding - view.right, behavior:'smooth' });
  } else if (rect.left - padding < view.left) {
    scroll.scrollBy({ left: rect.left - padding - view.left, behavior:'smooth' });
  }
}

function flashAxisCut(left) {
  const flash = $('#axisCutFlash');
  if (!flash) return;
  const token = ++axisFlashToken;
  flash.hidden = false;
  flash.style.left = `${left}px`;
  flash.style.animation = 'none';
  void flash.offsetWidth;
  flash.style.animation = '';
  const done = () => {
    if (token !== axisFlashToken) return;
    flash.hidden = true;
    flash.removeEventListener('animationend', done);
  };
  flash.addEventListener('animationend', done);
  setTimeout(done, 650);
}

function addAxisBlock(afterBlock = null, options = {}) {
  const track = $('#axisTrack');
  const add = $('[data-axis-add]', track?.closest('.axis-stage') || document);
  const inner = $('#axisTrackInner', track || document);
  if (!track || !add || !inner) return null;
  const target = afterBlock && afterBlock.classList?.contains('axis-block') ? afterBlock : null;
  const next = target ? target.nextElementSibling : null;
  const blocks = axisBlocks();
  const before = new Map(blocks.map(block => [block, block.getBoundingClientRect()]));
  const trackRect = track.getBoundingClientRect();
  const boundaryX = options.flashClientX ?? (target ? target.getBoundingClientRect().right : add.getBoundingClientRect().left);
  const holder = document.createElement('div');
  holder.innerHTML = axisBlockHTML('', blocks.length).trim();
  const block = holder.firstElementChild;
  if (next) inner.insertBefore(block, next);
  else inner.appendChild(block);
  renumberAxisBlocks();
  block.classList.add('cut-in');
  block.addEventListener('animationend', () => {
    block.classList.remove('cut-in');
    block.classList.add('entered');
  }, { once:true });
  flashAxisCut(boundaryX - trackRect.left);
  requestAnimationFrame(() => {
    blocks.forEach(oldBlock => {
      const oldRect = before.get(oldBlock);
      const nextRect = oldBlock.getBoundingClientRect();
      const dx = oldRect.left - nextRect.left;
      if (Math.abs(dx) > .5) {
        oldBlock.animate(
          [{ transform:`translateX(${dx}px)` }, { transform:'translateX(0)' }],
          { duration:340, easing:'cubic-bezier(.2,.8,.25,1)' }
        );
      }
    });
    revealAxisBlock(block);
  });
  if (options.focus !== false) {
    const input = $('[data-axis-title]', block);
    if (input) {
      requestAnimationFrame(() => {
        input.focus({ preventScroll:true });
        input.setSelectionRange(input.value.length, input.value.length);
      });
    }
  }
  return block;
}

function removeAxisBlock(block) {
  if (!block) return;
  if (axisBlocks().length <= 1) {
    const input = $('[data-axis-title]', block);
    if (input) {
      input.value = '';
      input.focus({ preventScroll:true });
    }
    return;
  }
  block.classList.add('cut-out');
  setTimeout(() => {
    block.remove();
    renumberAxisBlocks();
  }, 210);
}

function startAxisDrag(event) {
  if (event.button !== 0 || event.pointerType === 'touch') return;
  const track = event.target.closest('#axisTrack');
  if (!track) return;
  const add = event.target.closest('[data-axis-add]');
  const block = event.target.closest('.axis-block:not(.main)');
  if (!add && !block) return;
  if (!add && event.target.closest('textarea,button,input,select')) return;
  const rect = track.getBoundingClientRect();
  const line = $('#axisSliceLine', track);
  const blade = $('#axisBlade');
  axisDragState = {
    pointerId:event.pointerId, track, add, block, line, blade,
    startX:event.clientX, startY:event.clientY,
    startTop:clamp(event.clientY - rect.top, 0, rect.height),
    localX:clamp(event.clientX - rect.left, 3, rect.width - 3),
    moved:false, cut:false
  };
  window.addEventListener('pointermove', moveAxisDrag, { passive:false });
  window.addEventListener('pointerup', endAxisDrag);
  window.addEventListener('pointercancel', endAxisDrag);
}

function moveAxisDrag(event) {
  const drag = axisDragState;
  if (!drag || event.pointerId !== drag.pointerId) return;
  const dy = event.clientY - drag.startY;
  const dx = event.clientX - drag.startX;
  if (!drag.moved && Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
  if (!drag.moved) {
    drag.moved = true;
    document.documentElement.classList.add('axis-slicing');
    drag.blade?.classList.add('show');
    drag.track.classList.add('slicing');
  }
  if (event.cancelable) event.preventDefault();
  if (drag.blade) {
    drag.blade.style.left = `${event.clientX}px`;
    drag.blade.style.top = `${event.clientY}px`;
  }
  const rect = drag.track.getBoundingClientRect();
  const currentTop = clamp(event.clientY - rect.top, 0, rect.height);
  if (drag.line) {
    drag.line.style.left = `${drag.localX}px`;
    drag.line.style.top = `${Math.min(drag.startTop, currentTop)}px`;
    drag.line.style.height = `${Math.abs(currentTop - drag.startTop)}px`;
  }
  if (!drag.cut && dy >= 82) {
    drag.cut = true;
    axisClickLock = performance.now() + 500;
    if (drag.line) {
      drag.line.style.top = '0px';
      drag.line.style.height = `${rect.height}px`;
    }
    addAxisBlock(drag.block, {
      flashClientX: rect.left + drag.localX,
      focus:true
    });
  }
}

function endAxisDrag(event) {
  const drag = axisDragState;
  if (!drag || event.pointerId !== drag.pointerId) return;
  if (drag.moved) axisClickLock = performance.now() + 380;
  drag.blade?.classList.remove('show');
  drag.track.classList.remove('slicing');
  document.documentElement.classList.remove('axis-slicing');
  if (drag.line) {
    drag.line.style.top = '0px';
    drag.line.style.height = '0px';
  }
  window.removeEventListener('pointermove', moveAxisDrag);
  window.removeEventListener('pointerup', endAxisDrag);
  window.removeEventListener('pointercancel', endAxisDrag);
  axisDragState = null;
}

function dimensionTipAttrs(dimension) {
  const tip = String(dimension?.hint || dimension?.prompt || '').trim();
  if (!tip) return '';
  return `data-hover-tip data-tip-title="${esc(dimension.title || '维度说明')}" data-tip="${esc(tip)}"`;

function cellHTML(segId, dimension) {
  const cell = getCell(segId, dimension.id);
  const filled = isCellFilled(cell);
  if (!filled) {
    return `<button class="matrix-cell empty" type="button" data-open-cell data-cell-seg="${esc(segId)}" data-cell-dim="${esc(dimension.id)}" ${dimensionTipAttrs(dimension)}><span class="cell-plus">＋</span><div>点击填写</div></button>`;
  }
  const tags = (cell.tags || []).map(tag => `<span class="cell-tag">${esc(tag)}</span>`).join('');
  const text = (cell.text || '').trim();
  return `<button class="matrix-cell" type="button" data-open-cell data-cell-seg="${esc(segId)}" data-cell-dim="${esc(dimension.id)}" ${dimensionTipAttrs(dimension)}>
    ${tags ? `<div class="cell-tags">${tags}</div>` : ''}
    ${text ? `<div class="cell-text">${esc(text)}</div>` : ''}

}

      <div class="row-label-top"><span class="dim-dot ${esc(dimension.group || 'structure')}"></span><span class="row-title">${esc(dimension.title)}</span><span class="row-pick">换</span></div>
      <div class="row-hint">${esc(dimension.hint)}</div>

  return `<div class="matrix" style="--seg-count:${state.segments.length}">

  state.segments.push(segment);

  openSheet({ type:'segment', segId:segment.id, isNew:true });
}

function addCanvasColumn() {
  const segment = makeSegment('');
  state.segments.push(segment);
  save();
  renderTopBar();
  renderMain();
  requestAnimationFrame(() => {
    const segmentId = CSS.escape(segment.id);
    const summary = document.querySelector(`[data-summary-seg="${segmentId}"]`);
    const cells = [summary?.closest('.summary-cell'), ...$$(`[data-vcell-seg="${segmentId}"]`)].filter(Boolean);
    cells.forEach(cell => {
      cell.animate([
        { opacity:0, transform:'translateX(16px)', clipPath:'inset(0 0 0 100%)' },
        { opacity:1, transform:'translateX(-2px)', clipPath:'inset(0 0 0 0)', offset:.72 },
        { opacity:1, transform:'none', clipPath:'inset(0 0 0 0)' }
      ], { duration:520, easing:'cubic-bezier(.16,.84,.25,1)' });
    });
    if (summary) {
      summary.focus({ preventScroll:true });
      const range = document.createRange();
      range.selectNodeContents(summary);
      range.collapse(false);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }
  });
}

function discardBlankSegment(id) {
  const segment = segmentById(id);
  if (!segment) return false;
  const hasData = state.dimensions.some(dimension => isCellFilled(getCell(id, dimension.id)));
  if (segment.title.trim() || segment.result.trim() || segment.deadline.trim() || hasData) return false;
  state.segments = state.segments.filter(item => item.id !== id);
  Object.keys(state.cells).forEach(key => { if (key.startsWith(`${id}::`)) delete state.cells[key]; });
  save();
  return true;
}

function removeSegment(id) {
  const segment = segmentById(id);
  if (!segment) return;
  const hasData = state.dimensions.some(dimension => isCellFilled(getCell(id, dimension.id)));
  if (hasData && !confirm('这一列已经有内容，删除后无法恢复，继续吗？')) return false;
  state.segments = state.segments.filter(item => item.id !== id);
  Object.keys(state.cells).forEach(key => { if (key.startsWith(`${id}::`)) delete state.cells[key]; });
  save();
  return true;
}

function writeCell(segId, dimId, cell) {
  const key = cellKey(segId, dimId);
  const text = String(cell.text || '');
  const tags = Array.isArray(cell.tags) ? cell.tags : [];
  if (!text.trim() && !tags.length) delete state.cells[key];
  else state.cells[key] = { text, tags };
  queueSave();
}

function analysisStats() {
  const totals = { passive:0, periodic:0, uncertain:0, riskFilled:0, opportunityFilled:0 };
  state.segments.forEach(segment => {
    state.dimensions.forEach(dimension => {
      const cell = getCell(segment.id, dimension.id);
      if (!isCellFilled(cell)) return;
      if (dimension.id === 'task_time' && cell.tags.includes('随机被动')) totals.passive += 1;
      if (dimension.id === 'task_frequency' && cell.tags.includes('周期性')) totals.periodic += 1;
      if (dimension.id === 'task_method' && cell.tags.includes('不确定性决策')) totals.uncertain += 1;
      if (dimension.group === 'risk') totals.riskFilled += 1;
      if (dimension.group === 'opportunity') totals.opportunityFilled += 1;
    });
  });
  return totals;
}

function missingCells(limit = 6) {
  const list = [];
  state.segments.forEach(segment => state.dimensions.forEach(dimension => {
    if (!isCellFilled(getCell(segment.id, dimension.id)) && list.length < limit) list.push({ segment, dimension });
  }));
  return list;
}

    if (stats.uncertain >= 2) return '<b>不确定性决策占比不低</b><p>这些任务需要判断，而不是执行。它们更值得留整块时间，不适合塞进碎片时间。</p>';

  }).join('\n');
  const resultLine = state.mode === 'tasks' && state.root.result ? `${m.result}：${state.root.result}\n` : '';
  const deadlineLine = state.mode === 'tasks' && state.root.deadline && state.root.deadline !== state.root.title ? `${m.deadline}：${state.root.deadline}\n` : '';

function renderSheet() {
  const layer = $('#sheetLayer');

  document.body.classList.toggle('locked', Boolean(ui.sheet || ui.modal || ui.dimEditing));
  if (!ui.sheet) {
    layer.hidden = true;
    root.innerHTML = '';
    return;
  }
  let html = '';
  if (ui.sheet.type === 'cell') html = cellSheetHTML();
  else if (ui.sheet.type === 'segment') html = segmentSheetHTML();
  else if (ui.sheet.type === 'board') html = boardSheetHTML();
  else if (ui.sheet.type === 'summary') html = summarySheetHTML();
  else if (ui.sheet.type === 'analysis') html = analysisSheetHTML();
  if (!html) {
    layer.hidden = true;
    root.innerHTML = '';
    ui.sheet = null;
    return;
  }
  layer.hidden = false;
  root.innerHTML = html;
  if (ui.sheet.type === 'cell') requestAnimationFrame(() => $('#cellText')?.focus());
}

function boardCompletion(board) {
  const total = (board.segments || []).length * (board.dimensions || []).length;
  if (!total) return 0;
  let filled = 0;
  board.segments.forEach(segment => board.dimensions.forEach(dimension => {
    const cell = board.cells?.[`${segment.id}::${dimension.id}`];
    if (cell && ((cell.text || '').trim() || (cell.tags || []).length)) filled += 1;
  }));
  return Math.round(filled / total * 100);
}

async function importDimensionLibrary(file) {
  if (!file) return;
  try {
    const parsed = JSON.parse(await readTextFile(file));
    const raw = parsed?.type === 'business-decomposer.dimension-library' && Array.isArray(parsed.dimensions)
      ? parsed.dimensions
      : Array.isArray(parsed) ? parsed : Array.isArray(parsed?.dimensions) ? parsed.dimensions : null;
    if (!raw) throw new Error('format');
    const imported = raw
      .filter(item => item && typeof item === 'object' && (String(item.title || '').trim() || item.id))
      .map(normalizeDimensionRecord);
    if (!imported.length) throw new Error('empty');
    const byId = new Map(imported.map(item => [item.id, item]));
    const existingIds = new Set(dimensionLibrary.map(item => item.id));
    let updated = 0;
    dimensionLibrary = dimensionLibrary.map(item => {
      if (!byId.has(item.id)) return item;
      updated += 1;
      return byId.get(item.id);
    });
    let added = 0;
    imported.forEach(item => {
      if (existingIds.has(item.id)) return;
      dimensionLibrary.push(item);
      added += 1;
    });
    persistDimensionLibrary();
    refreshDimensionIndex();
    syncSelectedDimensionsFromLibrary();
    save();
    ui.dimEditing = null;
    ui.dimEditingAxis = null;
    renderAll();
    toast(`维度库已导入：更新 ${updated} 个，新增 ${added} 个`, 'success');
  } catch (error) {
    toast('维度库导入失败：不是有效的维度库 JSON', 'error');
  } finally {
    $('#dimensionImportFile').value = '';
  }
}

function animateDimensionCut(id) {

function replaceVerticalDimension(oldId, newId) {
  if (oldId === newId) { closeModal(); return; }
  if (state.dimensions.some(item => item.id === newId)) {
    toast('这个维度已经在竖轴里了', 'error');
    return;
  }
  const index = state.dimensions.findIndex(item => item.id === oldId);
  const next = dimensionSnapshot(newId);
  if (index < 0 || !next) return;
  const hasData = state.segments.some(segment => isCellFilled(getCell(segment.id, oldId)));
  if (hasData && !confirm('替换维度会清空这一行已有的内容，继续吗？')) return;
  state.dimensions[index] = next;
  if (Array.isArray(state.setup.dims)) {
    const setupIndex = state.setup.dims.indexOf(oldId);
    if (setupIndex >= 0) state.setup.dims[setupIndex] = newId;
    else state.setup.dims.push(newId);
  }
  Object.keys(state.cells).forEach(key => { if (key.endsWith(`::${oldId}`)) delete state.cells[key]; });
  save();
  closeModal();
  renderAll();
  animateDimensionCut(newId);
  toast('已换维度', 'success');
}

function toggleDimensionFromModal(id, card) {
  if (ui.dimReplace) { replaceVerticalDimension(ui.dimReplace, id); return; }
  const selected = state.dimensions.some(item => item.id === id);
  if (isSetupDimPick()) {
    if (selected) { toast('这一维已经在竖轴里了', 'error'); return; }
    const source = DIM_BY_ID[id];
    if (!source) return;
    state.dimensions.push(dimensionSnapshot(id));
    if (!Array.isArray(state.setup.dims)) state.setup.dims = [];
    if (!state.setup.dims.includes(id)) state.setup.dims.push(id);
    state.presetApplied = true;
    ui.vaxisCut = id;
    save();
    closeModal();
    renderMain();
    animateVerticalRowCut(id);
