  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  #rock-goal-sim {

      localStorage.setItem(STORE_KEY, JSON.stringify({ v: 2, focus: focus, targets: targets }));
    } catch (err) {
      storageOK = false;
    }
  }
  // 读存档，没有就返回 0
  function loadState() {
    let data = null;
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (err) {
      storageOK = false;
      return 0;
    }
    if (!data || !data.targets || !data.targets.length) return 0;
    const list = [];
    const src = data.targets.slice(0, MAX_TARGETS);
    for (let i = 0; i &lt; src.length; i++) {
      const t = src[i] || {};
      const factors = {};
      for (let bi = 0; bi &lt; BUCKETS.length; bi++) {
        const key = BUCKETS[bi].key;
        const raw = (t.factors &amp;&amp; t.factors[key]) || [];
        const arr = [];
        for (let k = 0; k &lt; raw.length; k++) {
          const it = raw[k] || {};
          arr.push({
            name: String(it.name == null ? &quot;&quot; : it.name),
            value: clamp(Math.round(Number(it.value) || 0), 0, FACTOR_MAX)
          });
        }
        factors[key] = arr;
      }
      list.push({ name: String(t.name || defaultName(i)), factors: factors });
    }
    if (!list.length) return 0;
    TARGETS.length = 0;
    for (let i = 0; i &lt; list.length; i++) TARGETS.push(list[i]);
    focus = clamp(Math.round(Number(data.focus) || 0), 0, list.length - 1);
    return 1;
  }

  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function bucketSum(t, key) {
    const list = t.factors[key];
    let total = 0;
    for (let i = 0; i &lt; list.length; i++) total += Number(list[i].value) || 0;
    return total;
  }
  function totals(i) {
    const t = TARGETS[i];
    const ext = bucketSum(t, &quot;ext&quot;), inn = bucketSum(t, &quot;int&quot;);
    const start = bucketSum(t, &quot;start&quot;), wear = bucketSum(t, &quot;wear&quot;), goal = bucketSum(t, &quot;goal&quot;);
    const drive = ext + inn, resist = start + wear + goal;
    return { ext: ext, int: inn, start: start, wear: wear, goal: goal,
             drive: drive, resist: resist, net: drive - resist };
  }
  // 三个阻力项各自对应画面上的一个东西
  function massFrom(start) { return clamp(5 + start * 0.75, 5, 120); }
  function angleFrom(goal) { return clamp(goal * 0.12, 4, 34) * Math.PI / 180; }
  function muFrom(wear) { return clamp(0.02 + wear / FACTOR_MAX * 0.26, 0.02, 0.28); }

  function params(i) {
    const T = totals(i);
    return {
      T: T,
      F: T.drive,
      drive: T.drive,
      resist: T.resist,
      net: T.net,
      gate: T.start,        // 启动门槛：只有&quot;人要开始推&quot;的时候才需要额外抬过去
      fric: T.wear,         // 内耗阻力：路况带来的摩擦，滚动时也一直在
      back: T.goal,
      m: massFrom(T.start),
      theta: angleFrom(T.goal),
      mu: muFrom(T.wear)
    };
  }
  function loadTargetUI() {
    if (el.nameInput) el.nameInput.value = tname(focus);
    syncSide();
    syncSideValues();
  }
  function roughOf(mu) {
    return Math.max(0, Math.min(1, (mu - MU_LO) / (MU_HI - MU_LO)));
  }

  function terrainAt(s, theta) {
    const c = Math.cos(theta), sn = Math.sin(theta);
    if (s &lt;= 0) return { x: s, y: 0, dx: 1, dy: 0, nx: 0, ny: 1, onRamp: false, slope: 0 };
    if (s &gt;= RAMP) return { x: RAMP * c + (s - RAMP), y: RAMP * sn, dx: 1, dy: 0, nx: 0, ny: 1, onRamp: false, slope: 0 };
    return { x: s * c, y: s * sn, dx: c, dy: sn, nx: -sn, ny: c, onRamp: true, slope: theta };
  }
  function rockScale(p) {
    return Math.min(1.62, Math.max(0.58, Math.cbrt(p.m / M_REF)));
  }

  function stepRock(r, p, pushForce, dt) {
    const roll = p.fric;                // 内耗阻力：路面摩擦，滚动中和静止时都在
    // 目标难度：只要还在坡上就一直往回拉；推上平台就算这一步达成，不再回拉
    const back = (r.s &gt; 0 &amp;&amp; !r.done) ? p.back : 0;
    let soft = 0;
    if (r.s &lt; SOFT_START &amp;&amp; r.v &lt; 0) soft = -DAMP_START * r.v;
    else if (r.s &gt; S_TOP - TOP_SOFT &amp;&amp; r.v &gt; 0) soft = -DAMP_TOP * r.v;
    // 启动门槛只在&quot;人在推&quot;的时候才算门槛；石头自己会不会往下滑，只看坡度(目标难度)和路况(内耗阻力)
    const gate = pushForce &gt; 0 ? p.gate : 0;
    let fric, stuck = false;
    if (Math.abs(r.v) &gt; 0.02) {
      fric = -Math.sign(r.v) * roll;
    } else {
      const want = pushForce - back;
      if (Math.abs(want) &lt;= roll + gate) { fric = -want; r.v = 0; stuck = true; }
      else fric = -Math.sign(want) * roll;
    }
    const a = (pushForce - back + fric + soft) / (p.m * ROLL);
    r.v += a * dt;
    r.s += r.v * dt;
    if (!r.done &amp;&amp; r.s &gt;= RAMP) r.done = true;   // 上到平台 = 阶段性达成，石头就留在平台上
    if (r.s &lt; SOFT_START &amp;&amp; r.v &lt; 0 &amp;&amp; r.v &gt; -HOLD_V) r.v = 0;
    if (r.s &lt; S_MIN) { r.s = S_MIN; if (r.v &lt; 0) r.v = 0; }
    if (r.s &gt; S_MAX) { r.s = S_MAX; if (r.v &gt; 0) r.v = 0; }
    r.rot += (r.v / (ROCK_R * rockScale(p))) * dt;
    r.last = { drive: pushForce, back: back, hold: roll + gate, fric: fric, stuck: stuck, a: a, net: a * p.m * ROLL };
  }

  function step(dt) {
    for (let i = 0; i &lt; TARGETS.length; i++) {
      const r = rocks[i];
      const p = params(i);
      const cap = Math.min(CAP_MAX, CAP_BASE + p.drive * CAP_PER_N);
      const want = (pushing &amp;&amp; i === focus) ? p.drive : 0;
      const contact = Math.max(0, Math.min(1, (cap - r.v) / PUSH_SOFT));
      stepRock(r, p, want * contact, dt);
    }
    const targetS = rocks[focus].s - (PERSON_GAP - ROCK_R + ROCK_R * rockScale(params(focus)));
    const targetZ = rocks[focus].z;
    const ds = targetS - person.s, dz = targetZ - person.z;
    const dist = Math.hypot(ds, dz);
    const maxStep = PERSON_SPEED * dt;
    let moved;
    if (dist &lt;= maxStep) { moved = dist; person.s = targetS; person.z = targetZ; }
    else { person.s += ds / dist * maxStep; person.z += dz / dist * maxStep; moved = maxStep; }
    person.speed = dt &gt; 0 ? moved / dt : 0;
    if (pushing &amp;&amp; Math.abs(rocks[focus].v) &lt; 0.4 &amp;&amp; dist &lt; 0.3) person.phase += 3.4 * dt;
    else person.phase += moved * 5.0;
    person.reach += ((pushing &amp;&amp; dist &lt; 0.3 ? 1 : 0) - person.reach) * Math.min(1, dt * 7);
  }
  function setArrow(arrow, ox, oy, oz, dx, dy, dz, len, color, visible) {
    arrow.visible = visible;
    if (!visible) return;
    originVec.set(ox, oy, oz);
    dirVec.set(dx, dy, dz).normalize();
    arrow.position.copy(originVec);
    arrow.setDirection(dirVec);
    const L = Math.max(0.3, len);
    arrow.setLength(L, Math.min(0.32, Math.max(0.09, L * 0.34)), Math.min(0.19, Math.max(0.055, L * 0.2)));
    tmpColor.set(color);
    arrow.setColor(tmpColor);
  }

  function updateBumps() {
    for (let i = 0; i &lt; BUMPS.length; i++) {
      const b = BUMPS[i];
      if (b.ti &gt;= TARGETS.length) { b.mesh.visible = false; continue; }
      const tp = params(b.ti);
      const on = b.rank &lt; roughOf(tp.mu);
      b.mesh.visible = on;
      if (!on) continue;
      const t = terrainAt(b.s, tp.theta);
      b.mesh.position.set(t.x + t.nx * b.sc * 0.42, t.y + t.ny * b.sc * 0.42,
        targetZ(b.ti) + b.z * laneWidthFactor());
    }
  }

  function updateScene() {
    const n = TARGETS.length;
    for (let i = 0; i &lt; n; i++) {
      const pi = params(i);
      buildSlab(i, pi.theta);
      const r = rocks[i];
      r.z = targetZ(i);
      slabs[i].group.position.z = r.z;
      slabs[i].group.scale.z = laneWidthFactor();
      const rough = roughOf(pi.mu);
      const t = terrainAt(r.s, pi.theta);
      const rs = rockScale(pi);
      r.mesh.position.set(t.x + t.nx * ROCK_R * rs, t.y + t.ny * ROCK_R * rs, r.z);
      r.mesh.rotation.set(r.rot * 0.85, r.rot * 0.55, r.rot);
      const want = rs * (i === hoverRock ? 1.09 : 1);
      r.mesh.scale.setScalar(r.mesh.scale.x + (want - r.mesh.scale.x) * 0.22);
      if (rough &gt; 0.02 &amp;&amp; Math.abs(r.v) &gt; 0.1) {
        const tt = performance.now() / 1000;
        const amp = rough * Math.min(0.075, Math.abs(r.v) * 0.07);
        const kick = Math.sin(tt * 61 + i * 2.1) * 0.6 + Math.sin(tt * 97 + i) * 0.4;
        r.mesh.position.y += kick * amp;
        r.mesh.position.z += Math.sin(tt * 83 + i * 1.7) * amp * 0.4;
        r.mesh.rotation.z += kick * rough * 0.4;
      }
      r.ring.position.set(t.x, t.y + 0.04, r.z);
      r.ring.scale.setScalar(rs);
      r.ring.visible = i === focus;
    }
    updatePad();
    updateBumps();

    const p = params(focus);
    const pt = terrainAt(person.s, p.theta);
    personRoot.position.set(pt.x, pt.y, person.z);
    personRoot.rotation.z = pt.slope;
    torso.rotation.z = -(0.05 + 0.42 * person.reach);
    const ph = person.phase;
    const swing = Math.min(0.55, 0.12 + person.speed * 0.22);
    legL.rotation.z = swing * Math.sin(ph);
    legR.rotation.z = swing * Math.sin(ph + Math.PI);
    armL.rotation.z = (0.58 + 0.16 * Math.sin(ph)) * person.reach;
    armR.rotation.z = (0.58 + 0.16 * Math.sin(ph + Math.PI)) * person.reach;

    const fr = rocks[focus];
    const ft = terrainAt(fr.s, p.theta);
    const cx = ft.x + ft.nx * ROCK_R;
    const cy = ft.y + ft.ny * ROCK_R;
    const dx = ft.dx, dy = ft.dy;

    if (!fr.last) {
      allArrows.forEach(function (a) { a.visible = false; });
      return;
    }
    const L = fr.last;
    const T = p.T;
    // 实际施加的比例（模式 2 里动力会被稀释，箭头也跟着变短）
    const applied = T.drive &gt; 0 ? L.drive / T.drive : 0;
    const extN = Math.min(4.4, T.ext * applied / N_PER_M);
    const intN = Math.min(4.4, T.int * applied / N_PER_M);
    setArrow(arrowPush, cx + dx * ROCK_R, cy + dy * ROCK_R, fr.z - 0.3, dx, dy, 0, extN, palette.push, extN &gt; 0.05);
    setArrow(arrowPush2, cx + dx * ROCK_R, cy + dy * ROCK_R, fr.z + 0.3, dx, dy, 0, intN, palette.push2, intN &gt; 0.05);
  }

  function updateBadges() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    for (let i = 0; i &lt; TARGETS.length; i++) {
      const pos = rocks[i].mesh.position;
      v3.set(pos.x, pos.y + ROCK_R * rockScale(params(i)) + 0.62 + i * 0.42, pos.z).project(camera);
      const behind = v3.z &gt; 1;
      badges[i].style.display = behind ? &quot;none&quot; : &quot;&quot;;
      if (behind) continue;
      badges[i].style.left = ((v3.x * 0.5 + 0.5) * w).toFixed(1) + &quot;px&quot;;
      badges[i].style.top = ((-v3.y * 0.5 + 0.5) * h).toFixed(1) + &quot;px&quot;;
      badges[i].setAttribute(&quot;aria-pressed&quot;, i === focus ? &quot;true&quot; : &quot;false&quot;);
    }
  }

  function setFocus(i) {

  function renderTargetTabs() {

  function refreshNames() {

  let laneCenter = 0;
  function panToLanes() {
    const c = laneCenterZ();

    laneCenter = c;
    controls.target.z += dz;

  function syncTargets() {

  // —— 单个目标的保存 / 导入：打包成一段可以复制、粘贴的参数 ——
  const shareBox = document.getElementById(&quot;rgs-share&quot;);
  const shareText = document.getElementById(&quot;rgs-share-text&quot;);
  const shareMsg = document.getElementById(&quot;rgs-share-msg&quot;);
  const shareNewBtn = document.getElementById(&quot;rgs-share-new&quot;);
  const shareApplyBtn = document.getElementById(&quot;rgs-share-apply&quot;);
  const shareCloseBtn = document.getElementById(&quot;rgs-share-close&quot;);
  const saveCodeBtn = document.getElementById(&quot;rgs-save-target&quot;);
  const loadCodeBtn = document.getElementById(&quot;rgs-load-target&quot;);

  function shareMsgSet(txt, bad) {
    if (!shareMsg) return;

    shareMsg.hidden = false;
    shareMsg.textContent = txt;

  }
  function openShareBox(mode) {

  function copyText(txt) {
    let ok = false;

    }
    try { ok = document.execCommand(&quot;copy&quot;); } catch (err) { ok = false; }
    if (!ok &amp;&amp; navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
      try { navigator.clipboard.writeText(txt); ok = true; } catch (err) {}
    }

  }
  // 一个目标 -&gt; 一段参数
  function targetToCode(i) {
    const t = TARGETS[i];
    const f = {};
    for (let bi = 0; bi &lt; BUCKETS.length; bi++) {
      const key = BUCKETS[bi].key;
      const list = t.factors[key] || [];
      const arr = [];
      for (let k = 0; k &lt; list.length; k++) {
        arr.push([String(list[k].name), Math.round(Number(list[k].value) || 0)]);
      }
      f[key] = arr;
    }
    return JSON.stringify({ rgs: 1, n: t.name, f: f });
  }
  // 一段参数 -&gt; 一个目标（宽松解析，值都夹到合法范围）
  function codeToTarget(text) {
    let data = JSON.parse(String(text == null ? &quot;&quot; : text).trim());
    if (typeof data === &quot;string&quot;) data = JSON.parse(data);
    if (!data || typeof data !== &quot;object&quot; || Array.isArray(data)) throw new Error(&quot;bad shape&quot;);
    const src = (data.f &amp;&amp; typeof data.f === &quot;object&quot;) ? data.f : {};
    const factors = {};
    for (let bi = 0; bi &lt; BUCKETS.length; bi++) {
      const key = BUCKETS[bi].key;
      const raw = Array.isArray(src[key]) ? src[key] : [];
      const arr = [];
      for (let k = 0; k &lt; raw.length; k++) {
        const it = raw[k];
        let nm, vl;
        if (Array.isArray(it)) { nm = it[0]; vl = it[1]; }
        else if (it &amp;&amp; typeof it === &quot;object&quot;) { nm = it.name; vl = it.value; }
        else continue;
        arr.push({ name: String(nm == null ? &quot;&quot; : nm),
                   value: clamp(Math.round(Number(vl) || 0), 0, FACTOR_MAX) });
      }
      factors[key] = arr;
    }
    return { name: String(data.n == null ? &quot;&quot; : data.n), factors: factors };
  }
  function addTargetFromData(data) {
    if (TARGETS.length &gt;= MAX_TARGETS) return false;
    const i = TARGETS.length;
    TARGETS.push(data);
    focus = i;
    syncTargets();
    const r = rocks[i];
    if (r) { r.s = START_S; r.v = 0; r.rot = i * 1.7 + 0.5; r.done = false; r.last = null; }

    setPushing(false);
    loadTargetUI();
    saveState();

  }
  if (saveCodeBtn) {
    saveCodeBtn.addEventListener(&quot;click&quot;, function () {

      setTimeout(function () { saveCodeBtn.textContent = &quot;保存参数&quot;; }, 1700);
      shareMsgSet(ok ? &quot;&quot; : &quot;没能自动复制，手动选中下面这段复制一下。&quot;, !ok);
    });
  }
  if (loadCodeBtn) {
    loadCodeBtn.addEventListener(&quot;click&quot;, function () { openShareBox(&quot;import&quot;); });
  }
  if (shareCloseBtn) {
    shareCloseBtn.addEventListener(&quot;click&quot;, function () {

    });
  }
  if (shareNewBtn) {
    shareNewBtn.addEventListener(&quot;click&quot;, function () {

      if (TARGETS.length &gt;= MAX_TARGETS) { shareMsgSet(&quot;最多 &quot; + MAX_TARGETS + &quot; 个目标，先删一个再加。&quot;, true); return; }
      if (!data.name) data.name = defaultName(TARGETS.length);

      if (shareBox) shareBox.hidden = true;
      shareMsgSet(&quot;&quot;);
    });
  }
  if (shareApplyBtn) {
    shareApplyBtn.addEventListener(&quot;click&quot;, function () {
      let data;
      try { data = codeToTarget(shareText ? shareText.value : &quot;&quot;); }
      catch (err) { shareMsgSet(&quot;这段参数读不出来，回去重新复制一次再粘。&quot;, true); return; }
      if (!data.name) data.name = tname(focus);
      TARGETS[focus] = data;
      refreshNames();
      if (el.nameInput) el.nameInput.value = tname(focus);
      if (openKey) renderDetail();

    });
  }

  function addTarget() {
    if (TARGETS.length &gt;= MAX_TARGETS) return;
    const i = TARGETS.length;
    TARGETS.push({
      name: defaultName(i),
      factors: {
        ext:   [fx(&quot;有人给我正反馈&quot;, 0)],
        int:   [fx(&quot;我自己真的想做&quot;, 0)],
        start: [fx(&quot;开始那一下的心理成本&quot;, 0)],
        wear:  [fx(&quot;边做边走神&quot;, 0)],
        goal:  [fx(&quot;这件事本身的难度&quot;, 0)]
      }
    });
    focus = i;
    syncTargets();
    const r = rocks[i];
    if (r) { r.s = START_S; r.v = 0; r.rot = i * 1.7 + 0.5; r.done = false; r.last = null; }
    demo = null;

  }
  function deleteTarget(i) {
    if (TARGETS.length &lt;= 1) return;
    if (i &lt; 0 || i &gt;= TARGETS.length) return;
    TARGETS.splice(i, 1);
    const r = rocks.splice(i, 1)[0];

  function pickRock(clientX, clientY) {
    const pickR = ROCK_R * rockScale(params(focus));
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return -1;
    const px = clientX - rect.left, py = clientY - rect.top;
    worldRight.setFromMatrixColumn(camera.matrixWorld, 0);
    let best = -1, bestD = Infinity;
    for (let i = 0; i &lt; TARGETS.length; i++) {
      const pos = rocks[i].mesh.position;
      projC.copy(pos).project(camera);
      if (projC.z &gt; 1) continue;
      const sx = (projC.x * 0.5 + 0.5) * rect.width;
      const sy = (-projC.y * 0.5 + 0.5) * rect.height;
      projE.copy(pos).addScaledVector(worldRight, pickR).project(camera);
      const ex = (projE.x * 0.5 + 0.5) * rect.width;
      const ey = (-projE.y * 0.5 + 0.5) * rect.height;
      const radius = Math.max(30, Math.hypot(ex - sx, ey - sy) * 1.45);
      const d = Math.hypot(px - sx, py - sy);
      if (d &lt;= radius &amp;&amp; d &lt; bestD) { bestD = d; best = i; }

    if (wasPushing) setPushing(false);

      demo = null;
      setFocus(rock);

  canvas.addEventListener(&quot;pointercancel&quot;, endPress);

    for (let i = 0; i &lt; TARGETS.length; i++) {
      rocks[i].s = START_S;
      rocks[i].v = 0;
      rocks[i].rot = i * 1.7 + 0.5;
      rocks[i].done = false;
      rocks[i].last = null;
    }
    person.s = rocks[focus].s - (PERSON_GAP - ROCK_R + ROCK_R * rockScale(params(focus)));
    person.z = rocks[focus].z;
    person.phase = 0;
    person.reach = 0;
    person.speed = 0;
    setPushing(false);

    if (el.net.getAttribute(&quot;data-sign&quot;) !== sign) el.net.setAttribute(&quot;data-sign&quot;, sign);
    el.net.textContent = (T.net &gt; 0.5 ? &quot;+&quot; : &quot;&quot;) + Math.round(T.net) + &quot; N&quot;;
    el.sumDrive.textContent = Math.round(T.drive) + &quot; N&quot;;
    el.sumResist.textContent = Math.round(T.resist) + &quot; N&quot;;
    el.valExt.textContent = Math.round(T.ext) + &quot; N&quot;;
    el.valInt.textContent = Math.round(T.int) + &quot; N&quot;;
    el.valStart.textContent = Math.round(T.start) + &quot; N&quot;;
    el.valWear.textContent = Math.round(T.wear) + &quot; N&quot;;

      const ratio = k / zoomK;

  function frame(now) {

  loadState();
  syncTargets();
  applyPalette();
  resize();
  loadTargetUI();
  reset();
  updateDom(params(focus), true);
  requestAnimationFrame(frame);

  }`;

  const skipDelay = 300;

  let pendingTrigger = null;

  let openTimeout = null;

(() =&gt; {

  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;

      selectTab(tab);
      return;

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));

      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;

    }

})();

      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
