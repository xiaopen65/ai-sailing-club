function composeProjectMarkdown(project) {
  const answered = projectAnsweredQuestions(project);
  const open = projectOpenQuestions(project);
  const feed = (project.feed || []).map((f) => f.text).filter(Boolean);
  const title = project.title || "未命名项目";
  const background = feed.length ? feed.join("\n") : "（还没有补充背景）";
  const confirmed = answered.length ? answered.map((q, i) => (i + 1) + ". **" + q.text + "**\n   " + (q.summary || q.answer)).join("\n") : "- 暂无已确认结论。";
  const pending = open.length ? open.map((q) => "- " + q.text).join("\n") : "- 暂无未决问题。";
  return [
    "# " + title,
    "",
    "## 背景",
    background,
    "",
    "## 目标",
    answered.length ? (answered[0].summary || "把「" + title + "」推进到一个可以被别人使用和验证的版本。") : "把「" + title + "」从一个模糊方向，推进到一个可以被别人使用和验证的版本。",
    "",
    "## 已确认",
    confirmed,
    "",
    "## 关键决策",
    "- 先处理能改变方向的问题，不先铺完整计划。",
    "- 每次只推进一个最小可验证动作。",
    "",
    "## 未决",
    pending,
    "",
    "## 交付要求",
    "- 产物必须能让没有参与讨论的人直接理解并使用。",
    "- 保留判断依据，不只给结论。",
    "",
    "## 任务线 1：收束定义",
    "- 目标：把尚未决的问题收敛成一个明确判断。",
    "- 输入：本文件「背景 / 已确认 / 未决」。",
    "- 产出：一页项目定义，包含对象、边界、最小动作。",
    "- 验收：所有未决问题都有结论或被明确删除。",
    "",
    "## 任务线 2：做出最小交付",
    "- 目标：做出第一个能给别人看的版本。",
    "- 输入：项目定义 + 已确认结论。",
    "- 产出：可运行的页面、文档或流程。",
    "- 验收：一个没参与讨论的人能独立走完核心路径。",
    "",
    "## 任务线 3：拿真实反馈验证",
    "- 目标：验证这件事是否真的有人需要。",
    "- 输入：最小交付 + 3 个目标用户。",
    "- 产出：反馈记录与下一轮问题池。",
    "- 验收：至少得到一个会改变下一版动作的真实反馈。"
  ].join("\n");
}

function showProjectCompose() {
  const project = projectById(state.projectId);
  if (!project) return;
  const md = composeProjectMarkdown(project);
  window.__projectMd = md;
  showModal("成型 · " + (project.title || "未命名项目"), '<div class="compose-md">' + esc(md) + '</div>',

}

function downloadProjectMd() {
  const project = projectById(state.projectId);

  const blob = new Blob([window.__projectMd], { type: "text/markdown;charset=utf-8" });

  a.download = String(project.title || "项目").replace(/[\\/:*?"<>|]/g, "_") + ".md";

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(reader.error || new Error("读取失败"));
    reader.readAsDataURL(file);
  });
}
async function pickDmImages(input) {

    try {
      const dataUrl = await fileToDataUrl(file);
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dataUrl, name: file.name })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "上传失败");
      dmAttach.push({ path: data.path, url: data.url, name: file.name });

function buildWorkshop(event, prev) {
  prev = prev || {};
  const oldSpeakers = Array.isArray(prev.speakers) ? prev.speakers : [];
  const hasSteps = prev.steps && Object.keys(prev.steps).length > 0;
  const initialSteps = hasSteps ? prev.steps : {
    opening: { inputs: {}, out: "", source: "", done: false, active: true }
  };
  return Object.assign({}, prev, {
    phase: 1,
    eventId: event.id || "",
    updatedAt: new Date().toISOString(),
    activity: Object.assign({}, prev.activity || {}, {
      name: event.name || "", date: event.date || "", time: event.time || "", form: event.form || "",
      meetingNo: event.meetingNo || "", meetingLink: event.meetingLink || "",
      join: event.meetingLink || (event.meetingNo ? "腾讯会议 " + event.meetingNo : (prev.activity && prev.activity.join) || "会议链接在群里公布"),
      register: event.register || "群内接龙报名", deadline: event.deadline || ""
    }),
    speakers: (event.speakers || []).map((sp, i) => {
      const old = oldSpeakers.find((x) => x.name && x.name === sp.name) || oldSpeakers[i] || {};
      return Object.assign({}, old, {
        name: sp.name || "", title: sp.title || "", intro: sp.intro || old.intro || "",
        highlight: sp.highlight || old.highlight || "",
        story: sp.story || old.story || "", takeaway: sp.takeaway || old.takeaway || "",
        rehearsal: sp.rehearsal || old.rehearsal || "",
        photo: sp.photo || old.photo || "",
        photoStatus: sp.photoStatus || (sp.photo ? "received" : old.photoStatus || ""),
        photoConsent: sp.photoConsent || old.photoConsent || "",
        poster: old.poster || "", article: old.article || ""
      });
    }),
    ai: prev.ai || undefined, poster: prev.poster || undefined, steps: initialSteps, stepsCfg: prev.stepsCfg || {},
    checklist: prev.checklist || { device: {}, content: {}, flow: {} },
    qaNotes: prev.qaNotes || [],
    agenda: Object.assign({ opening: 5, icebreak: 10, info: 25, moment: 15, dm: 15, qa: 15, notice: 10, closing: 5 }, prev.agenda || {})
  });
}
function buildOps(event, prev) {
  prev = prev || {};
  const id = "ops-" + (event.slug || event.id);
  const oldEvents = Array.isArray(prev.events) ? prev.events : [];
  const old = oldEvents.find((e) => e.id === id) || oldEvents.find((e) => e.activityName === event.name) || {};
  const oldSpeakers = Array.isArray(old.speakers) ? old.speakers : [];
  const next = Object.assign({}, old, {
    id, activityName: event.name || "", talkDate: event.date || "", talkTime: event.time || "",
    meetingNo: event.meetingNo || "", publicLink: old.publicLink || "", registerLink: old.registerLink || "",
    note: "由开说工作室主档同步，发布前需老板审核。",
    speakers: (event.speakers || []).map((sp, i) => ({
      id: (oldSpeakers[i] && oldSpeakers[i].id) || ("s" + (i + 1)), name: sp.name || "", topic: sp.title || ""
    })),
    modules: Array.isArray(old.modules) && old.modules.length ? old.modules : undefined
  });
  const events = oldEvents.filter((e) => e.id !== id && e.activityName !== event.name);
  events.push(next);
  return Object.assign({}, prev, { currentId: id, events });
}
function buildHost(event, prev) {
  prev = prev || {};
  const oldGuests = Array.isArray(prev.guests) ? prev.guests : [];
  return Object.assign({}, prev, {
    guests: (event.speakers || []).map((sp, i) => Object.assign({}, oldGuests[i] || {}, {
      name: sp.name || "", body: sp.title || "", comment: (oldGuests[i] && oldGuests[i].comment) || ""
    }))
  });
}

    const ops = buildOps(state.event, o.data);
    const host = buildHost(state.event, h.data);
    await Promise.all([
      api("/api/data/workshop", { method: "PUT", body: JSON.stringify({ data: workshop }) }),
      api("/api/data/ops", { method: "PUT", body: JSON.stringify({ data: ops }) }),
      api("/api/data/host", { method: "PUT", body: JSON.stringify({ data: host }) })
    ]);
    localStorage.setItem("kaishuo_workshop_v1", JSON.stringify(workshop));
    localStorage.setItem("kaishuo_ops_system_v1", JSON.stringify(ops));
    localStorage.setItem("kaishuo_host_v1", JSON.stringify(host));
    $$("#deckBody iframe").forEach((frame) => {
      try { frame.contentWindow.postMessage({ type: "kaishuo:refresh" }, location.origin); } catch (err) {}
    });
    toast("三个工作台已同步");
  } catch (err) { toast(err.message); }
}

async function readStream(res, onEvent) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buffer += decoder.decode(chunk.value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop() || "";
    for (const line of lines) {
      if (!line.trim()) continue;
      let ev; try { ev = JSON.parse(line); } catch { continue; }
      onEvent(ev);
    }
  }
}
async function produceAll(only) {
  if (state.producing) return;
  only = ["poster", "ops", "host"].includes(only) ? only : "all";
  const draft = $("#chatInput") ? $("#chatInput").value : "";
  state.producing = true;
  render();
  if (draft && $("#chatInput")) $("#chatInput").value = draft;
  try {
    const res = await fetch("/api/produce", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ eventId: state.event ? state.event.id : "", only })
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "生成失败");
    let count = 0;
    await readStream(res, (ev) => {
      if (ev.type === "done") {
        count = ev.count || (ev.files || []).length;
        state.deliverables = ev.allFiles || ev.files || state.deliverables;
      }
      if (ev.type === "error") throw new Error(ev.message || "生成失败");
    });
    const label = { all: "三件套", poster: "海报", ops: "运营包", host: "主持包" }[only];
    toast(label + "已更新" + (count ? " · " + count + " 个文件" : ""));
  } catch (err) {
    toast(err.message);
  } finally {
    state.producing = false;
    if (draft && $("#chatInput")) $("#chatInput").value = draft;
    render();
  }
}

function opsFile(ext) {
  return (state.deliverables || []).find((f) => (f.dir || "").indexOf("03_运营") !== -1 && f.ext === ext);
}

function copyPreview() { if (window.__previewText) copyText(window.__previewText, "群公告已复制"); }
async function copyOps() {

  catch (err) { toast("读取失败：" + err.message); }
}

let officeAiTimer = null;
let officeAiSeen = null;
let officeToastTimer = null;
function officeSeenMap(){
  if (officeAiSeen) return officeAiSeen;
  try { officeAiSeen = JSON.parse(localStorage.getItem("kaishuo.aiStatusSeen") || "{}") || {}; }
  catch (e) { officeAiSeen = {}; }
  return officeAiSeen;
}
function officeSeenSave(){
  try { localStorage.setItem("kaishuo.aiStatusSeen", JSON.stringify(officeAiSeen)); } catch (e) {}
}
function aiToldOnce(ids){
  const key = "kaishuo.aiTold";
  let told = {};
  try { told = JSON.parse(localStorage.getItem(key) || "{}") || {}; }
  catch (e) { told = {}; }
  const stamp = (ids || []).slice().sort().join(",");
  const now = Date.now();
  Object.keys(told).forEach((k) => { if (!(now - told[k] < 1800000)) delete told[k]; });
  const hit = Boolean(told[stamp]) && (now - told[stamp] < 180000);
  told[stamp] = now;
  try { localStorage.setItem(key, JSON.stringify(told)); } catch (e) {}
  return hit;
}
function officeToast(title, desc){
  const el = $("#officeToast");
  if (!el) return;
  $("#officeToastTitle").textContent = title || "老大，工作完成了。";
  $("#officeToastDesc").textContent = desc || "";
  el.classList.add("show");
  clearTimeout(officeToastTimer);
  officeToastTimer = setTimeout(() => el.classList.remove("show"), 7000);
}
function openPosterFromToast(){
  const el = $("#officeToast");
  if (el) el.classList.remove("show");
  if (state.dialog !== "poster") openEmployeeDialog("poster");
}
async function watchAiJobs(){
  let jobs = [];
  try {
    const res = await fetch("/api/ai-image/jobs?limit=20");
    if (!res.ok) return;
    jobs = ((await res.json()).jobs) || [];
  } catch (e) { return; }
  const seen = officeSeenMap();
  const fresh = [];
  jobs.forEach((job) => {
    const prev = seen[job.id];
    if (prev && prev !== job.status && (job.status === "done" || job.status === "error")) fresh.push(job);
  });
  jobs.forEach((job) => { seen[job.id] = job.status; });
  const live = new Set(jobs.map((job) => job.id));
  Object.keys(seen).forEach((id) => { if (!live.has(id)) delete seen[id]; });
  officeSeenSave();
  if (fresh.length && !aiToldOnce(fresh.map((job) => job.id))) {
    const okJobs = fresh.filter((job) => job.status === "done");
    const failCount = fresh.length - okJobs.length;
    if (okJobs.length) {
      officeToast("老大，工作完成了。", failCount
        ? failCount + " 个没画成，点这里看结果"
        : "阿图交了 " + okJobs.length + " 张图，点这里看");
    } else {
      officeToast("老大，这次没画成。", "点这里看原因，可以重试");
    }
  }
  const active = jobs.some((job) => job.status === "queued" || job.status === "running");
  if (officeAiTimer) { clearTimeout(officeAiTimer); officeAiTimer = null; }
  officeAiTimer = setTimeout(watchAiJobs, active ? 3000 : 20000);
}

async function init() {
  $$("#nav .navbtn").forEach((btn) => btn.addEventListener("click", () => { if (btn.dataset.view) go(btn.dataset.view); }));
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (!$("#deck").hidden) { closeDeck(); return; }
    if (state.dialog) { closeEmployeeDialog(); return; }
    if ($("#modal").classList.contains("open")) closeModal();
  });
  window.addEventListener("message", (event) => {
    if (event.origin !== location.origin) return;
    const data = event.data || {};
    if (data.type === "kaishuo:switch" && !$("#deck").hidden) switchDeck(data.deck);
  });
  window.addEventListener("focus", () => { refreshHealth(); });
  if (LOCAL_BASE) {
    const health = await checkHealth();
    if (health) { window.location.replace(LOCAL_BASE + "/"); return; }
    state.error = "本地服务未启动";
    state.loaded = true;
    healthCheckedAt = Date.now();
    render();
    return;
  }
  try {
    const [health, studio, deliv, know, service, projects] = await Promise.all([
      api("/api/health"), api("/api/data/studio"), api("/api/deliverables"), api("/api/knowledge"),
      api("/api/service/status").catch(() => ({ autostart: false })),
      api("/api/data/projects").catch(() => ({ data: { projects: [] } }))
    ]);
    state.health = health;
    state.autostart = Boolean(service.autostart);
    state.studio = studio.data;
    state.event = currentEvent();
    state.deliverables = deliv.files || [];
    state.knowledge = know.files || [];
    state.projects = projects && projects.data && typeof projects.data === "object"
      ? projects.data
      : { projects: [] };
    healthCheckedAt = Date.now();
    state.loaded = true;
    loadUI();
    render();
    if (new URLSearchParams(location.search).get("wb") === "1") openWorkbench();
    syncAiJobs();
    watchAiJobs();
  } catch (err) {
    state.error = err.message;
    state.health = null;
    state.loaded = true;
    render();
  }
}
init();
