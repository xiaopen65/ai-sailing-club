<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小P办公室</title>
<link rel="icon" href="assets/icons/p-office.svg">
<link rel="icon" href="favicon.svg">
<style>
:root{
  --bg:#f2ede3; --paper:#fbf8f1; --card:#fffdf8; --ink:#1d1b16; --sub:#6f6758;
  --line:#ddd3c1; --line-soft:#ebe4d6; --accent:#bf452c; --accent-soft:#f6e2da;
  --green:#3f6a52; --green-soft:#e5efe7; --amber:#9a6f26;
  --serif:"Songti SC","Noto Serif SC",SimSun,serif;
  --sans:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:Consolas,"SFMono-Regular",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(60,48,30,.055) .6px,transparent .6px);
  background-size:18px 18px;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:#e9cdc2}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;background:#191712;color:#d8cfbd;
  display:flex;flex-direction:column;padding:24px 16px 18px;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}
.brand-mark{
  width:40px;height:40px;display:grid;place-items:center;flex:none;
}
.brand-mark svg{width:40px;height:40px;display:block;border-radius:11px}
.brand-name{font-family:var(--serif);font-size:17px;letter-spacing:.06em;color:#f7f0df}
.brand-sub{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:#7f7663;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border:1px solid transparent;
  background:transparent;color:#bdb3a0;text-align:left;font-size:13px;letter-spacing:.03em;border-radius:4px;
  transition:.15s ease;
}
.navbtn .ni{font-family:var(--mono);font-size:9px;color:#736a58;width:18px;flex:none}
.navbtn:hover{color:#f6efdf;background:#221f18}
.navbtn.active{color:#1d1b16;background:#f7f1e5}
.navbtn.active .ni{color:var(--accent)}
.sidefoot{margin-top:auto;padding:14px 8px 0;border-top:1px solid #2c2920;font-size:10px;color:#8b8170}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5e9a72;margin-right:7px;vertical-align:1px}
.dot.off{background:#a4523d}
.sidefoot .mono{font-family:var(--mono);font-size:9px;color:#6f6656;margin-top:3px}
.sidefoot button{margin-top:10px;background:none;border:1px solid #353126;color:#a99f8c;padding:6px 8px;font-size:10px;width:100%;border-radius:3px}
.sidefoot button:hover{color:#f4eddd;border-color:#5b5343}
.sidefoot button.primary{border-color:#5f7052;background:#2a2f22;color:#e6efdb}
.sidefoot button.primary:hover{border-color:#8ba173;color:#fff8ec}
.sidefoot button:disabled{opacity:.55;cursor:default}
.main{padding:26px 36px 34px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.page-title{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.04em;margin:0;line-height:1.2}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:transparent;color:var(--ink);padding:8px 13px;font-size:12.5px;border-radius:4px;text-decoration:none;
  transition:.15s ease;white-space:nowrap;
}
.btn:hover{background:#f7f1e5;border-color:#c9bda6}
.btn[hidden]{display:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff8ec}
.btn.primary:hover{background:#a83a24;border-color:#a83a24}
.btn.ghost{border-color:transparent;color:var(--sub);padding:6px 9px}
.btn.ghost:hover{color:var(--ink);background:#f0e9db}
.btn.small{padding:5px 9px;font-size:11px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.home-wrap{max-width:960px;margin:0 auto}
.context-strip{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;
  border:1px solid var(--line-soft);background:rgba(255,253,248,.65);border-radius:6px;font-size:11.5px;color:var(--sub);
}
.context-strip b{color:var(--ink);font-weight:600}
.context-strip .sep{width:1px;height:11px;background:var(--line)}
.context-strip .warn{color:var(--amber)}
.chat-shell{
  background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;height:calc(100vh - 208px);min-height:480px;overflow:hidden;
}
.msg-list{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{max-width:76%;background:var(--ink);color:#faf4e7;padding:11px 15px;border-radius:12px 12px 3px 12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg-agent{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px}
.avatar{
  width:32px;height:32px;border-radius:3px;display:grid;place-items:center;font-family:var(--serif);
  font-size:16px;border:1px solid rgba(0,0,0,.08);flex:none;overflow:hidden;
}
.avatar img,.emp-card-avatar img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.agent-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.agent-name{font-size:12.5px;font-weight:600}
.agent-role{font-size:10px;color:#9b8f79}
.agent-time{font-family:var(--mono);font-size:9px;color:#b0a48d;margin-left:auto}
.agent-body{font-size:14px;line-height:1.78;color:#2b271f;word-break:break-word}
.agent-body strong{font-weight:600;color:#15130f}
.agent-body code{font-family:var(--mono);font-size:11.5px;background:#f0e9db;padding:1px 4px;border-radius:3px}
.msg-system{align-self:center;max-width:90%;font-size:11px;color:#8a7f6b;background:#f3ecdd;border:1px solid var(--line-soft);padding:5px 10px;border-radius:999px;text-align:center}
.msg-linkcard{align-self:stretch;border:1px solid #d9c7ab;background:#fbf2e2;border-radius:8px;padding:14px 16px}
.msg-linkcard b{display:block;font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:3px}
.msg-linkcard p{margin:0 0 10px;font-size:11.5px;color:#6f6758}
.msg-linkcard .btn{background:#fffdf8}
.msg-linkcard .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff8ec}
.msg-linkcard .btn.primary:hover{background:#a83a24;border-color:#a83a24}
.msg-files{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.msg-files a{font-size:10.5px;text-decoration:none;border:1px solid var(--line-soft);background:#fffdf8;color:#6c6251;padding:3px 7px;border-radius:999px}
.msg-files a:hover{border-color:#cdbfa6;color:var(--ink)}
.msg-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.msg-imgs a{display:block;line-height:0}
.msg-imgs img{width:124px;height:124px;object-fit:cover;border-radius:8px;border:1px solid var(--line-soft);background:#f3ecdd}
.msg-imgs img:hover{border-color:#c9bda6}
.msg-user .user-stack{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:76%}
.msg-user .user-stack .bubble{max-width:100%}
.msg-user .user-stack .msg-imgs{margin-top:0;justify-content:flex-end}
.attach-strip{display:none;flex-wrap:wrap;gap:8px;padding:2px 2px 8px}
.attach-strip.has{display:flex}
.attach-thumb{position:relative;width:52px;height:52px;border-radius:6px;overflow:hidden;border:1px solid var(--line-soft)}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-thumb button{position:absolute;top:2px;right:2px;width:16px;height:16px;border:0;border-radius:50%;background:rgba(20,16,10,.72);color:#fff;font-size:11px;line-height:16px;padding:0;cursor:pointer}
.attach-btn{width:26px;height:26px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:#fffdf9;color:#8a7d64;cursor:pointer}
.attach-btn:hover{border-color:#c9bda6;color:var(--ink)}
.attach-btn svg{width:14px;height:14px}
.attach-btn input{display:none}
.msg-actions-card{align-self:stretch;border:1px solid var(--line-soft);background:#fffdf8;border-radius:8px;padding:13px 15px;font-size:12px;color:#6f6758}
.msg-actions-card .row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.steps{margin-top:8px;border-top:1px dashed var(--line-soft);padding-top:6px;font-size:10.5px;color:var(--sub)}
.steps summary{cursor:pointer;list-style:none;display:inline-flex;gap:5px;align-items:center;color:#8d8069}
.steps summary::-webkit-details-marker{display:none}
.steps summary:before{content:"▸";font-size:9px;transition:.15s}
.steps[open] summary:before{transform:rotate(90deg)}
.step{padding:3px 0 3px 12px;border-left:1px solid var(--line);margin-top:4px;font-family:var(--mono);font-size:9.5px;line-height:1.6;color:#7d715c;word-break:break-all}
.step.err{color:#a3452e;border-left-color:#d7a08f}
.typing{display:flex;align-items:center;gap:8px;font-size:11px;color:#8d8069;padding:2px 0 2px 43px}
.typing i{width:4px;height:4px;border-radius:50%;background:#a89b84;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,70%,100%{opacity:.25}35%{opacity:1}}
.composer{border-top:1px solid var(--line-soft);background:#fffdf9;padding:12px 16px 14px}
.composer textarea{
  width:100%;min-height:44px;max-height:150px;resize:none;border:0;outline:0;background:transparent;
  font-size:14px;line-height:1.65;padding:3px 2px;
}
.composer textarea::placeholder{color:#b1a58f}
.composer-bar{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.mention{
  border:1px solid var(--line-soft);background:#faf5ea;color:#6c6251;font-size:10.5px;padding:3px 8px;border-radius:999px;
}
.mention:hover{border-color:#cdbfa6;color:var(--ink)}
.composer-state{font-size:10px;color:#9b8f79;margin-left:2px}
.composer-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.modebtn{border:1px solid var(--line-soft);background:#f7f1e5;color:#6c6251;font-size:10.5px;padding:5px 9px;border-radius:999px}
.modebtn.task{color:var(--accent);border-color:#e3c4b8;background:var(--accent-soft)}
.send{width:38px;height:34px;border:0;border-radius:4px;background:var(--accent);color:#fff8ec;font-size:15px;display:grid;place-items:center}
.send:hover{background:#a83a24}
.send:disabled{background:#d8cdb9;cursor:not-allowed}
.empty-chat{padding:34px 8px 10px;color:#8d8069;font-size:12.5px;line-height:1.9}
.empty-chat b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:500;margin-bottom:6px}
.starter{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.starter button{border:1px dashed #d6c9b2;background:transparent;color:#7a6e5a;font-size:11px;padding:5px 9px;border-radius:999px}
.starter button:hover{background:#f8f2e6;color:var(--ink)}
.team-layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:16px;height:calc(100vh - 190px);min-height:520px}
.team-main{display:flex;flex-direction:column;min-width:0}
.emp-switch{display:flex;gap:4px;padding:4px;background:#e9e1d2;border-radius:999px;width:fit-content;max-width:100%;overflow:auto;margin-bottom:10px}
.emp-tab{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:#6d6351;padding:6px 12px;border-radius:999px;font-size:11.5px;white-space:nowrap}
.emp-tab .mini{width:20px;height:20px;border-radius:2px;display:grid;place-items:center;font-family:var(--serif);font-size:11px;border:1px solid rgba(0,0,0,.06)}
.emp-tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(50,40,25,.1)}
.emp-tab .bd{width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:1px}
.team-main .chat-shell{height:100%}
.team-home{max-width:900px;margin:0 auto;padding-bottom:20px}
.team-lead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 2px 16px}
.team-lead h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:.03em}
.employee-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.employee-card{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;min-height:196px;box-shadow:0 1px 0 rgba(60,48,30,.04);transition:.18s ease;cursor:pointer}
.employee-card:hover{border-color:#c9bda6;transform:translateY(-2px);box-shadow:0 12px 30px rgba(60,48,30,.08)}
.employee-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.emp-card-head{display:flex;align-items:flex-start;gap:11px}
.emp-card-avatar{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;font-family:var(--serif);font-size:21px;border:1px solid rgba(0,0,0,.06);flex:none;overflow:hidden}
.emp-card-name{font-size:15.5px;font-weight:600;letter-spacing:.02em}
.emp-card-role{font-size:10.5px;color:#9b8f79;margin-top:1px}
.emp-card-duty{margin:14px 0 16px;font-size:11.5px;line-height:1.7;color:#6f6758}
.emp-card-status{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:10.5px;color:#8d8069}
.emp-arrow{margin-left:auto;font-family:var(--mono);font-size:11px;color:#b0a48d}
.emp-status-dot{width:6px;height:6px;border-radius:50%;background:#c9bda6;flex:none}
.emp-status-dot.running{background:#dfb32b;animation:statusPulse 1.1s infinite}
.emp-status-dot.done{background:var(--green)}
.emp-status-dot.error{background:#a3452e}
.employee-card[data-status="running"] [data-emp-status]{padding:2px 9px;border-radius:999px;background:#f7d45a;color:#4a3800;font-weight:600;letter-spacing:.02em}
@keyframes statusPulse{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.emp-dialog{position:fixed;inset:0;background:rgba(24,21,16,.42);display:none;place-items:center;z-index:60;padding:18px}
.emp-dialog.open{display:grid}
.emp-dialog-card{background:var(--card);border:1px solid var(--line);border-radius:8px;width:min(1180px,calc(100vw - 48px));height:min(88vh,940px);min-width:min(560px,calc(100vw - 24px));min-height:min(480px,calc(100vh - 24px));max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;resize:both;box-shadow:0 30px 80px rgba(20,16,10,.28)}
.emp-dialog-card.expanded{width:calc(100vw - 28px)!important;height:calc(100vh - 28px)!important;max-width:none!important;max-height:none!important;resize:none}
.emp-dialog-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);background:#fffdf9}
.emp-dialog-head .avatar{width:36px;height:36px;font-size:17px}
.emp-dialog-title{min-width:0}
.emp-dialog-title h2{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.emp-dialog-title p{margin:1px 0 0;font-size:10.5px;color:#9b8f79;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
.emp-dialog-head .spacer{margin-left:auto}
.dialog-close{width:30px;height:30px;border:1px solid var(--line-soft);background:transparent;border-radius:4px;color:#8d8069;font-size:18px;line-height:1;display:grid;place-items:center;flex:none}
.dialog-close:hover{background:#f2ebdd;color:var(--ink)}
.dialog-size-btn{width:30px;height:30px;border:1px solid var(--line-soft);background:transparent;border-radius:4px;color:#8d8069;padding:0;display:grid;place-items:center;flex:none}
.dialog-size-btn:hover{background:#f2ebdd;color:var(--ink)}
.dialog-size-btn svg{width:14px;height:14px;display:block}
.dialog-size-btn .icon-restore{display:none}
.hidden{display:none!important}
.dialog-gear{width:30px;height:30px;border:1px solid var(--line-soft);background:transparent;border-radius:4px;color:#8d8069;padding:0;display:grid;place-items:center;flex:none}
.dialog-gear:hover{background:#f2ebdd;color:var(--ink)}
.dialog-gear svg{width:15px;height:15px;display:block}
.emp-status-dot.away{background:#b9b1a3}
.pf-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pf-avatar{width:64px;height:64px;font-size:26px}
.pf-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pf-avatar-ops{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pf-hint{width:100%;font-size:11px;color:#9b8f79}
.pf-field{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf-field label{flex:none;width:44px;font-size:12px;color:#8a7c66}
.pf-field input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:4px;background:#fffdf8;padding:0 10px;font-size:12.5px;color:var(--ink);font-family:inherit}
.pf-field input:focus{outline:none;border-color:#c0a37b}
.pf-chips{display:flex;gap:6px;flex-wrap:wrap}
.pf-chip{border:1px solid var(--line);background:#fffdf8;color:#6c6251;font-size:11.5px;padding:5px 11px;border-radius:999px;cursor:pointer}
.pf-chip:hover{border-color:#cdbfa6;color:var(--ink)}
.pf-chip.on{background:var(--ink);border-color:var(--ink);color:#fff8ec}
.emp-dialog-card.expanded .dialog-size-btn .icon-expand{display:none}
.emp-dialog-card.expanded .dialog-size-btn .icon-restore{display:block}
.dialog-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 16px;background:#faf6ec;border-bottom:1px solid var(--line-soft)}
.dialog-quick .q-label{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:#a2957d;margin-right:2px}
.dialog-quick button{border:1px solid var(--line-soft);background:#fffdf8;color:#6c6251;font-size:10.5px;padding:4px 8px;border-radius:999px}
.dialog-quick button:hover{border-color:#cdbfa6;color:var(--ink)}
.dialog-msg-list{padding:20px 22px}
.dialog-composer{border-top:1px solid var(--line-soft);background:#fffdf9;padding:10px 14px 12px}
.dialog-composer textarea{width:100%;min-height:42px;max-height:120px;resize:none;border:0;outline:0;background:transparent;font-size:13.5px;line-height:1.65;padding:2px}
.dialog-composer textarea::placeholder{color:#b1a58f}
.dialog-composer-bar{display:flex;align-items:center;gap:8px;margin-top:4px}
.dialog-composer-bar .hint{font-size:9.5px;color:#a2957d;margin-left:2px}
.dialog-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.dialog-status-chip{font-size:9.5px;color:#8d8069;border:1px solid var(--line-soft);background:#f7f1e5;padding:3px 8px;border-radius:999px;white-space:nowrap}
.dialog-status-chip.running{color:#6b5000;border-color:#e6c95c;background:#fbeaa8}
.dialog-status-chip.done{color:var(--green);border-color:#c6dccb;background:var(--green-soft)}
.dialog-status-chip.error{color:#a3452e;border-color:#e7c0b2;background:#f9e6df}
body.dialog-open{overflow:hidden}
.team-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line-soft);background:#fffdf9}
.team-head .avatar{width:34px;height:34px;font-size:17px}
.team-head h2{font-size:15px;margin:0;font-weight:600}
.team-head p{margin:1px 0 0;font-size:10.5px;color:#92866f}
.team-head .spacer{margin-left:auto}
.board{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-right:2px}
.board-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:15px}
.board-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:#a2957d;text-transform:uppercase;margin-bottom:8px}
.board-card h3{margin:0 0 8px;font-size:13px;font-weight:600}
.score{font-family:var(--serif);font-size:34px;line-height:1;font-weight:500}
.score span{font-size:12px;color:#9b8f79;font-family:var(--sans);margin-left:3px}
.bar{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin:10px 0 8px}

/* ---- 前往下拉 ---- */
.go-wrap{position:relative}
.go-pop{position:absolute;right:0;top:calc(100% + 9px);width:274px;padding:6px;background:var(--card);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 20px 46px rgba(29,27,22,.16);z-index:70;
  transform-origin:top right;transform:translateY(-10px) scaleY(.9);opacity:0;pointer-events:none;
  transition:transform .24s cubic-bezier(.32,.72,.28,1),opacity .18s ease}
.go-pop.open{transform:translateY(0) scaleY(1);opacity:1;pointer-events:auto}
.go-pop-item{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;background:none;border:0;
  border-radius:4px;text-align:left;cursor:pointer;transition:background .15s ease}
.go-pop-item[hidden]{display:none!important}
.go-pop-item:hover{background:#f8f2e5}
.go-pop-ic{width:30px;height:30px;flex:none;border-radius:4px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.go-pop-ic svg{width:16px;height:16px}
.go-pop-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.go-pop-copy b{font-size:12.5px;font-weight:600;color:var(--ink)}
.go-pop-copy small{font-size:10.5px;color:var(--sub)}
.go-pop-arrow{margin-left:auto;color:#bdb19a;font-size:12px}

/* ---- 工作台：三个板块 ---- */
.wb{position:absolute;inset:0;overflow:auto;padding:56px 30px 46px;background:var(--bg)}
.wb[hidden]{display:none}
.wb-inner{max-width:880px;margin:0 auto}
.wb-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:#a89a80;text-transform:uppercase}
.wb-title{font-size:25px;font-weight:600;letter-spacing:.01em;margin:9px 0 5px}
.wb-meta{font-size:11.5px;color:var(--sub);margin:0 0 26px}
.wb-boards{display:grid;gap:11px}
.wb-board{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:box-shadow .22s ease,border-color .22s ease}
.wb-board.open{border-color:#cfc2a9;box-shadow:0 14px 34px rgba(29,27,22,.08)}
.wb-board-head{width:100%;display:flex;align-items:center;gap:13px;padding:17px 19px;border:0;background:none;text-align:left;cursor:pointer}
.wb-board-head:hover .wb-board-name{color:var(--accent)}
.wb-board-ic{width:34px;height:34px;flex:none;border-radius:5px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.wb-board-ic svg{width:17px;height:17px}
.wb-board-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.wb-board-name{font-size:14.5px;font-weight:600;transition:color .15s ease}
.wb-board-desc{font-size:10.5px;color:var(--sub)}
.wb-board-arrow{margin-left:auto;font-size:12px;color:#bdb19a;transition:transform .26s cubic-bezier(.32,.72,.28,1)}
.wb-board.open .wb-board-arrow{transform:rotate(90deg);color:var(--accent)}
.wb-steps{max-height:0;overflow:hidden;transition:max-height .34s cubic-bezier(.32,.72,.28,1)}
.wb-board.open .wb-steps{max-height:520px}
.wb-step{width:100%;display:flex;align-items:center;gap:11px;padding:11px 19px 11px 66px;border:0;
  border-top:1px solid var(--line-soft);background:none;text-align:left;cursor:pointer;font-size:12.5px;color:var(--ink)}
.wb-step:hover{background:#faf4e8}
.wb-step i{font-family:var(--mono);font-style:normal;font-size:9.5px;color:#b9ac93;width:13px;flex:none}
.wb-step small{font-size:10.5px;color:var(--sub);margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-step .go{margin-left:auto;color:#c8bca4;font-size:11px;flex:none}

/* ---- 工作台内页 ---- */
.deck-stage{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.deck-stage[hidden]{display:none}
.stage-bar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 58px 0 12px;
  border-bottom:1px solid var(--line);background:rgba(255,253,248,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stage-back{width:27px;height:27px;flex:none;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:4px;background:#fff;color:var(--ink);font-size:13px;line-height:1;cursor:pointer;transition:.15s ease}
.stage-back:hover{border-color:#c9bda6;background:#fdfaf2}
.stage-title{font-size:12.5px;font-weight:600}
.stage-sub{font-size:11px;color:var(--sub)}
@media (max-width:760px){
  .go-pop{width:min(272px,calc(100vw - 28px))}
  .wb{padding:52px 14px 34px}
  .wb-title{font-size:21px}
  .wb-step{padding-left:56px}
  .wb-step small{display:none}
  .stage-bar{height:42px;padding:0 52px 0 8px}
  .stage-sub{display:none}
}

</style>
</head>

<script>const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ROLES = {
  linyi: { name: "林一", short: "林", title: "共事会流程组织教练", duty: "发起新开说、调度其他员工、回收结果", bg: "#f3dfd7", fg: "#9c3b26",
    starters: ["发起一场新的开说", "让阿图做海报和推文", "让云朵准备运营", "让麦田准备主持"] },
  poster: { name: "阿图", short: "图", title: "海报与推文设计", duty: "三套海报、公众号推文", bg: "#ece1c8", fg: "#8a631f",
    starters: ["按模板做三套海报", "接着写公众号推文", "换一版更克制的风格"] },
  ops: { name: "云朵", short: "云", title: "活动运营管家", duty: "群公告、报名、提醒与会后跟进", bg: "#dfe9df", fg: "#3d6a4f",
    starters: ["写一版群公告", "做报名和提醒排期", "把发布文案改得口语一点"] },
  host: { name: "麦田", short: "麦", title: "主持与现场导演", duty: "主持 PPT、逐字稿与现场清单", bg: "#dfe3ec", fg: "#405577",
    starters: ["做主持 PPT", "写开场和串场词", "列一份现场执行清单"] }
};
const AVATAR_SRC = {
  linyi: "assets/avatars/linyi.jpg",
  poster: "assets/avatars/poster.jpg",
  ops: "assets/avatars/ops.jpg",
  host: "assets/avatars/host.jpg"
};
const ROLE_KEYS = Object.keys(ROLES);
const VIEW_META = {
  home: { title: "办公室" },
  team: { title: "办公室" },
  projects: { title: "项目涌现" },
  knowledge: { title: "知识库" },
  settings: { title: "设置" }
};

const state = {
  view: "team", employee: "linyi", scope: null, mode: "task", dialog: null,
  studio: null, event: null, deliverables: [], knowledge: [], health: null,
  chat: { home: [], dm: { linyi: [], poster: [], ops: [], host: [] } },
  threads: { home: {}, dm: {} },
  busy: {}, homeRunning: false, producing: false, loaded: false, error: "", profile: {},
  intakeRaw: "", intakeDraft: null, completion: {}, wizard: null,
  dialogLarge: false, dialogSize: null,
  connecting: false, connectError: "", autostart: false,
  projects: { projects: [], selectedProjectId: "", selectedQuestionId: "" },
  projectId: "", projectQuestionId: "", projectBusy: false, projectSaveTimer: null
};

const LOCAL_BASE = location.protocol === "file:" ? "http://127.0.0.1:8787" : "";

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v) => esc(v).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
const uid = () => Math.random().toString(36).slice(2, 9);
const nowTime = () => new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const profileOf = (k) => (state && state.profile && state.profile[k]) || {};
const roleOf = (k) => {
  const base = ROLES[k] || ROLES.linyi;
  const p = profileOf(k);
  return Object.assign({}, base, { title: p.title || base.title, duty: p.duty || base.duty });
};
function avatarSrcOf(k){ const p = profileOf(k); return p.avatar || AVATAR_SRC[k] || AVATAR_SRC.linyi; }
const workshopHref = (eventId) => "开说工作台.html?board=workshop" + (eventId ? "&event=" + encodeURIComponent(eventId) : "");
const GO_ICONS = {
  workshop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.8 20c0-3.2 2.8-5.2 6.2-5.2s6.2 2 6.2 5.2"></path><path d="M16.5 6.2a3 3 0 0 1 0 5.8"></path><path d="M18 14.4c2.2.6 3.6 2.2 3.6 4.4"></path></svg>',
  ops: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l8 4V5L7 9H5a1 1 0 0 0-1 1Z"></path><path d="M18 8.5a5 5 0 0 1 0 7"></path><path d="M7 15v4a1.5 1.5 0 0 0 3 0v-2.8"></path></svg>',
  host: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path><path d="M12 17.5V21"></path><path d="M8.5 21h7"></path></svg>',
};
const WORKBENCHES = [
  { id: "workshop", name: "共事会", full: "开说共事会", file: "开说共事会.html", desc: "流程、内容孵化、档案库" },
  { id: "ops", name: "云管家", full: "开说云管家", file: "开说运营管理系统.html", desc: "群公告、报名、运营节奏" },
  { id: "host", name: "主持", full: "开说主持", file: "开说现场主持.html", desc: "主持 PPT、逐字稿、现场清单" }
];
const EMBEDDED_PAGES = (() => {
  try {
    const node = document.getElementById("ks-pages");
    return node ? JSON.parse(node.textContent || "{}") : {};
  } catch (err) { return {}; }
})();
const deckState = { current: "" };

function avatarHTML(who, extraClass) {
  const key = ROLES[who] ? who : "linyi";
  const role = roleOf(key);
  return '<span class="avatar ' + (extraClass || "") + '" style="background:' + role.bg + '">' +
    '<img src="' + esc(avatarSrcOf(key)) + '" alt="' + esc(role.name) + '"></span>';
}

function toast(message) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2400);
}
function showModal(title, body, foot, wide) {
  $("#modalTitle").textContent = title || "";

function openGo(event) {
  const pop = $("#goPop");
  if (!pop) return;
  pop.classList.toggle("open");
  if (event) event.stopPropagation();
}
function closeGo() {
  const pop = $("#goPop");
  if (pop) pop.classList.remove("open");
}
document.addEventListener("click", (event) => {
  const pop = $("#goPop");
  if (!pop || !pop.classList.contains("open")) return;
  if (pop.contains(event.target)) return;
  if (event.target.closest && event.target.closest("#goBtn")) return;
  closeGo();
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeGo(); });

function workbenchURL(opts) {
  const extra = opts || {};
  const params = new URLSearchParams();
  if (extra.board) params.set("board", extra.board);
  if (extra.step) params.set("step", extra.step);
  if (extra.ai) params.set("ai", "1");
  if (state.event && state.event.id) params.set("event", state.event.id);
  const query = params.toString();
  return "开说工作台.html" + (query ? "?" + query : "");
}

function openWorkbenchPage(opts) {
  const url = workbenchURL(opts);
  let win = null;
  try { win = window.open(url, "_blank"); } catch (err) { win = null; }
  if (win) { try { win.opener = null; } catch (err) {} return; }
  location.href = url;
}

function openWorkbench() {
  closeGo();
  openWorkbenchPage();
}

function enterBoard(id, step, label) {
  const item = WORKBENCHES.find((entry) => entry.id === id) || WORKBENCHES[0];
  $("#wbHome").hidden = true;
  $("#deckStage").hidden = false;
  const stageTitleEl = $("#stageTitle");

  const stageSubEl = $("#stageSub");
  if (stageSubEl) stageSubEl.textContent = label || item.desc || "";
  switchDeck(id);

      const frame = document.querySelector('#deckBody iframe[data-deck="' + id + '"]');
      try { if (frame && frame.contentWindow) frame.contentWindow.postMessage({ type: "kaishuo:step", step }, location.origin); } catch (err) {}
    };
    setTimeout(send, 300);
    setTimeout(send, 1300);
  }
}

function deckSrc(item) {
  const params = new URLSearchParams({ embed: "1" });
  if (state.event && state.event.id) params.set("event", state.event.id);
  return item.file + "?" + params.toString();
}

function b64utf8(value) {
  const bin = atob(value);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function deckDoc(item) {
  const packed = EMBEDDED_PAGES[item.id];
  if (!packed) return "";
  const params = new URLSearchParams({ embed: "1" });
  if (state.event && state.event.id) params.set("event", state.event.id);
  let html = "";
  try { html = b64utf8(packed); } catch (err) { return ""; }
  const base = location.protocol === "file:" ? '<base href="http://127.0.0.1:8787/">' : "";
  const boot = base + "<script>window.__KQ__=" + JSON.stringify("?" + params.toString()) +
    ";window.__KQ_PROTO__=" + JSON.stringify(location.protocol === "file:" ? "http:" : location.protocol) +
    ";window.__KQ_BASE__=" + JSON.stringify(location.protocol === "file:" ? "http://127.0.0.1:8787/" : location.origin + "/") +
    ";</" + "script>";
  return html.replace(/<head([^>]*)>/i, "<head$1>" + boot);
}

function mountDeck(frame, item, want) {
  const doc = deckDoc(item);
  if (doc) {
    frame.removeAttribute("src");
    frame.srcdoc = doc;
  } else {
    frame.removeAttribute("srcdoc");
    frame.src = want;
  }
}

function switchDeck(id) {
  const item = WORKBENCHES.find((entry) => entry.id === id) || WORKBENCHES[0];
  deckState.current = item.id;
  const home = $("#wbHome");
  const stage = $("#deckStage");
  if (home) home.hidden = true;
  if (stage) stage.hidden = false;
  const stageTitle = $("#stageTitle");
  if (stageTitle) stageTitle.textContent = item.full;
  const body = $("#deckBody");
  const want = deckSrc(item);
  let frame = body.querySelector('iframe[data-deck="' + item.id + '"]');
  if (!frame) {
    frame = document.createElement("iframe");
    frame.dataset.deck = item.id;
    frame.dataset.src = want;
    frame.className = "deck-frame";
    frame.title = item.full;
    frame.setAttribute("allow", "fullscreen; autoplay");
    frame.allowFullscreen = true;
    mountDeck(frame, item, want);
    body.appendChild(frame);
  } else if (frame.dataset.src !== want) {
    frame.dataset.src = want;
    mountDeck(frame, item, want);
  }
  $$("#deckBody iframe").forEach((node) => { node.hidden = node.dataset.deck !== item.id; });
  setTimeout(() => {
    try { frame.contentWindow.postMessage({ type: "kaishuo:refresh" }, location.origin); } catch (err) {}
  }, 80);
}

async function closeDeck() {
  $("#deck").hidden = true;
  document.body.classList.remove("deck-open");
  deckState.current = "";
  closeGo();
  const stage = $("#deckStage");
  if (stage) stage.hidden = true;
  try {
    const studio = await api("/api/data/studio");
    state.studio = studio.data;
    state.event = currentEvent();
    render();
  } catch (err) {}
}

async function api(path, options = {}) {
  const opts = Object.assign({}, options);
  opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("请求失败：" + res.status));
  return data;
}

function storageKey() { return "ks_simple_v2:" + ((state.event && state.event.id) || "_global"); }

const PROFILE_KEY = "ks_profile_v1";
function applyProfileStore(src) {
  if (!src || typeof src !== "object") return;
  for (const key of ROLE_KEYS) {
    const item = src[key];
    if (!item || typeof item !== "object") continue;
    state.profile[key] = {
      status: typeof item.status === "string" ? item.status : "",
      title: typeof item.title === "string" ? item.title : "",
      duty: typeof item.duty === "string" ? item.duty : "",
      avatar: typeof item.avatar === "string" ? item.avatar : ""
    };
  }
}
function loadUI() {
  state.chat = { home: [], dm: { linyi: [], poster: [], ops: [], host: [] } };
  state.threads = { home: {}, dm: {} };
  state.completion = {};
  state.wizard = null;
  state.mode = "task";
  let profileStored = false;
  try {
    const profRaw = localStorage.getItem(PROFILE_KEY);
    if (profRaw) { applyProfileStore(JSON.parse(profRaw)); profileStored = true; }
  } catch (err) {}
  try {
    const raw = localStorage.getItem(storageKey());
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (Array.isArray(saved.chat && saved.chat.home)) state.chat.home = saved.chat.home;
    if (saved.chat && saved.chat.dm) {
      for (const key of ROLE_KEYS) if (Array.isArray(saved.chat.dm[key])) state.chat.dm[key] = saved.chat.dm[key];
    }
    if (saved.threads) {
      state.threads.home = saved.threads.home || {};
      state.threads.dm = saved.threads.dm || {};
    }
    if (saved.mode === "chat" || saved.mode === "task") state.mode = saved.mode;
    if (!profileStored && saved.profile) applyProfileStore(saved.profile);
    if (saved.employee && ROLES[saved.employee]) state.employee = saved.employee;
    if (saved.view && VIEW_META[saved.view]) {
      state.view = saved.view === "home" || saved.view === "knowledge" ? "team" : saved.view;
    }
    if (saved.projectId && typeof saved.projectId === "string") state.projectId = saved.projectId;
    if (saved.projectQuestionId && typeof saved.projectQuestionId === "string") state.projectQuestionId = saved.projectQuestionId;
    if (saved.dialogLarge) state.dialogLarge = true;
    if (saved.dialogSize && Number(saved.dialogSize.width) > 0 && Number(saved.dialogSize.height) > 0) {
      state.dialogSize = { width: Number(saved.dialogSize.width), height: Number(saved.dialogSize.height) };
    }
    if (saved.completion && typeof saved.completion === "object") {
      for (const key of ROLE_KEYS) {
        const item = saved.completion[key];
        if (item && item.at) state.completion[key] = { ok: item.ok !== false, at: String(item.at) };
      }
    }
    if (saved.wizard && saved.wizard.kind === "new-event" && saved.wizard.data) {
      saved.wizard.creating = false;
      state.wizard = saved.wizard;
    }
  } catch (err) {}
}
function saveUI() {
  try {
    const cut = (list) => (list || []).slice(-80);
    const dm = {};
    for (const key of ROLE_KEYS) dm[key] = cut(state.chat.dm[key]);
    localStorage.setItem(storageKey(), JSON.stringify({
      view: state.view, employee: state.employee, mode: state.mode,
      dialogLarge: state.dialogLarge, dialogSize: state.dialogSize,
      projectId: state.projectId, projectQuestionId: state.projectQuestionId,
      chat: { home: cut(state.chat.home), dm }, threads: state.threads, completion: state.completion, wizard: state.wizard
    }));
    localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile));
  } catch (err) {}
}

let aiSyncTimer = null;

function aiErrorText(raw) {
  const text = String(raw || "");
  if (/CODEX_API_KEY|not set/i.test(text)) return "生图密钥还没配置";
  if (/HTTP 5\d\d|network error|timeout/i.test(text)) return "作图接口刚才不稳，再试一次通常就好";
  return text.replace(/^error:\s*/i, "") || "未知错误";
}
function aiJobMessage(job) {
  const imgs = (job.images || []).map((im) => ({ url: im.url, v: job.updatedAt }));
  const at = new Date(job.updatedAt || job.createdAt || Date.now());
  const time = at.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  let text = "";
  if (job.status === "queued") text = "接到 " + job.name + " 的生图任务，正在排队。你可以关掉窗口，我跑完会留在这里。";
  else if (job.status === "running") text = "正在给 " + job.name + " 画人物主视觉…";
  else if (job.status === "done") text = job.name + " 的主视觉好了，共 " + imgs.length + " 张。点图可以看大图。";
  else text = job.name + " 这张没画成：" + aiErrorText(job.error);
  return { kind: "agent", who: "poster", text: text, images: imgs, time: time, jobId: job.id, aiStatus: job.status };
}

async function syncAiJobs() {
  const eventId = (state.event && state.event.id) || "current";
  let jobs = [];
  try {
    const res = await fetch("/api/ai-image/jobs?eventId=" + encodeURIComponent(eventId) + "&limit=20");
    if (!res.ok) return;
    const data = await res.json();
    jobs = data.jobs || [];
  } catch (err) { return; }
  const list = state.chat.dm.poster;
  if (!Array.isArray(list)) return;
  let changed = false;
  for (const job of jobs) {
    const next = aiJobMessage(job);
    const idx = list.findIndex((m) => m && m.jobId === job.id);
    if (idx >= 0) {
      const cur = list[idx];
      if (cur.aiStatus !== job.status || (cur.images || []).length !== next.images.length || cur.time !== next.time || cur.text !== next.text) {
        list[idx] = Object.assign({}, cur, next);
        changed = true;
      }
    } else {
      list.push(next);
      changed = true;
    }
  }
  if (changed) {
    saveUI();
    if (state.dialog === "poster") paintMessages("dm", "poster");
  }
  const active = jobs.some((j) => j.status === "queued" || j.status === "running");
  if (aiSyncTimer) { clearTimeout(aiSyncTimer); aiSyncTimer = null; }
  if (active) aiSyncTimer = setTimeout(syncAiJobs, 3000);
}

function stepHTML(step) {
  const cls = step.kind === "err" ? "step err" : "step";

function msgHTML(m) {
  if (m.kind === "system") return '<div class="msg-system">' + esc(m.text) + "</div>";
  if (m.kind === "user") {
    const ui = Array.isArray(m.images) ? m.images : [];
    const uiBox = ui.length
      ? '<div class="msg-imgs">' + ui.map((im) => '<a href="' + esc(im.url || "#") + '" target="_blank" rel="noopener"><img src="' + esc(im.url || "") + '" alt=""></a>').join("") + "</div>"
      : "";
    const bubble = String(m.text || "").trim() ? '<div class="bubble">' + fmt(m.text) + "</div>" : "";
    return '<div class="msg-user"><div class="user-stack">' + bubble + uiBox + "</div></div>";
  }
  if (m.kind === "link") {
    return '<div class="msg-linkcard"><b>' + esc(m.title || "已经好了") + '</b><p>' + fmt(m.text || "") +
      '</p><a class="btn primary small" href="' + esc(m.href || "#") + '" target="_blank" rel="noopener">' +
      esc(m.label || "打开") + "</a></div>";
  }
  if (m.kind === "actions") {
    const buttons = (m.actions || []).map((action, index) =>
      '<button class="btn small" onclick="runLinyiCommand(\'' + esc(action.cmd || "") + '\',\'' + esc(m.scope || "dm") + '\')">' + esc(action.label || "继续") + "</button>"
    ).join("");
    return '<div class="msg-actions-card"><div>' + fmt(m.text || "") + '</div><div class="row-actions">' + buttons + "</div></div>";
  }
  const role = roleOf(m.who);
  const steps = (m.steps || []).filter(Boolean);
  const stepsBox = steps.length
    ? '<details class="steps"><summary>执行记录 · ' + steps.length + ' 步</summary>' + steps.map(stepHTML).join("") + "</details>"
    : "";
  const links = (m.links || []).map((link) => '<a href="' + esc(link.url || "#") + '" target="_blank" rel="noopener">' + esc(link.name || "打开文件") + "</a>").join("");
  const linksBox = links ? '<div class="msg-files">' + links + "</div>" : "";
  const imgs = Array.isArray(m.images) ? m.images : [];
  const imgsBox = imgs.length
    ? '<div class="msg-imgs">' + imgs.map((im) => '<a href="' + esc(im.url || "#") + '" target="_blank" rel="noopener"><img src="' + esc(im.url || "") + "?v=" + esc(String(im.v || "")) + '" alt=""></a>').join("") + "</div>"
    : "";
  const rawText = String(m.text || "").trim();
  const pendingPlaceholder = /^正在处理[….\.]*$/.test(rawText);
  const hasText = Boolean(rawText) && !(m.pending && pendingPlaceholder);
  const text = hasText ? fmt(rawText) : (m.pending ? "" : '<span class="hint">已完成。</span>');
  return '<div class="msg-agent">' + avatarHTML(m.who) +
    '<div><div class="agent-head"><span class="agent-name">' + role.name + '</span><span class="agent-role">' + role.title +
    '</span><span class="agent-time">' + esc(m.time || "") + "</span></div>" +
    (text ? '<div class="agent-body">' + text + "</div>" : "") + imgsBox + linksBox + stepsBox + "</div></div>";
}
function typingHTML(scope, target) {
  let who = [];
  if (scope === "home") {
    if (state.homeRunning) who = ROLE_KEYS.filter((k) => state.busy[k] && state.busy[k].scope === "home");
  } else {
    const key = target || state.employee;
    if (state.busy[key] && state.busy[key].scope === "dm") who = [key];
  }
  if (!who.length) return "";
  const label = who.map((k) => roleOf(k).name).join("、") + " 正在处理";
  return '<div class="typing"><i></i><i></i><i></i><span>' + label + "…</span></div>";
}
function paintMessages(scope, who) {
  let list = null;
  const target = who || state.employee;
  if (scope === "home") {
    list = $("#msgList");
  } else {
    if (state.dialog !== target) return;
    list = $("#dmList");
  }
  if (!list) return;
  const msgs = messagesFor(scope, target);
  const html = msgs.map(msgHTML).join("") + typingHTML(scope, target);
  list.innerHTML = html || emptyChatHTML(scope);
  list.scrollTop = list.scrollHeight;
}

function employeeStatus(who) {
  const busy = state.busy[who];
  if (busy) return { tone: "running", card: "工作中", detail: busy.label || "正在处理…" };
  const manual = profileOf(who).status || "";
  if (manual === "工作中") return { tone: "running", card: "工作中", detail: "手动标记" };
  if (manual === "完成") return { tone: "done", card: "完成", detail: "手动标记" };
  if (manual === "请假") return { tone: "away", card: "请假", detail: "手动标记" };
  if (manual === "空闲") return { tone: "idle", card: "空闲", detail: "手动标记" };
  const done = state.completion[who];
  if (done && done.at) {
    return done.ok === false
      ? { tone: "error", card: "出错 · " + done.at, detail: "上次任务中断 · " + done.at }
      : { tone: "done", card: "完成 · " + done.at, detail: "已完成 · " + done.at };
  }
  return { tone: "idle", card: "空闲", detail: "空闲" };
}

function updateBusy() {
  ROLE_KEYS.forEach((key) => {
    const info = employeeStatus(key);
    const card = $('.employee-card[data-emp="' + key + '"]');
    if (!card) return;
    card.dataset.status = info.tone;
    const dot = $(".emp-status-dot", card);
    if (dot) dot.className = "emp-status-dot " + info.tone;
    const text = $("[data-emp-status]", card);
    if (text) text.textContent = info.card;
  });
  if (state.dialog) {
    const info = employeeStatus(state.dialog);
    const status = $("#dialogStatus");
    if (status) {
      status.textContent = info.tone === "running" ? "工作中" : info.detail;
      status.title = info.detail;
      status.className = "dialog-status-chip " + info.tone;
    }
    const send = $("#dmSend");
    if (send) send.disabled = info.tone === "running";
    const hint = $("#dialogHint");
    if (hint) hint.textContent = info.tone === "running" ? "任务在后台继续，关掉窗口也可以" : "Enter 发送 · Shift+Enter 换行";
  }
}

async function runRole(scope, who, prompt, mode, storeWho, attachments) {
  const store = storeWho || who;
  if (state.busy[who]) throw new Error(roleOf(who).name + " 手上还有一个任务，等它完成再继续。");
  const msg = { id: uid(), kind: "agent", who, text: "", time: nowTime(), steps: [], pending: true, ok: true };
  delete state.completion[who];
  state.busy[who] = { scope, label: "正在处理…" };
  saveUI();
  pushMsg(scope, msg, store);
  updateBusy();
  try {
    const res = await fetch("/api/codex/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        role: who, mode: mode || state.mode, prompt,
        threadId: (state.threads[scope] && state.threads[scope][who]) || "",
        images: (attachments || []).map((item) => (item && item.path) || "").filter(Boolean)
      })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || ("执行失败：" + res.status));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        if (!line.trim()) continue;
        let ev; try { ev = JSON.parse(line); } catch { continue; }
        if (ev.type === "session" && ev.threadId) {
          state.threads[scope] = state.threads[scope] || {};
          state.threads[scope][who] = ev.threadId;
          saveUI();
        } else if (ev.type === "queued" || ev.type === "status") {
          state.busy[who].label = ev.message || "正在处理…";
          updateBusy();
        } else if (ev.type === "message" && ev.text) {
          msg.text = String(ev.text);
          msg.pending = false;
          schedulePaint(scope, store);
        } else if (ev.type === "command" && ev.command) {
          msg.steps.push({ kind: "cmd", text: String(ev.command).replace(/\s+/g, " ").slice(0, 180) });
          schedulePaint(scope, store);
        } else if (ev.type === "file_change") {
          const changes = ev.changes || [];
          for (const change of changes) {
            const p = typeof change === "string" ? change : (change.path || change.file || "");
            if (p) msg.steps.push({ kind: "file", text: "写入 " + p });
          }
          schedulePaint(scope, store);
        } else if (ev.type === "error") {
          msg.ok = false;
          msg.steps.push({ kind: "err", text: ev.message || "执行出错" });
          schedulePaint(scope, store);
        } else if (ev.type === "done") {
          if (Array.isArray(ev.images) && ev.images.length) msg.images = ev.images;
          msg.pending = false;
          if (ev.threadId) {
            state.threads[scope] = state.threads[scope] || {};
            state.threads[scope][who] = ev.threadId;
          }
          if (!msg.text) msg.text = "完成了，这次没有额外的文字说明。";
          schedulePaint(scope, store);
        }
      }
    }
  } catch (err) {
    msg.ok = false;
    msg.pending = false;
    msg.text = msg.text || ("执行中断：" + err.message);
    msg.steps.push({ kind: "err", text: err.message });
  } finally {
    delete state.busy[who];
    msg.pending = false;
    msg.finishedAt = nowTime();
    state.completion[who] = { ok: msg.ok !== false, at: msg.finishedAt };
    saveUI();
    paintMessages(scope, store);
    updateBusy();
    if (scope === "dm" && state.dialog !== store) {
      toast(roleOf(who).name + (msg.ok === false ? " 执行中断" : " 已完成"));
    }
  }
  return msg;
}

function cnNumber(value) {
  const text = String(value == null ? "" : value).trim();
  if (/^\d+$/.test(text)) return Number(text);
  const map = { 零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  if (text === "十") return 10;
  if (text.includes("十")) {
    const parts = text.split("十");
    return (parts[0] ? (map[parts[0]] || 0) : 1) * 10 + (parts[1] ? (map[parts[1]] || 0) : 0);
  }
  return Object.prototype.hasOwnProperty.call(map, text) ? map[text] : NaN;
}

function parseSpeakerNames(text) {
  const raw = String(text || "")
    .replace(/^(?:这场|活动|开说)?的?(?:演说者|分享者|嘉宾)?(?:分别|一共)?(?:是|有|为|包括)?/, "")
    .replace(/还有|以及|和|与/g, "、")
    .replace(/[，,；;\/]/g, "、")
    .replace(/\s+/g, "、");
  const stop = /^(我们|大家|就|一共|两位|三位|四位|几位|个人|人|这场|开说|演说者|分享者|嘉宾)$/;
  return raw.split("、").map((item) => item
    .replace(/^[：:\s]+|[。.!！?？\s]+$/g, "")
    .replace(/^\d+[.、]?\s*/, "")
    .replace(/^(?:有|是|请|帮我)/, "")
    .replace(/(?:两位|三位|四位|几位|[位个名])$/, "")
    .trim())
    .filter((item) => item && item.length <= 20 && !stop.test(item))
    .slice(0, 8);
}

function parseEventWhen(text) {
  const raw = String(text || "");
  let date = "";
  let match = raw.match(/(\d{4})[年./-](\d{1,2})[月./-](\d{1,2})/);
  if (match) date = Number(match[2]) + "月" + Number(match[3]) + "日";
  if (!date) {
    match = raw.match(/(\d{1,2}|[一二三四五六七八九十]+)月(\d{1,2}|[一二三四五六七八九十]+)[日号]?/);
    if (match) date = cnNumber(match[1]) + "月" + cnNumber(match[2]) + "日";
  }
  if (!date) {
    const weekday = raw.match(/周[一二三四五六日天]/);
    if (weekday) date = weekday[0];
  }
  if (!date) {
    let offset = null;
    if (/后天/.test(raw)) offset = 2;
    else if (/明天|明晚/.test(raw)) offset = 1;
    else if (/今天|今晚/.test(raw)) offset = 0;
    if (offset !== null) {
      const day = new Date();
      day.setDate(day.getDate() + offset);
      date = (day.getMonth() + 1) + "月" + day.getDate() + "日";
    }
  }
  let time = "";
  const tm = raw.match(/(\d{1,2}|[一二三四五六七八九十两]+)[点:：](\d{1,2}|[一二三四五六七八九十两]+)?(?:分)?/);
  if (tm) {
    let hour = cnNumber(tm[1]);
    let minute = tm[2] ? cnNumber(tm[2]) : 0;
    if (/半/.test(raw) && !tm[2]) minute = 30;
    if (/下午|晚上|晚/.test(raw) && hour < 12) hour += 12;
    if (hour === 24) hour = 0;
    if (!Number.isNaN(hour)) {
      if (Number.isNaN(minute)) minute = 0;
      time = String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0");
    }
  }
  return { date, time };
}

function parseMeeting(text) {
  const raw = String(text || "");
  const link = (raw.match(/https?:\/\/[^\s，。；;]+/) || [])[0] || "";
  const numberMatch = raw.match(/\d[\d\s-]{6,}\d/);
  const meetingNo = numberMatch ? numberMatch[0].replace(/\D/g, "") : "";
  const notBooked = /还没|还没有|没有订|没订|未订|没定|未定|未预约|没预约|还没好/.test(raw);
  const saidYes = /订好|预定好|预订好|约好|有了|可以|已经/.test(raw);
  return {
    meetingBooked: !notBooked && (Boolean(link) || meetingNo.length >= 6 || saidYes),
    meetingNo, meetingLink: link, meetingRaw: raw
  };
}

async function advanceNewEventWizard(text, scope) {
  const wizard = state.wizard;
  if (!wizard || wizard.kind !== "new-event") return false;
  if (/^(取消|算了|先不|不建了|暂停)/.test(text)) {
    state.wizard = null;
    saveUI();
    linyiSay("好，这场先不建。需要的时候再跟我说「发起一场新的开说」。", null, scope);
    return true;
  }
  if (wizard.step === "speakers") {
    const names = parseSpeakerNames(text);
    if (!names.length) {
      linyiSay("我没听清名字。直接发我姓名就行，多位用「、」隔开，比如「小周、阿宁」。", null, scope);
      return true;
    }
    wizard.data.speakers = names;
    wizard.step = "time";
    saveUI();
    linyiSay("好，收到：" + names.join("、") + "。这场什么时候开始？日期和时间一起给我就行，比如「11月2日晚上8点」。", null, scope);
    return true;
  }
  if (wizard.step === "time") {
    const parsed = parseEventWhen(text);
    if (parsed.date) wizard.data.dateText = parsed.date;
    if (parsed.time) wizard.data.time = parsed.time;
    if (/待定|还没定|没定|不确定/.test(text)) {
      if (!wizard.data.dateText) wizard.data.dateText = "待定";
      if (!wizard.data.time) wizard.data.time = "待定";
    }
    if (!wizard.data.dateText) {
      linyiSay("日期我没听清。具体是哪一天？比如「11月2日」。", null, scope);
      return true;
    }
    if (!wizard.data.time) {
      linyiSay("日期收到：" + wizard.data.dateText + "。几点开始？", null, scope);
      return true;
    }
    wizard.step = "meeting";
    saveUI();
    linyiSay("时间记下了：" + wizard.data.dateText + " " + wizard.data.time + "。腾讯会议订好了吗？有会议号或链接就发我；还没有就回「还没订」。", null, scope);
    return true;
  }
  if (wizard.step === "meeting") {
    Object.assign(wizard.data, parseMeeting(text));
    wizard.step = "confirm";
    saveUI();
    linyiSay(wizardSummary(wizard), null, scope);
    return true;
  }
  if (wizard.step === "confirm") {
    if (/改.{0,4}(人|演说者|分享者)/.test(text)) {
      wizard.step = "speakers";
      saveUI();
      linyiSay("可以，重新告诉我这场有哪几位演说者。", null, scope);
      return true;
    }
    if (/改.{0,4}(时间|日期|几点)/.test(text)) {
      wizard.step = "time";
      saveUI();
      linyiSay("可以，新的日期和时间是什么？", null, scope);
      return true;
    }
    if (/改.{0,4}(会议|会议号|链接)/.test(text)) {
      wizard.step = "meeting";
      saveUI();
      linyiSay("可以，把新的会议号或链接发我；还没订就回「还没订」。", null, scope);
      return true;
    }
    if (/确认|可以|没问题|对的|^对$|^好$|建吧|开始|重试|再试/.test(text)) {
      await createEventFromWizard(wizard, scope);
      return true;
    }
    linyiSay("回复「确认」我就建好共事会；要改就说「改人」「改时间」或「改会议」。", null, scope);
    return true;
  }
  return false;
}

function parseDispatchIntent(text) {
  const raw = String(text || "").trim();
  if (!raw) return null;
  const asking = /为什么|怎么|如何|什么|是否|能不能|可不可以|要不要|需不需要|该不该/.test(raw);
  const direct = /(让|叫|安排|请|帮我|给我|直接|马上|现在)/.test(raw);
  if (asking && !direct) return null;
  if (/[？?]$/.test(raw) && !direct) return null;
  const action = /做|生成|准备|安排|开始|出|写|继续|帮我|让|叫|去|推进/.test(raw);
  if (!action) return null;
  const all = /全部|整套|三件套|都安排|剩下的|一起安排|全流程/.test(raw);
  const poster = /海报/.test(raw);
  const article = /推文|公众号/.test(raw);
  const ops = /运营|云管家|云朵|群公告|报名/.test(raw);
  const host = /主持|麦田|串场|ppt/i.test(raw);
  if (all) return "all";
  if (poster && article) return "poster-article";
  if (poster) return "poster";
  if (article) return "article";
  if (ops) return "ops";
  if (host) return "host";
  return null;
}

  const plans = {
    poster: "@阿图，先做三套海报。",
    "poster-article": "@阿图，先做三套海报，完成后接着写公众号推文。",
    article: "@阿图，接着把公众号推文写出来。",
    ops: "@云朵，把运营工作台补好。",
    host: "@麦田，把主持包准备好。",
    all: "我按顺序来：@阿图 做海报和推文，@云朵 准备运营，@麦田 准备主持。"
  };
  linyiSay(plans[kind] || "好，我来安排。", null, scope);
  delete state.completion.linyi;
  state.busy.linyi = { scope: "dm", label: "正在调度团队…" };
  saveUI();
  updateBusy();
  const results = [];
  try {
    if (kind === "poster" || kind === "poster-article" || kind === "all") {
      results.push(await runProductionFor("poster", "poster", "海报", scope));
    }
    if (kind === "article" || kind === "poster-article" || kind === "all") {
      const posterStep = results.find((item) => item.kind === "poster");
      if (kind === "article" || !posterStep || posterStep.ok) {
        results.push(await runArticleForPoster(scope));
      } else {
        results.push({ kind: "article", label: "推文", ok: false, error: "海报未完成，推文先跳过" });
      }
    }
    if (kind === "ops" || kind === "all") results.push(await runProductionFor("ops", "ops", "运营包", scope));
    if (kind === "host" || kind === "all") results.push(await runProductionFor("host", "host", "主持包", scope));
  } finally {
    const ok = results.every((item) => item.ok);
    delete state.busy.linyi;
    state.completion.linyi = { ok, at: nowTime() };
    if (state.event && state.event.stages) {
      if (results.some((item) => item.kind === "poster" && item.ok)) state.event.stages.poster = "done";
      if (results.some((item) => item.kind === "ops" && item.ok)) state.event.stages.ops = "done";
      if (results.some((item) => item.kind === "host" && item.ok)) state.event.stages.host = "done";
      state.event.updatedAt = new Date().toISOString();
      api("/api/data/studio", { method: "PUT", body: JSON.stringify({ data: state.studio }) }).catch(() => {});
    }
    saveUI();
    updateBusy();
    const done = results.filter((item) => item.ok).map((item) => item.label);
    const failed = results.filter((item) => !item.ok);
    let summary = done.length ? "这一轮完成了：" + done.join("、") + "。" : "这一轮没有产出。";
    if (failed.length) summary += " 没完成：" + failed.map((item) => item.label + (item.error ? "（" + item.error + "）" : "")).join("、") + "。";
    linyiSay(summary, null, scope);
    const finishedKinds = new Set(results.filter((item) => item.ok).map((item) => item.kind));
    const actions = [];
    if (!finishedKinds.has("poster")) actions.push({ label: "让阿图做海报", cmd: "poster" });
    if (!finishedKinds.has("article")) actions.push({ label: "让阿图写推文", cmd: "article" });
    if (!finishedKinds.has("ops")) actions.push({ label: "让云朵准备运营", cmd: "ops" });
    if (!finishedKinds.has("host")) actions.push({ label: "让麦田准备主持", cmd: "host" });
    if (actions.length) pushMsg(scope, { id: uid(), kind: "actions", scope, text: "下一步我可以继续安排：", actions: actions.slice(0, 3), time: nowTime() }, "linyi");
  }
}

async function runProductionFor(who, only, label, scope) {
  scope = scope || "dm";
  if (state.busy[who]) {
    linyiSay(roleOf(who).name + " 手上还有一个任务，这一步先跳过。", null, scope);
    return { kind: only, label, ok: false, error: "正在忙" };
  }
  delete state.completion[who];
  state.busy[who] = { scope, label: "正在生成" + label + "…" };
  saveUI();
  updateBusy();
  const msg = { id: uid(), kind: "agent", who, text: "", time: nowTime(), steps: [], pending: true, ok: true };
  pushMsg(scope, msg, "linyi");
  try {
    const res = await fetch("/api/produce", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ eventId: state.event ? state.event.id : "", only })
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "生成失败");
    await readStream(res, (event) => {
      if (event.type === "status") {
        state.busy[who].label = event.message || ("正在生成" + label + "…");
        msg.steps.push({ kind: "cmd", text: event.message || "处理中" });
        updateBusy();
        schedulePaint(scope, "linyi");
      } else if (event.type === "done") {
        const files = event.files || [];
        state.deliverables = event.allFiles || (files.length ? files : state.deliverables);
        msg.links = files.slice(0, 6).map((file) => ({ name: file.name, url: file.url }));
        msg.text = label + "完成" + (files.length ? "，共 " + files.length + " 个文件。" : "。");
      } else if (event.type === "error") {
        throw new Error(event.message || (label + "生成失败"));
      }
    });
    msg.pending = false;
    if (!msg.text) msg.text = label + "完成。";
  } catch (err) {
    msg.ok = false;
    msg.pending = false;
    msg.text = label + "没有完成：" + err.message;
    msg.steps.push({ kind: "err", text: err.message });
  } finally {
    delete state.busy[who];
    msg.pending = false;
    msg.finishedAt = nowTime();
    state.completion[who] = { ok: msg.ok !== false, at: msg.finishedAt };
    saveUI();
    paintMessages(scope, scope === "home" ? null : "linyi");
    updateBusy();
  }
  return { kind: only, label, ok: msg.ok !== false, msg };
}

function completeness(event) {
  if (!event) return { score: 0, missing: [] };
  const checks = [
    ["活动名称", event.name], ["活动主题", event.theme], ["活动日期", event.date], ["开始时间", event.time],
    ["活动形式", event.form], ["主持人", event.host], ["目标受众", event.audience], ["活动目标", event.goal],
    ["腾讯会议号", event.meetingNo], ["分享者", (event.speakers || []).filter((s) => s.name && s.title).length]
  ];
  const missing = checks.filter(([, v]) => !v).map(([k]) => k);
  return { score: Math.round(((checks.length - missing.length) / checks.length) * 100), missing };
}

function speakerMissing(sp) {
  sp = sp || {};
  const missing = [];
  if (!String(sp.name || "").trim()) missing.push("称呼");
  if (!String(sp.title || "").trim()) missing.push("开说标题");
  if (!String(sp.intro || sp.identity || "").trim()) missing.push("一句话简介");
  if (!String(sp.story || "").trim()) missing.push("核心故事");
  if (!String(sp.takeaway || "").trim()) missing.push("听众收获");
  if (!String(sp.photo || "").trim()) missing.push(sp.photoStatus === "received" ? "照片归档" : "照片");
  if ((sp.photoConsent || "") !== "confirmed") missing.push("照片授权");
  if (!String(sp.rehearsal || "").trim()) missing.push("彩排时间");
  return missing;
}

function intakeStats(event) {
  const speakers = (event && event.speakers) || [];
  const rows = speakers.map((sp) => ({ sp, missing: speakerMissing(sp) }));
  return { rows, total: rows.length, complete: rows.filter((row) => !row.missing.length).length };
}

function intakeGaps(event) {
  const gaps = completeness(event).missing.slice();
  intakeStats(event).rows.forEach(({ sp, missing }) => {
    if (missing.length) gaps.push((sp.name || "未命名") + "：" + missing.join("、"));
  });
  return gaps;
}

function parseIntakeBlock(block) {
  const draft = {
    name: block.mention || "", title: "", intro: "", story: "", takeaway: "",
    rehearsal: "", photo: "", photoStatus: "", photoConsent: ""
  };
  const fields = [
    ["name", /^(?:\d+[.、)]\s*)?(?:希望我怎么称呼你|称呼|姓名|名字)[^：:]*[：:]\s*(.*)$/],
    ["title", /^(?:\d+[.、)]\s*)?(?:开说标题|演讲标题|标题)[^：:]*[：:]\s*(.*)$/],
    ["intro", /^(?:\d+[.、)]\s*)?(?:你现在的身份|身份|现在在做的事|一句话简介|简介|自我介绍)[^：:]*[：:]\s*(.*)$/],
    ["story", /^(?:\d+[.、)]\s*)?(?:你想讲的那件事|想讲的那件事|核心故事|故事)[^：:]*[：:]\s*(.*)$/],
    ["takeaway", /^(?:\d+[.、)]\s*)?(?:你希望听众听完记住什么|听众听完记住什么|听众收获|收获)[^：:]*[：:]\s*(.*)$/],
    ["rehearsal", /^(?:\d+[.、)]\s*)?(?:你方便彩排的时间|彩排时间|彩排)[^：:]*[：:]\s*(.*)$/],
    ["photoConsent", /^(?:\d+[.、)]\s*)?(?:照片授权|授权)[^：:]*[：:]\s*(.*)$/],
    ["photo", /^(?:\d+[.、)]\s*)?(?:照片状态|照片)[^：:]*[：:]\s*(.*)$/]
  ];
  for (const line of block.lines) {
    let matched = false;
    for (const [key, pattern] of fields) {
      const match = line.match(pattern);
      if (!match) continue;
      const value = (match[1] || "").trim();
      if (key === "photoConsent") {
        if (/同意|确认|授权|可以/.test(value)) draft.photoConsent = "confirmed";
      } else if (key === "photo") {
        const pathMatch = value.match(/(?:assets\/|https?:\/\/|\/)[^\s，。]+/);
        if (pathMatch) {
          draft.photo = pathMatch[0];
          draft.photoStatus = "received";
        } else if (/已|收到|有|上传/.test(value)) {
          draft.photoStatus = "received";
        } else if (!/未|没有|待|没/.test(value)) {
          draft.photo = value;
          if (value) draft.photoStatus = "received";
        }
      } else if (value) {
        draft[key] = value;
      }
      matched = true;
      break;
    }
    if (!matched && !draft.name && line.length <= 20 && !/[：:]/.test(line) && !/^@/.test(line)) {
      draft.name = line.trim();
    }
  }
  if (!draft.name && block.mention) draft.name = block.mention;
  return draft;
}

function parseIntake(text) {
  const raw = String(text || "").trim();
  if (!raw) return [];
  const lines = raw.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  const blocks = [];
  let current = { mention: "", lines: [] };
  const push = () => {
    if (current.mention || current.lines.length) blocks.push(current);
    current = { mention: "", lines: [] };
  };
  for (const line of lines) {
    if (/^[-=]{3,}$/.test(line)) { push(); continue; }
    const mention = line.match(/^@([^\s：:，,]+)\s*(.*)$/);
    if (mention) {
      const name = mention[1];
      const rest = (mention[2] || "").trim();
      if (name === "林一" || name === "小P") {
        if (rest && /^(?:\d+[.、)]\s*)?(?:希望我怎么称呼你|称呼|姓名|名字)/.test(rest)) {
          push();
          current.lines.push(rest);
        }
        continue;
      }
      push();
      current.mention = name;
      if (rest) current.lines.push(rest);
      continue;
    }
    current.lines.push(line);
  }
  push();
  return blocks.map(parseIntakeBlock).filter((draft) => draft.name || draft.title || draft.intro || draft.story || draft.takeaway);
}

function uploadIntakePhoto(input) {

async function applyIntake() {
  if (!state.event) { toast("还没有活动主档"); return; }
  const drafts = readIntakeDrafts().filter((draft) => draft.name || draft.title || draft.intro || draft.story || draft.takeaway || draft.photo || draft.rehearsal);
  if (!drafts.length) { toast("没有可写入的分享者"); return; }
  const speakers = Array.isArray(state.event.speakers) ? state.event.speakers.slice() : [];
  const fields = ["name", "title", "intro", "story", "takeaway", "rehearsal", "photo", "photoStatus", "photoConsent"];
  for (const draft of drafts) {
    const patch = {};
    for (const key of fields) {
      const value = draft[key];
      if (key === "photoConsent") {
        if (value === "confirmed") patch[key] = value;
      } else if (String(value || "").trim()) {
        patch[key] = String(value).trim();
      }
    }
    if (!patch.name && !patch.title && !patch.intro && !patch.story && !patch.takeaway) continue;
    let index = speakers.findIndex((speaker) => speaker && speaker.name && patch.name && String(speaker.name).trim() === patch.name);
    if (index === -1 && patch.name) {
      index = speakers.findIndex((speaker) => speaker && speaker.name && String(speaker.name).trim().toLowerCase() === patch.name.toLowerCase());
    }
    if (index >= 0) speakers[index] = Object.assign({}, speakers[index], patch);
    else if (patch.name) speakers.push(Object.assign({ source: "微信群" }, patch));
  }
  state.event.speakers = speakers;
  const stats = intakeStats(state.event);
  const intake = Object.assign({}, state.event.intake || {}, {
    missing: intakeGaps(state.event),
    lastPasteAt: new Date().toISOString(),
    lastPasteChars: String(state.intakeRaw || "").length,
    source: "微信群"
  });
  delete intake.lastPaste;
  state.event.intake = intake;
  state.event.updatedAt = new Date().toISOString();
  try {
    await api("/api/data/studio", { method: "PUT", body: JSON.stringify({ data: state.studio }) });
    let workshopOk = true;
    try { await syncWorkshopOnly(); } catch (err) { workshopOk = false; }
    closeModal();
    state.intakeDraft = null;

function renderFoot() {
  const foot = $("#codexFoot");
  if (!foot) return;
  const ver = $("#codexVer");
  const btn = $("#connectBtn");
  const codex = state.health && state.health.codex;
  if (state.connecting) {
    foot.innerHTML = '<span class="dot off"></span>正在启动本地服务…';
    if (ver) ver.textContent = "通常几秒就好，请稍候";
    if (btn) { btn.hidden = false; btn.disabled = true; btn.textContent = "启动中…"; }
    return;
  }
  if (!state.health) {
    foot.innerHTML = '<span class="dot off"></span>本地服务未启动';
    if (ver) ver.textContent = state.connectError || "点下面的按钮，一键启动";
    if (btn) { btn.hidden = false; btn.disabled = false; btn.textContent = "一键启动服务"; }
    return;
  }
  if (btn) { btn.hidden = true; btn.disabled = false; }
  if (codex && codex.installed) {
    foot.innerHTML = '<span class="dot"></span>Codex 已连接';
    if (ver) ver.textContent = codex.version || "local studio";
  } else {
    foot.innerHTML = '<span class="dot off"></span>Codex 未就绪';
    if (ver) ver.textContent = "未找到 Codex CLI";
  }
}

async function checkHealth() {
  try {
    const res = await fetch(LOCAL_BASE + "/api/health", { cache: "no-store" });
    if (!res.ok) return null;
    return await res.json();
  } catch (err) {
    return null;
  }
}

function connectLocal() {
  if (state.connecting) return;
  state.connecting = true;
  state.connectError = "";
  renderFoot();
  try { window.location.href = "kaishuo://connect?from=page"; } catch (err) {}
  const startedAt = Date.now();
  const timer = setInterval(async () => {
    const health = await checkHealth();
    if (health) {
      clearInterval(timer);
      state.connecting = false;
      state.health = health;
      if (LOCAL_BASE) { window.location.replace(LOCAL_BASE + "/"); return; }
      window.location.reload();
      return;
    }
    if (Date.now() - startedAt > 45000) {
      clearInterval(timer);
      state.connecting = false;
      state.connectError = "启动超时：先双击一次 start.bat";
      renderFoot();
      toast("没能自动启动，请先双击一次 start.bat");
    }
  }, 1200);
}

let healthCheckedAt = 0;
async function refreshHealth() {
  if (Date.now() - healthCheckedAt < 20000) return;
  healthCheckedAt = Date.now();
  const health = await checkHealth();
  if (health) {
    if (!state.health) {
      if (LOCAL_BASE) { window.location.replace(LOCAL_BASE + "/"); return; }
      window.location.reload();
      return;
    }
    state.health = health;
    renderFoot();
    return;
  }
  if (state.health) {
    state.health = null;
    renderFoot();
  }
}

function projectStore() {
  if (!state.projects || typeof state.projects !== "object") state.projects = { projects: [] };
  if (!Array.isArray(state.projects.projects)) state.projects.projects = [];
  return state.projects;
}
function projectById(id) {
  return projectStore().projects.find((p) => p && p.id === id) || null;
}
function projectOpenQuestions(project) {
  return ((project && project.questions) || []).filter((q) => q && q.status !== "answered" && q.status !== "archived");
}
function projectAnsweredQuestions(project) {
  return ((project && project.questions) || []).filter((q) => q && q.status === "answered");
}
function projectQuestionById(project, id) {
  return ((project && project.questions) || []).find((q) => q && q.id === id) || null;
}
function projectTouch(project) {
  const stamp = new Date().toISOString();
  project.updatedAt = stamp;
  project.lastTouchAt = stamp;
}
function projectTimeLabel(value) {
  const d = new Date(value || 0);
  if (Number.isNaN(d.getTime())) return "";
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  return (d.getMonth() + 1) + "." + d.getDate();
}
function projectQuestionLabel(status) {
  return { open: "待想", thinking: "在想", answered: "已回答", archived: "已作废" }[status] || "待想";
}

function viewProjects() {
  const store = projectStore();
  if (!state.projectId) state.projectQuestionId = "";
  if (state.projectId) return viewProjectWorkspace();
  const projects = store.projects.slice().sort((a, b) => String(b.lastTouchAt || b.updatedAt || "").localeCompare(String(a.lastTouchAt || a.updatedAt || "")));
  const cards = projects.map(projectCardHTML).join("");
  return '<div class="projects-wrap view">' +
    '<div class="projects-head"><div><h2>让事情先在问题里长出来</h2><p>不写现状总结，不排优先级。只留下此刻真正值得想的问题。</p></div>' +
    '<button class="btn primary small" onclick="openNewProject()">＋ 新建项目</button></div>' +
    '<div class="projects-count">' + (projects.length ? projects.length + " 个项目 · " + projects.reduce((n, p) => n + projectOpenQuestions(p).length, 0) + " 个问题待想" : "PROJECTS / 从一个小念头开始") + '</div>' +

    '</div>';
}

async function createProjectFromModal() {
  const titleEl = $("#pNewTitle");
  const ideaEl = $("#pNewIdea");
  const title = (titleEl ? titleEl.value : "").trim();
  const idea = (ideaEl ? ideaEl.value : "").trim();
  if (!idea) { toast("先放一句话进来"); if (ideaEl) ideaEl.focus(); return; }
  const stamp = new Date().toISOString();
  const project = {
    id: "prj-" + Date.now().toString(36) + "-" + uid(),
    title: title || "未命名项目",
    createdAt: stamp,
    updatedAt: stamp,
    lastTouchAt: stamp,
    feed: [{ id: "feed-" + uid(), text: idea, at: stamp }],
    questions: [],
    nodes: [{ id: "node-" + uid(), text: "起点：" + idea.slice(0, 180), summary: "", parentId: "", questionId: "", at: stamp }],
    lastNote: ""
  };
  projectStore().projects.unshift(project);
  state.projectId = project.id;
  state.projectQuestionId = "";
  closeModal();
  state.projectBusy = true;
  render();
  persistProjects();
  try {
    const result = await projectAsk("create", project, { input: idea });
    if (!title && result.title) project.title = result.title;
    const added = addProjectQuestions(project, result.questions, "ai");
    project.lastNote = result.note || (added ? "先把这几个问题放着，选一个进入。" : "");
    if (!added) addProjectQuestions(project, projectStarterQuestions(idea), "fallback");
  } catch (err) {
    addProjectQuestions(project, projectStarterQuestions(idea), "fallback");
    project.lastNote = "AI 暂时没接上，先给你三个通用问题.";
    toast("项目已创建；AI 追问失败：" + err.message);
  } finally {
    projectTouch(project);
    state.projectBusy = false;
    persistProjects();
    render();
  }
}

function projectStarterQuestions(idea) {
  const hint = String(idea || "").replace(/\s+/g, " ").slice(0, 26);
  return [
    "如果把「" + hint + "」缩成一个最小动作，那是什么？",
    "现在最关键的未知，不是资源，而是哪一个判断？",
    "什么结果出现，才说明这件事真的成立了？"
  ];
}

function addProjectQuestions(project, texts, source) {
  let added = 0;
  (Array.isArray(texts) ? texts : []).forEach((text) => {
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    if (!clean || clean.length < 4) return;
    const norm = clean.replace(/[\s，。？！、：:；;,.?!]/g, "");
    const duplicate = (project.questions || []).some((q) => String(q.text || "").replace(/[\s，。？！、：:；;,.?!]/g, "") === norm);
    if (duplicate) return;
    project.questions = project.questions || [];
    project.questions.push({
      id: "q-" + Date.now().toString(36) + "-" + uid(),
      text: clean.slice(0, 240),
      status: "open",
      answer: "",
      summary: "",
      createdAt: new Date().toISOString(),
      source: source || "ai"
    });
    added += 1;
  });
  return added;
}

async function projectAsk(mode, project, extra) {
  const payload = Object.assign({ mode, project: { title: project.title, recentFeed: (project.feed || []).slice(-8).map((f) => f.text), openQuestions: projectOpenQuestions(project).map((q) => q.text), answered: projectAnsweredQuestions(project).slice(-6).map((q) => ({ question: q.text, summary: q.summary || q.answer })) } }, extra || {});
  return api("/api/projects/ask", { method: "POST", body: JSON.stringify(payload) });
}

function persistProjects() {
  if (state.projectSaveTimer) clearTimeout(state.projectSaveTimer);
  projectStore().selectedProjectId = state.projectId || "";
  projectStore().selectedQuestionId = state.projectQuestionId || "";
  state.projectSaveTimer = setTimeout(async () => {
    state.projectSaveTimer = null;
    try { await api("/api/data/projects", { method: "PUT", body: JSON.stringify({ data: projectStore() }) }); }
    catch (err) { toast("项目保存失败：" + err.message); }
  }, 220);
}

async function sendProjectIdea() {
  if (state.projectBusy) return;
  const project = projectById(state.projectId);
  const input = $("#projectIdea");
  const text = input ? input.value.trim() : "";
  if (!project || !text) { toast("先写一句想丢进去的话"); return; }
  project.feed = project.feed || [];
  project.feed.push({ id: "feed-" + uid(), text, at: new Date().toISOString() });
  project.lastNote = "";
  projectTouch(project);
  if (input) input.value = "";
  state.projectBusy = true;
  render();
  persistProjects();
  try {
    const result = await projectAsk("feed", project, { input: text });
    if (project.title === "未命名项目" && result.title) project.title = result.title;
    const added = addProjectQuestions(project, result.questions, "ai");
    project.lastNote = result.note || (added ? "这段话长出了 " + added + " 个新问题。" : "记下了。这段话暂时没有长出新的未知。");
  } catch (err) {
    addProjectQuestions(project, ["关于「" + text.replace(/\s+/g, " ").slice(0, 28) + "」，现在最需要想清楚的是什么？"], "fallback");
    project.lastNote = "已记下，先补一个问题。";
    toast("AI 追问失败，已保留这段话：" + err.message);
  } finally {
    projectTouch(project);
    state.projectBusy = false;
    persistProjects();
    render();
  }
}

function selectProjectQuestion(qid) {
  const project = projectById(state.projectId);
  if (!project) return;
  const q = projectQuestionById(project, qid);
  if (!q) return;
  state.projectQuestionId = qid;
  if (q.status === "open") q.status = "thinking";
  projectTouch(project);
  saveUI();
  persistProjects();

}

function readProjectAnswer() {
  const el = $("#projectAnswer");
  return el ? el.value.trim() : "";
}

function saveProjectAnswerOnly() {
  const project = projectById(state.projectId);
  const q = project && projectQuestionById(project, state.projectQuestionId);
  if (!project || !q) return;
  q.answer = readProjectAnswer();
  if (q.answer && q.status !== "answered") q.status = "thinking";
  projectTouch(project);
  persistProjects();
  toast("回答已保存");
}

async function submitProjectAnswer() {
  if (state.projectBusy) return;
  const project = projectById(state.projectId);
  const q = project && projectQuestionById(project, state.projectQuestionId);
  if (!project || !q) return;
  const answer = readProjectAnswer();
  if (!answer) { toast("先写下你的回答"); const el = $("#projectAnswer"); if (el) el.focus(); return; }
  q.answer = answer;
  q.status = "answered";
  q.answeredAt = new Date().toISOString();
  q.summary = q.summary || localProjectSummary(answer);
  projectTouch(project);
  const parentId = (project.nodes || []).length ? project.nodes[project.nodes.length - 1].id : "";
  state.projectBusy = true;
  persistProjects();
  render();
  try {
    const result = await projectAsk("answer", project, { question: q.text, answer });
    if (result.summary) q.summary = result.summary;
    const nodeText = result.node || q.summary;
    if (nodeText) addProjectNode(project, nodeText, q.id, parentId);
    const added = addProjectQuestions(project, result.questions, "ai");
    project.lastNote = result.note || (added ? "回答已经挂上脉络，又长出 " + added + " 个新问题。" : "回答已经挂上脉络。");
  } catch (err) {
    q.summary = localProjectSummary(answer);
    addProjectNode(project, q.summary, q.id, parentId);
    project.lastNote = "回答已保存，并挂上了一个结论节点。";
    toast("回答已保存；AI 整理失败：" + err.message);
  } finally {
    projectTouch(project);
    state.projectBusy = false;
    persistProjects();
    render();
  }
}

function localProjectSummary(text) {
  return String(text || "").replace(/\s+/g, " ").trim().slice(0, 96) || "这一题已经有了一个初步回答。";
}

function addProjectNode(project, text, questionId, parentId) {
  project.nodes = project.nodes || [];
  project.nodes.push({
    id: "node-" + Date.now().toString(36) + "-" + uid(),
    text: String(text || "").slice(0, 500),
    summary: "",
    parentId: parentId || "",
    questionId: questionId || "",
    at: new Date().toISOString()
  });
}
